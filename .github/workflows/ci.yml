name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10.33.4'

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

  lint:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test-unit:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit

  test-components:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:components

  # =========================================================================
  # test-integration — Story 1.4 (CI-001 RESOLVED via reuso biolink-dev)
  # =========================================================================
  # Modelo: testes integration apontam para o MESMO projeto Supabase de dev
  # (ibpliihqaceafdykgwiu / biolink-dev). Isolamento por convenção de prefixo:
  # fixtures de teste usam username 'cifx-*' e UUIDs determinísticos
  # (00000000-0000-0000-0000-000000001*). Cleanup acontece em beforeAll/afterAll
  # dos próprios testes (tests/integration/helpers/test-users.ts) usando
  # service-role admin client.
  #
  # Trade-off aceito (vs Supabase Branching original de Story 1.3):
  #   - perde isolamento por PR (compensa: solo dev, sem PRs concorrentes)
  #   - ganha simplicidade e zero custo recorrente
  #   - preserva slot do free tier para biolink-prod futuro
  #
  # Migrações: dev aplica localmente via `pnpm exec supabase db push` ANTES
  # de abrir o PR. CI NÃO aplica migrations — testa contra o estado atual de
  # biolink-dev. Se uma migration pendente for esquecida, este job falha com
  # erro de schema, sinalizando claramente o esquecimento.
  #
  # Upgrade path: quando projeto monetizar/ganhar contribuidores, criar
  # biolink-ci dedicado e trocar 2 secrets (NEXT_PUBLIC_SUPABASE_URL + ANON_KEY
  # + SERVICE_ROLE_KEY). Nenhuma mudança de código necessária.

  test-integration:
    needs: install
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SITE_URL: 'https://new-biolink.vercel.app'
      HASH_SALT: ${{ secrets.HASH_SALT }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Run integration tests
        run: pnpm test:integration

  build:
    needs: [lint, typecheck, test-unit, test-components]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SITE_URL: 'https://new-biolink.vercel.app'
          HASH_SALT: ${{ secrets.HASH_SALT }}
        run: pnpm build

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level critical
      - run: pnpm audit --json || true

  # =========================================================================
  # health-check — Story 1.9 (AC6 / DP-3, default aprovado pelo PO)
  # =========================================================================
  # Canary de produção: após o merge em `main`, a integração Vercel↔GitHub
  # dispara o deploy de prod de forma ASSÍNCRONA (não é step do CI). Este job
  # faz polling de https://new-biolink.vercel.app/ até obter HTTP 200 + o body
  # conter o CTA esperado da landing pública (visitante não-autenticado vê
  # "Criar minha página"), tolerando a janela de deploy. Verificação por
  # curl + grep apenas — sem framework E2E (PRD §Requisitos de Testes).
  # URL pública, sem secrets (NFR10). Só roda em push:main (≠ AC4/DP-1, que
  # é evidência manual). Teto de ~5 min (30 tentativas × 10s).
  health-check:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Poll production canary (HTTP 200 + CTA presente)
        run: |
          set -uo pipefail
          URL="https://new-biolink.vercel.app/"
          EXPECTED="Criar minha página"
          MAX_ATTEMPTS=30
          SLEEP_SECONDS=10
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            HTTP_CODE=$(curl -sSL -o body.html -w '%{http_code}' --max-time 20 "$URL" || echo "000")
            if [ "$HTTP_CODE" = "200" ] && grep -qF "$EXPECTED" body.html; then
              echo "✅ Canary OK na tentativa ${attempt}: HTTP ${HTTP_CODE}, CTA presente."
              exit 0
            fi
            echo "⏳ Tentativa ${attempt}/${MAX_ATTEMPTS}: HTTP ${HTTP_CODE}, CTA ainda ausente (deploy Vercel pode estar em progresso). Aguardando ${SLEEP_SECONDS}s..."
            sleep "$SLEEP_SECONDS"
          done
          echo "❌ Canary FALHOU após ~$((MAX_ATTEMPTS * SLEEP_SECONDS))s: a URL de produção não retornou 200 com o CTA esperado."
          echo "--- Últimos bytes do body recebido (debug) ---"
          tail -c 2000 body.html || true
          exit 1
