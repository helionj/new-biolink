status_reason: |
  Implementação completa dos 13 ACs da Story 5.3 (primitives audit Soft Studio
  — 13 shadcn em components/ui/ + 2 status tokens novos --success/--warning
  em globals.css per Task 8.0 pré-flight). Auditoria por primitive vs spec
  §5.2 L1252-1267 (matriz canônica) materializada conforme: Button ghost
  `bg-muted` → `bg-accent` (peach hover, DEV-A1 descoberto durante audit —
  estado pré-5.3 NÃO consumia --accent, divergência material corrigida); Card
  +shadow-sm warm-tinted plum; Input/Textarea destructive ring alpha /20 →
  /30 per AC3; Dialog/AlertDialog rounded-xl → rounded-2xl + shadow-lg; Sheet
  radius condicional por side via data-[side=*]:rounded-{t/b/l/r}-2xl;
  DropdownMenu content rounded-lg → rounded-xl; Switch data-checked:bg-primary
  → data-checked:bg-accent (DEV-A2 — selector pattern Base UI mapping vs Radix
  da story); Avatar/Label diff vazio (já compliant pré-5.3, AC9/AC10
  satisfeitas por consumo automático); Form FormMessage +AlertCircleIcon
  inline com a11y aria-hidden; Sonner overrides (position responsiva
  matchMedia + per-type border-l-4 com status tokens). Quality gates locais
  re-rodados independentemente pelo @qa: typecheck exit 0 ✅ / lint zero
  warnings ✅. Gates pesados (test:components 194/194 em 545s,
  build Next 16.2.5 Turbopack 101s compile + 86s TS + 15/15 static pages)
  validados pelo @dev em sessão develop — outputs capturados em
  Debug Log References da story; 4 snapshots atualizados conscientemente
  (card/dialog/form/input — todos className-only, zero DOM/ARIA/role/structure
  changes); PublicPage snapshot intacto per Task 13.4. DEV-A1..A4 + DEV-B..E
  materializadas e documentadas em Completion Notes. DEV-D (Task 8.0
  pré-flight) aplicado em 5 locais de globals.css (light/dark/brand/@media
  prefers-color-scheme fallback/@theme inline map) com tokens spec verbatim
  §1.2 L150-204. Article IV (No Invention) preservada — todos hex spec
  verbatim; foreground pairs status (#FFFFFF light/brand, #0E2418/#2E1D0A
  dark) justificados como pattern parity com primary-foreground/destructive-
  foreground (não-invention, deterministic high-contrast text). Article III
  (Story-Driven) preservada — escopo restrito ao Source Tree listado; zero
  page-level toques. Backward compat ✓ — zero API change nos primitives;
  consumers re-renderam automaticamente via className mudanças. Security
  clean: story toca apenas className/className-conditional + CSS variables
  status + 1 import lucide (AlertCircleIcon) — zero env vars, zero RLS,
  zero auth, zero hardcoded secrets; pre-commit hooks (gitleaks/lint-staged)
  PASS no commit 855130f. 3 observações: **OBS-001 LOW** (DEV-A4 confirmado
  — spec L151 + L204 warning ratios INFLATED: real WCAG ratios light/brand
  `#B8742A vs #FFFFFF = 3.770` vs spec claims 4.6/4.4 — discrepância similar
  a DEV-9 5.2 destructive); **OBS-002 LOW** (AC8 minor inaccuracy: Story
  claim thumb-vs-track 1.92:1; real 1.691:1; rationale "shadow + 1px
  border" não materializa no código — thumb usa `ring-0` sem shadow visível;
  WCAG §1.4.11 ainda satisfeito via shape-based identification thumb
  circular + position transition, mas spec wording deve ser revisitado);
  **OBS-003 LOW** (cosmético: @dev importou `AlertCircleIcon` alias em vez
  de `AlertCircle` literal da story spec — ambos válidos lucide-react,
  zero impact funcional, typecheck PASS); **PERF-001 PENDING-CI**
  (Lighthouse CI dispara via trigger `paths: [components/ui/**]` ou via
  `app/**` — gate threshold ≥0.85 mantido; bundle delta ≈ 0 KB esperado
