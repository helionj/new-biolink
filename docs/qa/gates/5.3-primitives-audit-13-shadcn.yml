top_issues:
  - id: 'OBS-001'
    severity: low
    finding: |
      **DEV-A4 confirmado por recalc independente WCAG W3C @qa.** Spec
      `frontend-spec.md` §1.2.1 L151 reivindica `warning #B8742A vs
      #FFFFFF = 4.6:1 AA` mas recalc independente confirma **3.770:1**
      (FAIL AA por 0.730, similar a DEV-9 destructive Story 5.2). Spec
      §1.2.3 L204 reivindica brand `warning #B8742A vs background ...`
      claims 4.4:1 — mesma fonte do hex, mesmo cálculo, mesmo resultado
      real 3.770. Spec autor errou cálculo de luminância para warning
      (padrão idêntico do DEV-9 destructive — autor parece ter usado
      fórmula incorreta de luminância para esta família de hex amber/red).

      **Sem impacto material na Story 5.3:** AC7(b) usa `--warning` como
      `border-left 4px` em Sonner toast — elemento gráfico UI, NÃO texto.
      WCAG §1.4.11 (non-text contrast) threshold é **3.0:1**, satisfeito
      por margem 0.770 (3.770 ≥ 3.0). Eventual uso futuro de `--warning`
      como bg com texto branco em cima FALHARIA AA por 0.730 — atualmente
      zero usage, mas pré-emptive concern.

      Issue **descoberto** no gate (durante recalc Task 8.0.2), **não
      regressão** da story. Foreground `--warning-foreground: #FFFFFF`
      adicionado pré-emptive (NH-4 do @po validate) está consistente com
      pattern parity, mas materializa essa falha se warning bg with white
      text for usado futuramente.

      Discoveries adicionais durante recalc independente:
      - light/brand success #2B7A5E vs #FFFFFF = **5.188** (spec L150
        claims 5.2 — accurate ✓)
      - dark success #7AC9A0 vs #0E2418 = **8.324** (spec L177 claims 6.8
        vs unspecified fg — fg foi @dev decision pattern parity)
      - brand success #2B7A5E vs #FFFFFF = **5.188** (spec L203 claims
        5.0 — accurate ✓)
      - dark warning #E8B978 vs #2E1D0A = **8.981** (high contrast ✓)
    suggested_action: |
      Não-bloqueante para Story 5.3 (AC7(b) usage é graphical, WCAG
      §1.4.11 satisfeito). Recomendações:
      (1) Registrar **`[STORY-5.3-F1]` LOW** no `docs/STORY-BACKLOG.md`:
          "Amend `frontend-spec.md` §1.2.1 L151 + §1.2.3 L204 com ratios
          warning corretos pós-recalc WCAG W3C (`#B8742A vs #FFFFFF =
          3.77` light/brand FAIL como text bg; OK como border 3.0
          threshold). Considerar (a) manter `#B8742A` e adicionar nota
          spec "warning usable apenas como bg graphical / border / large
          text"; OU (b) escurecer mais (ex.: `#9D5F1F` ~4.8 vs white)
          para passar AA também como text bg. Decisão impacta futuras
          stories que usem `--warning` em bg/text components (warning
          Alert badge, etc.). Owner: `@ux-design-expert` (consolidar
          com `[STORY-5.2-F1]` LOW destructive amend numa única passada
          de spec hygiene)." Effort: ~30min (doc-only).
      (2) Em **Story 5.6** quando "Vibrante" rebrand for executada
          (Profile/Theme/Account): se algum surface adicionar `bg-warning
          text-warning-foreground` (warning Alert, badge, etc.), validar
          que `--warning-foreground: #FFFFFF` é o branco correto vs `bg-
          warning #B8742A` light/brand — atualmente falha AA 3.77 < 4.5.
          Solução: mudar foreground para um dark (#2E1D0A?) OU mudar bg
          para escurecer (per ponto 1.b).
      (3) Sem ação obrigatória pré-merge. Documentar OBS-001 no Change
          Log da Story 5.3 ao mover Status InReview → Done (post-push).

  - id: 'OBS-002'
    severity: low
    finding: |
      **AC8 (Switch peach ON state) minor spec inaccuracy.** Story AC8
      nota: "thumb #FFFFFF sobre #FFB5A7 peach light = 1.92:1 (baixo,
      mas thumb é elemento gráfico com sombra, não texto — passa por
      contornos visuais + state border per WCAG 2.1 §1.4.11 non-text
      contrast 3:1 ✓ via `--shadow-sm` warm tint + 1px border)."

      Recalc independente @qa: real ratio é **1.691:1** (não 1.92 como
      claimed). Mais importante: o código atual do Switch thumb
      (`components/ui/switch.tsx:26`) tem `ring-0` (zero ring) e
      **nenhum** `shadow-*` class — ou seja, "shadow + 1px border"
      rationale da story NÃO materializa no código.

      **Avaliação técnica WCAG §1.4.11 (Non-text Contrast):** A norma
      requer 3:1 entre "visual information required to identify user
      interface components and states from adjacent colors". Para Switch:
      - Componente identificável por SHAPE (track horizontal + thumb
        circular)
      - State indicator é POSIÇÃO do thumb (left=off, right=on), não
        cor do thumb
      - Distinção thumb-vs-track via shape (circular vs retangular) +
        transition-transform animation; cor é decorativa

      Per WCAG 2.1 understanding doc + W3C examples (radio button, switch
      patterns), shape-based identification SATISFIES §1.4.11 sem
      necessidade de 3:1 contrast colorimétrico. Spec wording da Story
      AC8 mistura conceitos (cita `--shadow-sm` que existe como token
      mas NÃO é aplicado no thumb; cita "1px border" que também não está
      no thumb className). Implementação está accessible per WCAG, mas
      rationale da story está parcialmente desatualizado.
    suggested_action: |
      Não-bloqueante. A11y real está OK (WCAG §1.4.11 via shape +
      position). Recomendações:
      (1) Tightening cosmético opcional: em refresh futuro do
          `frontend-spec.md` §5.2 L1263 (Switch description), atualizar
          rationale para citar shape-based identification + transition
          + dark border (que existe via `border border-transparent` na
          Root + `dark:data-unchecked:bg-foreground` dark thumb). Custo
          ~10min, doc-only. Não criar follow-up dedicado — pode ser
          incluído no `[STORY-5.3-F1]` LOW se for amendado.
      (2) Em **Story 5.8 (Motion + polish)** quando spring transition
          for adicionada ao Switch (per spec §5.2 L1263 "spring
          transition"), considerar adicionar `shadow-sm ring-1 ring-
          foreground/10` ao thumb para reforçar separação visual peach
          ON state — eleva contraste perceptual sem mudar tokens.
          Decisão @ux-design-expert.

  - id: 'OBS-003'
    severity: low
    finding: |
      **Cosmético — import name divergence.** Story 5.3 spec (Task 12.2
      + Task 12.3) usa nome `AlertCircle` para o ícone de FormMessage.
      @dev importou `AlertCircleIcon` (alias com suffix `Icon`). Ambos
      são exports válidos do `lucide-react` (a lib expõe ambos os nomes
      desde v0.6+; `AlertCircleIcon` é o pattern mais novo com suffix
      explícito para evitar colisão com globals/types).

      Typecheck PASS (zero erros). Funcionalidade idêntica. Story spec
      poderia ter sido mais permissiva ("`AlertCircle` ou alias com
      suffix `Icon`").
    suggested_action: |
      Nenhuma. Aceitar a divergência cosmética. Padrão de import com
      suffix `Icon` é melhor para clareza em greps futuros
      (`AlertCircleIcon` é unambíguo; `AlertCircle` pode colidir com
      type names ou outros patterns). Validar consistency em stories
      futuras (5.4-5.7 que usarão mais ícones lucide).

  - id: 'PERF-001'
    severity: low
    finding: |
      Lighthouse Performance score do `/` e `/[username]` ainda não
      medido empiricamente nesta validação local — vai ser medido pelo
      workflow `.github/workflows/lighthouse.yml` (Story 3.5 Task 6,
      estabilizado em runs:3 + mediana per [STORY-3.5-F3] Done)
      disparado no PR via trigger `paths: [app/**, components/**]`.
      Match definitivo: story modifica `app/globals.css` + 13 files
      em `components/ui/`. Bundle expected delta ≈ **0 KB** (mudanças
      são CSS classnames via Tailwind v4; 2 status tokens novos
      ocupam ~150 bytes gz uma vez compilados; lucide-react
      AlertCircleIcon adicionado em form.tsx já é re-export do mesmo
      bundle pois lucide é tree-shakeable e form.tsx já importava
      lucide via consumers indiretos — verificar no analisador
      bundle). Margem AC3 da Story 3.5 (< 200 KB) mantida.
    suggested_action: |
      Aceitar como gate-PASS-com-monitoramento (padrão idêntico Story
      5.2 PERF-001). @devops deve:
      (1) Verificar Lighthouse CI no PR como housekeeping. Se workflow
          falhar por flake, re-run; se 1 das 3 runs falhar mas median
          passar, OK (mediana é o critério canônico per
          [STORY-3.5-F3]).
      (2) Capturar First Load JS de `/` e `/[username]` reportados pelo
          workflow. Confirmar **mantém ou melhora** vs baseline pós-5.2
          (~180-185 KB esperado pós-DM Sans swap). Se piorar
          inesperadamente (>200 KB), investigar antes do merge.
      (3) Documentar resultado real no Change Log da story ao mover
          Status Ready for Review → Done.

