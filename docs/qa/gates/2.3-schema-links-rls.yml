top_issues:
  - id: 'DX-001'
    severity: low
    category: 'maintainability'
    finding: >-
      pnpm db:types regen produz diff cosmético (Supabase CLI raw output:
      double quotes + sem semicolons) vs versão commitada (Prettier-processed).
      Tech-debt low herdado das Stories 1.4/2.2 (mesma observação nos gates
      anteriores).
    suggested_action: >-
      Não-bloqueante e JÁ mitigado nesta story: Task 3.3 aplica
      `prettier --write lib/supabase/types.ts` após o regen (verificado
      idempotente). Fix permanente sugerido (housekeeping): encadear no script
      package.json `"db:types": "... > lib/supabase/types.ts && prettier --write lib/supabase/types.ts"`.
  - id: 'DEV-6-RESIDUAL'
    severity: low
    category: 'process'
    finding: >-
      Task 5.1 (`supabase db reset --linked`) pulada por decisão explícita do
      usuário (operação destrutiva em projeto compartilhado biolink-dev — mesma
      classe de risco que motivou confirmação obrigatória em 2.2). A
      reaplicação from-scratch de 0001+0002+0003+0004 + seed.sql não foi
      exercitada diretamente.
    suggested_action: >-
      Não-bloqueante — risco residual negligenciável: (a) `db push --linked`
      aplicou 0004 limpo e `migration list` 0001-0004 Local=Remote
      (re-verificado via MCP: 8 objetos de schema corretos + links count=0);
      (b) 0001-0003 inalteradas e já provadas no `db reset` da própria 2.2;
      (c) 0004 idempotente (CREATE/DROP IF EXISTS) + rollback companion
      reverse-order idempotente existe; (d) suíte RLS 60/60 exercita o schema
      end-to-end; (e) seed.sql não modificado (links não é seedado por design —
      `db reset` só confirmaria links vazia, que o MCP já confirma:
      row_count=0). Sugestão: executar a validação from-scratch
      oportunisticamente num ambiente descartável/branch DB futuro (não-MVP).

waiver: { active: false }

quality_checks:
  code_review:
    status: PASS
    notes: |
      0004_links.sql segue DDL canônico de docs/architecture/schema-design.md
      §4 #links verbatim: links com id PK gen_random_uuid() independente,
      page_id NOT NULL FK pages(id) ON DELETE CASCADE, title CHECK
      (length BETWEEN 1 AND 100 — rejeita vazio), url CHECK (~* '^https?://'),
      icon CHECK (NULL OR slug lucide ^[a-z0-9-]{1,40}$), is_visible boolean
      DEFAULT true, position integer CHECK (>= 0), timestamps, CONSTRAINT
      uniq_links_page_position UNIQUE (page_id, position) DEFERRABLE INITIALLY
      DEFERRED, COMMENT ON TABLE + todas as colunas (autodocumentação, estilo
      0002/0003). 2 índices: idx_links_page_id (FK manual — Postgres não cria
      auto) + idx_links_page_id_position_visible PARCIAL WHERE is_visible=true
      (Q4 RESOLVED, serve AP-1 render público). Trigger trg_links_set_updated_at
      REUSA set_updated_at() de 0002 (IDS REUSE — não recriada; mesmo padrão
      0003). RLS: 2 policies SELECT permissivas separadas (links_select_own
      USING EXISTS(pages owner) + links_select_public USING is_visible=true AND
      EXISTS(pages published), OR-combinadas pelo Postgres) + links_insert_own
      WITH CHECK + links_update_own USING+WITH CHECK (anti-reassign) +
      links_delete_own USING — naming casa verbatim com AC3, estilo "1 policy
      por preocupação" de 0002/0003. Predicado composto via subquery EXISTS …
      pages (links não tem profile_id — ownership/publicação vivem em pages).
      AC4: comentário SQL explícito (§5) documenta gaps-on-delete sancionado
      (Q1 RESOLVED) — SEM trigger shift-on-delete (criá-lo contrariaria decisão
      arquitetural fechada). Rollback companion em ordem reversa de dependências
      (trigger→policies→índices→tabela), todos DROP IF EXISTS (idempotente),
      bloco de verificação pós-rollback, NOT rolled back correto (extensions/
      set_updated_at/profiles/pages/theme_preset/trigger pertencem a 0002/0003;
      0004 não toca o trigger).
  unit_tests:
    status: N/A
    notes: |
      Story 2.3 é puramente SQL (DDL + índices + RLS policies). Não há lógica
      TS unitestável — lib/supabase/types.ts é gerado, não testado
      isoladamente. Toda validação acontece em integration tests contra
      Postgres real (mesma situação das siblings 1.4/2.2 — Done). project
      Vitest `unit` continua passWithNoTests:true.
  acceptance_criteria:
    status: PASS
    notes: |
      AC1 (migration links: id, page_id FK, title, url, icon, is_visible,
      position, created_at, updated_at): PASS — verificado via Supabase MCP
      contra biolink-dev: col_count=9, 4 CHECK constraints (title/url/icon/
      position), FK links_page_id_fkey deltype=c (CASCADE), timestamps; tipos
      exatos do DDL canônico. links vazia (row_count=0 — não seedado/
      bootstrapado; conteúdo user-created por design, Stories 2.5/2.6).
      AC2 (constraint: position UNIQUE per page_id): PASS — uniq_links_page_
      position UNIQUE(page_id,position) DEFERRABLE INITIALLY DEFERRED
      confirmado via MCP; cenário (k) valida 23505 em colisão same-page +
      coexistência cross-page (UNIQUE é per page_id, não global).
      AC3 (RLS select_own + insert_own + update_own + delete_own +
      select_public joined com pages.is_published=true e links.is_visible=
      true): PASS — 5 policies PERMISSIVE confirmadas via MCP. links_select_
      own/insert_own/update_own/delete_own via EXISTS(pages WHERE profile_id=
      auth.uid()); links_select_public via is_visible=true AND EXISTS(pages
      WHERE is_published=true). RLS habilitado (relrowsecurity=true via MCP).
      Validado por cenários a-j.
      AC4 (Trigger OU Server Action garante position contígua após delete):
      PASS — entregável de SCHEMA é a constraint UNIQUE DEFERRABLE INITIALLY
      DEFERRED (primitivo que habilita reorder atômico transacional). Per
      schema-design.md §7 Q1 RESOLVED (decisão arquitetural FECHADA): gaps-on-
      delete sancionado, trigger shift-on-delete REJEITADO (lock contention;
      client ordena por position ASC e ignora gaps). AC4 oferece "Trigger OU
      Server Action" — a lógica de contiguidade é a Server Action
      reorderLinks() da Story 2.6 (decomposição de épico do PRD, fora de
      escopo de 2.3). NÃO criar o trigger é a decisão arquitetural correta
      (criá-lo seria invenção contra Q1 RESOLVED — Constitution Art. IV).
      Cenário (d) demonstra gap-on-delete sancionado. @architect CONFIRMA
      esta decisão de domínio (ver deviations_reviewed DEV-4).
      AC5 (testes RLS cobrem todas as combinações + caso de inserir link em
      página de outro usuário deve falhar): PASS — 11 cenários (a-k) em
      tests/integration/rls/links.test.ts. Caso explícito do AC5 = cenário (e):
      sessions.bob.client tenta INSERT com page_id=alicePageId → erro RLS
      (42501) + verificação via admin de que nenhuma row foi criada. Supera
      AC5 (owner insert/read-vis+invis/update/delete; non-owner insert-blocked/
      read-public/blocked-invisible/blocked-unpublished/update+delete-blocked;
      anon read-public/blocked/writes-blocked; AC2 collision+cross-page). REUSE
      test-users.ts sem modificar (IDS REUSE; page bootstrapada por trigger
      serve de page_id). Re-executado independentemente pelo @architect: 60/60.
  no_regressions:
    status: PASS
    notes: |
      Stories 1.1-2.2 mantidas verdes: test:integration 60/60 (6 arquivos —
      links nova + profiles/pages/auth/middleware/server-actions), re-rodado
      independentemente pelo @architect (88s). 0004 NÃO toca trigger
      on_auth_user_created/auth_user_created, set_updated_at(), extensions,
      profiles, pages, theme_preset (0002/0003 intocadas) — zero superfície de
      regressão. typecheck/lint/build exit 0 com lib/supabase/types.ts
      regenerado (inclui links + FK page_id→pages isOneToOne:false N:1).
      Rollback de 0004 não toca artefatos de 0002/0003.
  performance:
    status: PASS
    notes: |
      2 índices dimensionados por padrão de acesso (schema-design.md §6 — Q4
      RESOLVED): idx_links_page_id (FK, serve AP-2 dashboard list — Postgres
      não cria índice FK automático) + idx_links_page_id_position_visible
      PARCIAL WHERE is_visible=true (serve AP-1 render público ordenado,
      permite index-only scan, footprint reduzido por filtrar invisíveis).
      Índice automático da constraint UNIQUE não serve queries (só
      integridade) — os 2 índices acima são necessários e suficientes.
      Subquery RLS EXISTS(pages …) reavaliada por linha mitigada por
      pages.profile_id UNIQUE auto-index (0003) + idx_links_page_id;
      auth.uid() STABLE no Supabase (cacheable por statement). Migration
      aplica em <2s. Sem N+1, sem full table scan.
  security:
    status: PASS
    notes: |
      Defense-in-depth: (1) RLS habilitada (ALTER TABLE ENABLE ROW LEVEL
      SECURITY — confirmado via MCP relrowsecurity=true); (2) ownership
      composta — links não tem profile_id, toda policy faz EXISTS subquery a
      pages (owner = pages.profile_id=auth.uid()); (3) links_insert_own WITH
      CHECK impede inserir link em page alheia = caso explícito do AC5
      (cenário e valida 42501 + admin verify 0 rows); (4) links_update_own
      USING+WITH CHECK (simetria anti-reassign — impede mover link p/ page de
      outro user via UPDATE de page_id; mesmo hardening de pages_update_own
      0003); (5) leitura pública exige is_visible=true AND pages.is_published=
      true (cenários g/h validam invisível e page não-publicada → 0 rows);
      (6) anon INSERT/UPDATE/DELETE bloqueado (cenário j). Sem service-role no
      código de app. gitleaks roda no push @devops (downstream).
  documentation:
    status: PASS
    notes: |
      Header da migration 0004 abrangente (Story/Author/Date/Refs com linhas
      de schema-design.md+architecture.md/Purpose/Scope/Naming/Rollback).
      Comentários inline explicam cada decisão (índice parcial Q4, REUSE
      set_updated_at, 2 policies SELECT separadas DEV-2, predicado composto
      via subquery, §5 AC4/Q1 RESOLVED gaps-on-delete + exemplo de reorder
      atômico). Rollback documenta pré-condições destrutivas + ordem de
      execução vs 0003 + idempotência + NOT rolled back + bloco de
      verificação. COMMENT ON TABLE/COLUMN ativos. docs/architecture/
      schema-design.md §Change Log atualizado (v0.4, append-only L2).
      Story 2.3 com Dev Notes citando fontes reais (Constitution Art. IV) +
      Tasks/Subtasks 100% marcadas + Dev Agent Record com DEV-1..DEV-6 +
      handoff @dev → @architect.

deviations_reviewed:
  - description: 'DEV-1: Migration naming `0004_links.sql` (NNNN_descritivo) vs schema-design.md §10 timestamp YYYYMMDDHHMMSS (Supabase CLI default)'
    resolution: 'APPROVED — mantém convenção real do repo (0001-0003 inauguraram NNNN; sequência determinística). Deviation low idêntica aprovada nos gates 1.4/2.2. Padronizar via story de housekeeping (não-MVP).'
    severity: 'low'
  - description: 'DEV-2: Duas policies SELECT separadas (links_select_own + links_select_public) vs policy SELECT combinada de architecture.md §RLS L966-976'
    resolution: 'APPROVED — funcionalmente equivalente (Postgres OR-combina policies permissivas — confirmado via MCP ambas PERMISSIVE); naming casa verbatim com AC3 ("select_own + select_public") e espelha estilo "1 policy por preocupação" de 0002/0003. Deviation idêntica aprovada no gate 2.2 (DEV-2). Trade-off legibilidade/rastreabilidade favorável.'
    severity: 'low'
  - description: 'DEV-3: Fonte canônica do DDL = schema-design.md §4 #links (refinado) vs architecture.md §Database Schema (mais frouxo, L948 "completar com @data-engineer")'
    resolution: 'APPROVED — a fonte mais específica/refinada vence (title CHECK length BETWEEN 1 AND 100 rejeita vazio, icon regex slug, position >= 0, constraint uniq_links_page_position, trigger, COMMENTs). Mesmo precedente do gate 2.2 (que usou §4 #pages). Não é invenção — escolha fundamentada entre 2 docs do projeto.'
    severity: 'low'
  - description: 'DEV-4 (FLAGGED p/ @architect): AC4 "Trigger ou Server Action garante position contígua após delete" satisfeito pela constraint UNIQUE DEFERRABLE (primitivo), SEM trigger shift-on-delete'
    resolution: 'APPROVED por @architect (decisão de domínio). schema-design.md §7 Q1 RESOLVED é decisão arquitetural FECHADA: gaps-on-delete + DEFERRABLE INITIALLY DEFERRED; trigger shift-on-delete explicitamente REJEITADO (lock contention em alta concorrência; client ordena por position ASC e ignora gaps; sem benefício funcional). AC4 oferece "Trigger OU Server Action" — a contiguidade após delete é responsabilidade da Server Action reorderLinks() da Story 2.6 (decomposição de épico do PRD: 2.3=schema+RLS, 2.5=CRUD, 2.6=reorder drag-drop). O entregável de SCHEMA de 2.3 é a constraint DEFERRABLE — o primitivo que habilita o swap atômico transacional. Criar o trigger contrariaria Q1 RESOLVED = invenção contra decisão arquitetural fechada (Constitution Art. IV — proibido). AC4 satisfeito em espírito/nível-schema + documentação SQL explícita (§5) + cenário (d) demonstra gap sancionado. Mesma classe de deviation que 2.2 DEV-5 (AC satisfeito por mecanismo arch sancionado). NÃO-bloqueante.'
    severity: 'low'
  - description: 'DEV-5: AC5 executado via pnpm test:integration no job test-integration contra biolink-dev (CI-001 RESOLVED — projeto único, sem Supabase Branching)'
    resolution: 'APPROVED — precedente sancionado nas Stories 1.4/2.2 (Done; MEMORY: projeto único ibpliihqaceafdykgwiu). NÃO criar infra de Supabase Branching é correto (seria over-engineering/invenção). Deviation low.'
    severity: 'low'
  - description: 'DEV-6 (FLAGGED p/ @architect): Task 5.1 `supabase db reset --linked` pulada por decisão explícita do usuário (destrutivo em projeto compartilhado biolink-dev)'
    resolution: 'APPROVED por @architect — decisão do usuário legítima (evitar operação destrutiva em projeto compartilhado é a mesma classe de risco que motivou confirmação obrigatória em 2.2; MEMORY: projeto único local/CI/prod). Validação from-scratch substituída por SQL introspection não-destrutivo INDEPENDENTEMENTE re-verificado pelo @architect via MCP (8 objetos de schema corretos + links count=0) + db push --linked aplicou 0004 limpo (migration list 0001-0004 Local=Remote) + suíte RLS 60/60 end-to-end + 0004 idempotente + rollback companion existe. Risco residual (reaplicação from-scratch não exercitada) negligenciável — 0001-0003 inalteradas e já provadas no db reset da 2.2; seed.sql não modificado (links não é seedado). Registrado como observação low DEV-6-RESIDUAL (sugestão: validar em branch DB descartável futuro). NÃO-bloqueante.'
    severity: 'low'

handoff:
  next_agent: '@po'
  next_command: '*close-story 2.3'
  condition: |
    Verdict PASS sem blockers. 5 ACs satisfeitos, 7 quality checks PASS
    (unit N/A — story SQL pura), 6 quality_gate_tools re-executados
    independentemente pelo @architect (typecheck/lint/build exit 0;
    test:integration 60/60; schema remoto MCP-verificado). 2 observações
    low não-bloqueantes (DX-001 já mitigada Task 3.3; DEV-6-RESIDUAL risco
    negligenciável). DEV-1..DEV-6 todas APPROVED (DEV-4 e DEV-6 confirmadas
    por @architect como decisões de domínio, não invenção). Story pode
    transicionar Ready for Review → Done. @po *close-story 2.3 atualiza
    Status + Change Log + QA Results na story. ATENÇÃO downstream: branch
    feat/2.3-schema-links-rls AINDA NÃO foi pushed (sem PR/CI nesta fase —
    diferente de 2.2). Após @po close, @devops deve *push + *create-pr
    (exclusivo @github-devops, .claude/rules/agent-authority.md) — CI
    rodará lint/build/test-integration/gitleaks no PR. Próxima story
    sugerida: Story 2.5 (CRUD de Links — UI + Server Actions, primeiro
    consumer de links + reorderLinks() da 2.6 que materializa AC4 via
    DEFERRABLE).
