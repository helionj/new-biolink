deviations_reviewed:
  - description: 'shadcn 3.x base-nova instalado em vez do clássico "default" mencionado em Story Task 1.2 (que assumia @radix-ui primitives)'
    resolution: 'APPROVED — "default" não existe mais na CLI shadcn 3.x; base-nova é o novo default e usa @base-ui/react. Button mantido com @base-ui/react/button (não tem label association issues). Input REESCRITO como <input> native pois @base-ui/react/input substitui id e quebra label[for] (descoberto via failing component test). Trade-off: perde algumas convenções a11y do base-ui/react/input (focus management) mas mantém label association funcional + a11y básico via HTML semantic. Aceitável para Story 1.5; futura migration para shadcn classic ou completar adoption de base-ui pode ser tratada em Story 1.8 (Seed Design System).'
    severity: 'medium'
  - description: 'components/ui/form.tsx criado manualmente pelo @dev — registry shadcn 3.x não inclui code (apenas metadata `{ name: "form", type: "registry:ui" }`)'
    resolution: 'APPROVED — implementação manual segue pattern clássico shadcn faithful (FormProvider + Controller + FormFieldContext + useFormField hook + cloneElement em FormControl). Mantém todas as funcionalidades expected (FormItem grid, FormLabel htmlFor sync, FormControl id/aria-describedby/aria-invalid via cloneElement, FormMessage com error fallback). Manutenibilidade preservada — code é familiar pra qualquer dev que conheça shadcn. Possível tech-debt futura: verificar se shadcn 3.x eventualmente publica form na registry e migrar; no curto prazo, código local é estável.'
    severity: 'low'
  - description: 'tests/setup.ts ganhou afterEach(cleanup) explícito — Testing Library 16.x não faz auto-cleanup sem isso quando vitest globals=false'
    resolution: 'APPROVED — fix necessário descoberto via failing component tests (acumulação de DOM entre testes). Adicionado import explícito de cleanup + afterEach hook. Sem impacto em outros tests (integration project usa setupFiles diferente; unit project node-env sem DOM). Validado: 11 component tests verdes após o fix.'
    severity: 'low'
  - description: 'vitest.config.ts replica resolve.alias em cada projects[] entry em vez de só top-level'
    resolution: 'APPROVED — vitest 4.x não propaga top-level resolve para projects subconfigs no caso de imports via Node ESM (unit project com environment: node). Fix descoberto via "Cannot find package @/lib/..." em unit tests. Backward-compatible: integration tests anteriores (que funcionavam por acaso via top-level alias) continuam passando. Refactor opcional futuro: extrair alias para const compartilhada já feito (linha 4-6 do vitest.config.ts).'
    severity: 'low'
  - description: 'Task 7.1 Auth config aplicada via Management API HTTP PATCH em vez de Dashboard UI manual (originalmente proposto na Story)'
    resolution: 'APPROVED — Management API é mais automatizável e auditável que clique manual no Dashboard. Comando documentado em §13 dev-setup.md (curl PATCH com SUPABASE_ACCESS_TOKEN). Idempotente (PATCH com mesmo payload é no-op). Vantagem secundária: pode ser scriptado em supabase/scripts/auth-config.mjs no futuro pra reset-environment. mailer_autoconfirm: true validado via GET subsequente.'
    severity: 'low'

