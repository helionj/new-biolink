gate: PASS
status_reason: '9/9 ACs satisfeitos com primeiro fluxo UI auth do projeto (signup/login/logout) end-to-end: 5 shadcn primitives instalados (button, input, label, form, sonner) sob shadcn 3.x base-nova; 3 Server Actions canônicas (signUp/signIn/signOut) com Zod safeParse defensivo + mapeamento de erros PT-BR + redirect server-side; pre-check de username + fallback SQLSTATE 23505 + anti-enumeration em signIn ("Email ou senha incorretos" genérico); middleware mínimo com matcher reduzido (/signup, /login, /dashboard/:path*) per design Story 1.7-expansion; dashboard placeholder com defesa em profundidade (layout + page ambos chamam getUser); EmailVerificationBanner renderizado quando email_confirmed_at null. Quality gate 6/6 verde local (typecheck/lint/build/test:unit/test:components/test:integration) com 39 testes totais (15 unit validators + reserved + 11 component SignupForm/LoginForm + 13 integration — 8 RLS de 1.4 mantidos verdes + 5 auth novos cobrindo signUp happy path + dup username + signIn válido/inválido + signOut). Task 7.1 aplicada via Management API HTTP PATCH (mailer_autoconfirm: true em biolink-dev) — documentado em docs/dev-setup.md §13 com plano explícito de reversão em Story 1.6 + setup de /auth/callback. 5 deviations vs draft documentadas em Change Log v0.3 (shadcn 3.x base-nova em vez de clássico; form.tsx criado manualmente pois registry 3.x não inclui code; tests/setup.ts ganhou afterEach(cleanup); vitest.config.ts replica resolve.alias em cada project; Auth config via Management API em vez de Dashboard UI) — todas no espírito da Story e justificadas tecnicamente. Sem critical/high issues; 4 observações low/medium não-bloqueantes (acceptTerms cast duplo cosmético, middleware.ts deprecation Next 16 deferida pra 1.7, smoke E2E manual deferido pra revisão humana, mailer_autoconfirm transitório pra 1.6).'
reviewer: 'Manual gate per QA-001 (CodeRabbit self-healing loop indisponível em macOS sem WSL/CodeRabbit CLI). @qa Quinn validated quality_gate_tools (typecheck/lint/build/test:unit/test:components/test:integration) + 7 quality checks contra entrega não-committed sobre main 8fd3636.'
updated: '2026-05-13T16:40:00Z'
top_issues:
  - severity: 'medium'
    category: 'verification'
    description: 'Smoke manual end-to-end da Task 8.2 (signup happy path real no `pnpm dev` → redirect /dashboard → banner verification → logout → login subsequente → middleware redirects bi-direcionais) NÃO executado pelo @dev neste turno — deferido para validação humana em InReview per Completion Notes. Integration tests cobrem o caminho do Server Action contra biolink-dev (8/8 RLS de 1.4 + 5 auth verdes), mas o loop completo navegador→middleware→Server Action→DB→Server Component dashboard só foi validado em CI/integration, não com olhos humanos.'
    recommendation: 'Antes do merge (push por @devops), executar manualmente: (a) `pnpm dev` → /signup com username único + email único + senha 8+ → submit → verificar redirect a /dashboard + banner amarelo de verificação de email + saudação "Olá, {email}"; (b) clicar Sair → redirect a /; (c) /login com mesmas credenciais → redirect a /dashboard novamente; (d) /login com senha errada → toast "Email ou senha incorretos"; (e) /dashboard deslogado → /login?next=/dashboard; (f) /signup já logado → /dashboard. Cleanup do user via Supabase Studio ou `auth.admin.deleteUser(id)`. Esta validação cobre o gap entre tests unitários/integration e UX real.'
  - severity: 'medium'
    category: 'maintainability'
    description: 'Next.js 16 deprecou `middleware.ts` em favor de `proxy.ts` (warning explícito durante `pnpm build`: "The middleware file convention is deprecated. Please use proxy instead"). Arquivo `middleware.ts` está atualmente em uso e funciona, mas será removido em release futura do Next.js. Story 1.7 já está mapeada para tratar (expansão do matcher + edge cases) — natural ponto para renomear.'
    recommendation: 'Story 1.7 (Middleware completo) deve incluir como primeira subtask: renomear `middleware.ts` → `proxy.ts` (mesmo conteúdo + mesmo `export const config = { matcher: [...] }`). Documentar como Constraint: "Next 16 middleware → proxy migration". Não-bloqueante pra Story 1.5 (deprecation warning, não erro).'
  - severity: 'low'
    category: 'code-cleanliness'
    description: 'Em `components/auth/SignupForm.tsx` linha 34, `defaultValues.acceptTerms` usa cast duplo `false as unknown as true` para satisfazer o tipo `z.literal(true)` derivado do schema. Funcional (RHF aceita o valor false em runtime; Zod refine rejeita no submit), mas o cast pode confundir reviewers que olhem o código fora do contexto. Pattern reusará em todos os forms futuros com checkbox obrigatório (terms, newsletter consent, etc.).'
    recommendation: 'Considerar em Story 1.8 (Seed Design System) introduzir helper `unsetLiteralDefault<T>()` em `lib/form-helpers.ts` ou alternativa: refatorar schema para `acceptTerms: z.boolean().refine(v => v === true, ...)` que aceita default `false` natural. Trade-off: literal(true) ainda é semanticamente mais preciso (campo só pode ter UM valor válido); refine permite default natural mas perde a precisão no tipo derivado. Decisão pode ser tomada em 1.8 quando outros forms inaugurarem o pattern.'
  - severity: 'low'
    category: 'tech-debt'
    description: 'Decisão `mailer_autoconfirm: true` em biolink-dev (Task 7.1) é explicitamente TRANSITÓRIA para destravar AC5 (signup → session imediata → redirect /dashboard). Esse setting persiste no projeto Supabase até ser revertido em Story 1.6, o que significa que (a) qualquer dev que rode signup local pula confirmação de email; (b) prod (biolink-prod ainda não criado) DEVE ser criado com este setting OFF; (c) integration tests assumem auto-confirm e quebrarão se o setting voltar a false sem o fix de /auth/callback.'
    recommendation: 'Story 1.6 (Reset Password + Email Verification) deve ter como tasks explícitas: (a) implementar `app/auth/callback/route.ts` handler do link de confirmação; (b) PATCH `mailer_autoconfirm: false` via Management API; (c) atualizar `tests/integration/server-actions/auth.test.ts` para usar fluxo callback OU manter mock via admin createUser. Cross-ref já documentado em docs/dev-setup.md §13 e Project Structure Notes #3 da Story 1.5.'

waiver:
  active: false

quality_checks:
  code_review:
    status: PASS
    notes: |
      Server Actions (server/auth/actions.ts) seguem padrão canônico de arch §API Specification:
      'use server' + Zod safeParse + ActionResult<T> + redirect() em sucesso. Pattern correto
      de defesa em profundidade: signUp pre-check de username via SELECT (UX-friendly antes
      do round-trip Auth), fallback para mensagem amigável em SQLSTATE 23505 (race window
      entre check e insert do trigger 1.4), mensagem genérica anti-enumeration em signIn
      ("Email ou senha incorretos") per arch §Security. Helper `flattenFieldErrors` interno
      tipado contra Zod 4 flatten shape (Record<string, string[] | undefined>) — robusto
      contra a mudança de API em Zod 4.x. Server Action signatures usam `raw: unknown` em
      vez de typed inputs — correto, pois cliente pode passar qualquer coisa e o servidor
      não deve confiar no contrato TS.

      Middleware (middleware.ts) usa createServerClient + env validado via Zod (per arch
      §Coding Standards linha 2396); matcher reduzido a 3 paths intencionalmente per Story
      AC7 + comentário inline cross-ref Story 1.7 para expansão. Pattern compatível com
      arch §Routing > Protected Route Pattern linhas 1178-1229. Warning Next 16
      (middleware → proxy) tratado como tech-debt low para Story 1.7.

      SignupForm/LoginForm seguem pattern RHF + zodResolver + FormProvider de shadcn/ui.
      Refactor inteligente do FormControl em campos com wrapper visual (password com toggle
      Eye/EyeOff): InputPrimitive direto em FormControl, wrapper div externo — preserva
      label association via FormLabel htmlFor sincronizado por useFormField context.
      LogoutButton usa useTransition para loading state — ergonômico.

      Dashboard layout + page usam defense-in-depth (ambos chamam getUser()) — pattern
      compatível com arch §Backend Architecture > Auth Flow linhas 1505-1558. Layout é a
      1ª linha (middleware é a 0ª); page é a 2ª linha. Marker comment em page.tsx documenta
      o placeholder (Story 2.x substituirá).

      shadcn 3.x base-nova deviation vs draft documentada extensivamente em Completion
      Notes — Button mantém @base-ui/react/button (Story 1.5 não tem label association
      issues com Button); Input reescrito como native <input> (correto, pois
      @base-ui/react/input substitui id e quebra label[for]); form.tsx criado manualmente
      com pattern clássico shadcn (FormFieldContext + useFormField hook + cloneElement em
      FormControl) — manutenibilidade preservada.

      Tokens em app/globals.css reconciliados: 6 placeholders originais do projeto
      preservados (--background: #ffffff, --foreground: #171717, --primary: #0f172a etc.)
      + tokens shadcn novos (--card, --popover, --destructive, --ring, --input, --chart-*,
      --sidebar-*). Tokens conflitantes do shadcn init (oklch) revertidos para hex do
      projeto. [data-theme='dark'] + [data-theme='brand'] mantidos como placeholders pra
      Story 3.1+.

      Validators (lib/validators/auth.ts) usam Zod 4 nova API (`z.literal(true, { message })`
      em vez do deprecated errorMap). Reserved-usernames helper (lib/reserved-usernames.ts)
      é case-insensitive por princípio (lowercase before compare), embora o regex
      `^[a-z0-9-]{3,30}$` já force lowercase — defesa em profundidade aceitável.

  unit_tests:
    status: PASS
    notes: |
      15 testes verdes em 2 suites — distribuição:

      tests/unit/validators/auth.test.ts (11 cenários):
        - SignUpInput aceita payload válido
        - email inválido → "Informe um email válido"
        - password < 8 chars → "A senha precisa ter no mínimo 8 caracteres"
        - confirmPassword diferente → "As senhas não coincidem" no path correto
        - username < 3 chars → mensagem regex
        - username uppercase → mensagem regex (case sensitivity)
        - username reservado → "Este username é reservado"
        - acceptTerms=false → "Aceite os termos para continuar"
        - SignInInput aceita payload válido
        - SignInInput password vazia → "Informe sua senha"
        - SignInInput email inválido → "Informe um email válido"

      tests/unit/reserved-usernames.test.ts (4 cenários):
        - lista contém keys obrigatórios (admin, api, dashboard, login, signup,
          reset-password, auth, www, public)
        - isReservedUsername('admin') → true (lowercase direto)
        - isReservedUsername('Admin') + 'DASHBOARD' → true (case-insensitive)
        - isReservedUsername('alice') + 'biolink-user' → false

      Helper `firstMessage` em auth.test.ts é elegante — extrai issue por path para
      assertion direta. Pattern reusará em validators futuros (links, profile-update).
      vitest.config.ts ajustado para replicar resolve.alias em cada project entry —
      necessário pra vitest 4.x (deviation documentada em Completion Notes).

  acceptance_criteria:
    status: PASS
    notes: |
      AC1 (página /signup + SignupForm com 5 campos validados via RHF+Zod): PASS —
      app/(auth)/signup/page.tsx renderiza SignupForm com email, username, password,
      confirmPassword, acceptTerms. Validators Zod corretos: regex `^[a-z0-9-]{3,30}$`
      (espelha CHECK da migration 0002), refine reserved-usernames, .min(8) password,
      .literal(true) acceptTerms, .refine cross-field password match. Renomeação
      slug→username consistente com canônico do projeto (arch + trigger 1.4 +
      profiles.username) — documentado em Project Structure Notes #1.

      AC2 (página /login + LoginForm com email/password + link Esqueci a senha): PASS —
      app/(auth)/login/page.tsx renderiza LoginForm; SignInInput Zod schema mínimo
      (email válido + password não-vazia, sem mínimo de chars no login per
      anti-enumeration); Link "Esqueci a senha" aponta para /reset-password (404 hoje;
      será implementado em Story 1.6, aceitável per Story PSN #4).

      AC3 (logout no /dashboard + email user + EmailVerificationBanner): PASS —
      app/dashboard/page.tsx (placeholder declarado) exibe email do user authenticated,
      EmailVerificationBanner condicionado a email_confirmed_at null, LogoutButton com
      useTransition. Layout dashboard com auth guard server-side adicional (defense in
      depth). Polish do shell (sidebar, UserMenu) deferido pra Story 1.9 + Epic 2 conforme
      AC3 textual.

      AC4 (Toaster sonner + ActionResult error path): PASS — <Toaster /> mounted em
      app/layout.tsx (root) uma única vez; SignupForm e LoginForm chamam toast.error(res.error)
      quando res.ok === false e propagam fieldErrors via form.setError. Cenários cobertos
