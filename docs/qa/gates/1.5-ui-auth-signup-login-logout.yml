  performance:
    status: PASS
    notes: |
      Quality gate local executa em ~50s (typecheck 1s, lint 1s, build ~50s, test:unit
      ~5s, test:components ~14s, test:integration ~10s). Bundle do Next.js: 4 routes
      (/, /_not-found, /dashboard ƒ, /login, /signup) — /signup e /login STÁTICAS;
      /dashboard DINÂMICA (server-rendered on demand pra checar auth). Middleware roda
      em apenas 3 paths (matcher reduzido) — overhead mínimo.

      Server Action signUp faz 2 round-trips a Supabase: (1) SELECT profile por username,
      (2) auth.signUp. Trade-off explícito documentado em Story PSN #2: 1 extra round-trip
      vs UX melhor (evita criar auth.users e falhar no trigger por race). Aceitável para
      UX flow não-quente (signup acontece 1x por user).

      signIn faz 1 round-trip (signInWithPassword). signOut 1 round-trip + redirect.
      Pattern adequado.

      shadcn primitives e RHF + Zod resolver não introduzem overhead arquitetural
      relevante. Build minifica corretamente; @base-ui/react adiciona ~5KB gzip ao bundle
      do dashboard (Button), aceitável.

  security:
    status: PASS
    notes: |
      8-point security checklist:
      1. **Anti-enumeration:** signIn retorna mensagem genérica "Email ou senha incorretos"
         (não revela se email existe). Aplicado per arch §Security > Email enumeration
         linha 2147.
      2. **Server-side validation:** Server Actions re-validam input via Zod safeParse —
         cliente não pode bypass via DevTools. Padrão correto contra trusted-client
         antipattern.
      3. **Reserved usernames:** Dupla validação — client-side via Zod refine
         (UX immediate feedback) + server-side via mesmo schema (safeParse re-aplica).
         Lista hardcoded em lib/reserved-usernames.ts cobre paths Next.js reservados
         (api, dashboard, login, signup, etc.) + paths semânticos universais
         (about, terms, privacy).
      4. **Race window mitigation:** Pre-check de username via SELECT + DB UNIQUE constraint
         em profiles.username (de Story 1.4) garantem integridade. Server Action fallback
         para SQLSTATE 23505 com mensagem amigável.
      5. **RLS aware:** Server Actions usam createClient() (anon + cookies, RLS-aware) —
         NÃO usam admin/service-role. Conformidade com arch §Coding Standards linha 2395
         (service-role isolado em integration tests apenas).
      6. **CSRF:** Next.js Server Actions têm built-in CSRF mitigation via
         origin/referer checks + actionId opaco — sem necessidade de implementar manual.
      7. **Session cookies:** @supabase/ssr gerencia HTTP-only cookies automaticamente
         via createServerClient. Não há manipulação manual de tokens em client-side.
      8. **Defense in depth:** Middleware (1ª linha) + Layout dashboard auth guard
         (2ª linha) + Page dashboard re-check (3ª linha) protegem rotas privadas.
         Sobreposição intencional documentada em Story Task 4.8.

      Decisão `mailer_autoconfirm: true` é transitória e está em DEV apenas — biolink-prod
      (ainda não criado) DEVE ter false antes do release público (documentado em §13
      dev-setup.md). Risco aceitável no contexto de development project pessoal.

      Gitleaks pre-commit não foi rodado nesta sessão de QA (story ainda não committada);
      arquivos novos foram inspecionados manualmente — sem secrets hardcoded. Senhas de
      teste em integration test (`testpassword123`) são strings claramente reconhecíveis
      como NÃO-secrets (semântica óbvia).

  documentation:
    status: PASS
    notes: |
      Story 1.5 file: Change Log v0.3 documenta a implementação completa com 5 deviations
      explicadas vs draft (shadcn 3.x base-nova; form.tsx manual; tests/setup cleanup;
      vitest alias por project; Management API patch para auth config). Dev Agent Record
