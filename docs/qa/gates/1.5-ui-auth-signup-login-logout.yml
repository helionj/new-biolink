      cause analysis), Completion Notes (8 bullets cobrindo deviations, rationale,
      cleanup pendente), File List separando Novos (26) vs Atualizados (7).

      docs/dev-setup.md §13 nova: explica setting transitório `mailer_autoconfirm: true`
      em biolink-dev, fornece curl command para reproduzir, documenta plano de reversão
      em Story 1.6, e cross-reference impacto em CI.

      Inline comments criteriosos: middleware.ts cross-ref Story 1.7 expansion;
      app/dashboard/page.tsx marker "Placeholder Story 1.5 — substituído em Stories 2.x";
      tests/integration/server-actions/auth.test.ts documenta NEXT_REDIRECT pattern
      pra reuso futuro.

      Não há docs órfãos; nenhum file novo sem comment block contextual. README do projeto
      não foi tocado nesta story (escopo apropriado; README cleanup vem em Story 1.9
      Landing).

      Smoke manual de Task 8.2 deferido — explicitamente documentado em Completion Notes
      como "deixado para validação humana em InReview". Top_issues #1 captura como
