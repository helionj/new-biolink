      retorna { ok: false }".

      AC5 (signUp → session imediata → redirect /dashboard + banner): PASS — Server Action
      signUp chama auth.signUp({ email, password, options: { data: { username } } }) +
      redirect('/dashboard') em sucesso. Trigger on_auth_user_created (Story 1.4) consome
      username via raw_user_meta_data — integration test #1 valida cadeia completa
      (signUp → NEXT_REDIRECT → profile row criada por trigger com username correto + id
