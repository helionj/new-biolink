      quando email_confirmed_at null. Decisão `mailer_autoconfirm: true` aplicada via
      Management API documentada em §13 dev-setup.md (top_issues #4 trata reversão em 1.6).

      AC6 (PT-BR em todas as strings visíveis): PASS — labels (Email, Username, Senha,
      Confirmar senha), placeholders (seu@email.com, seu-username), botões (Criar conta,
      Entrar, Sair), mensagens Zod (10+ strings PT-BR), toasts, banner ("Confirme seu
      email para garantir o acesso à sua conta"), link "Esqueci a senha", helper texts
      ("Seu @ público (3-30 caracteres...)"). `lang="pt-BR"` no <html>. metadata.title
      atualizado para "BioLink" (cleanup pendente desde Story 1.1).

      AC7 (middleware mínimo /signup /login /dashboard:path*): PASS — middleware.ts na
      raiz com matcher reduzido EXATAMENTE conforme spec; PROTECTED_PATHS=['/dashboard'];
      AUTH_PAGES=['/login', '/signup']; redirect bi-direcional implementado
      (guest→/login?next=path; user→/dashboard). createServerClient via @supabase/ssr
      gerencia cookies HTTP-only conforme arch §Routing. Comentário inline cross-ref
      Story 1.7 expansion.

      AC8 (cobertura de testes): PASS — 15 unit + 11 component + 13 integration = 39
      totais. Plano original era 29 cenários (10 unit validators + 4 unit reserved + 7
      component signup + 4 component login + 4 integration auth); entregue:
        - 11 unit validators (1 extra: SignInInput email inválido)
        - 4 unit reserved
        - 7 component SignupForm
        - 4 component LoginForm
        - 5 integration auth (1 extra: signIn senha errada → ActionResult ok:false)
      Helper sweep `deleteByUsername` em auth.test.ts é resiliente (resolve via profiles
      table primeiro, depois admin sweep). Pattern NEXT_REDIRECT documentado em comentário
      inline (reusará em Server Actions futuras).

      AC9 (gate 6/6 verde): PASS — typecheck ✓, lint ✓, build ✓, test:unit (15) ✓,
      test:components (11) ✓, test:integration (13 — 8 RLS de 1.4 mantidos + 5 auth) ✓.
      Re-validado nesta sessão de QA gate independentemente: 39/39 testes verdes em
      ~50s totais. CI não muda — branch protection rule de main mantém 9 required checks
      (test-integration já incluído desde Story 1.4 Task 1.5).

