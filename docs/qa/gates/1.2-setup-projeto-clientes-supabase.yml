deviations_reviewed:
  - description: 'Script db:types usa `--linked` em vez de `--project-id $SUPABASE_PROJECT_ID` da AC5 textual'
    resolution: 'APPROVED — `--linked` é o padrão atual da CLI Supabase e mais ergonômico após `supabase link`. Comportamento equivalente.'
    severity: 'low'
  - description: '`import "./lib/env"` adicionado em next.config.ts (não previsto nas Dev Notes)'
    resolution: 'APPROVED — necessário para AC4 funcionar. Sem isso, env validation seria lazy e build da landing-page atual passaria com env inválido (porque nenhuma rota importa lib/env transitivamente). Side-effect import garante fail-fast verdadeiro. Validado: `HASH_SALT=short pnpm build` falha com ZodError esperado.'
    severity: 'low'
  - description: 'SUPABASE_ACCESS_TOKEN adicionado a .env.local (Personal Access Token para CLI)'
    resolution: 'APPROVED — necessário para `supabase link` em non-TTY (login interativo falhou). Token gitignored em .env.local; separação Vercel/CI será feita por @devops em Story 1.3. Não está no schema Zod (correto — usado apenas pela CLI subprocess, não por código runtime).'
    severity: 'low'
  - description: 'Pivot QA-002 — diagnóstico original (`pnpm-workspace.yaml malformado, deletar`) revisado como incorreto'
    resolution: 'APPROVED — investigação corrigiu rota: `allowBuilds:` é mecanismo oficial pnpm 10+. Fix real: `pnpm approve-builds --all` + remoção de `pnpm.onlyBuiltDependencies` redundante. Documentado em known-issues.md (status Resolved) e Dev Agent Record.'
    severity: 'low'

