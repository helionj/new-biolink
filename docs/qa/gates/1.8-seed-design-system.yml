code_review_findings:
  - id: 'CR-001'
    severity: info
    finding: 'button.test.tsx testa a prop `render` (polimorfismo @base-ui) em vez de `asChild`. `button.tsx` usa `@base-ui/react/button` (style base-nova), que NÃO possui `asChild` (API Slot do Radix). Desvio aprovado pelo owner via AskUserQuestion durante *develop; correto per Constitution Art. IV (No Invention) — testar a API real preservando a intenção (cobrir polimorfismo). Asserção compara className com cn(buttonVariants(...)) — contrato robusto, não-frágil.'
    location: 'tests/components/ui/button.test.tsx'
    action_required: false
  - id: 'CR-002'
    severity: info
    finding: 'Polyfill local de window.matchMedia em sonner.test.tsx (jsdom não implementa; sonner usa para theme="system"). Escopado no arquivo de teste via beforeAll — tests/setup.ts compartilhado intocado, zero blast radius nos outros 7 test files. Decisão conservadora correta.'
    location: 'tests/components/ui/sonner.test.tsx:8-22'
    action_required: false
  - id: 'CR-003'
    severity: info
    finding: 'lib/toast.ts recria `toast` como wrappers arrow (não re-export direto de sonner). Intencional: desacopla feature code de sonner (§Drift) e abre ponto único para cross-cutting futuro. Forwarding fiel de ExternalToast mantém a API type-safe e sem perda vs sonner. notify() cobre as 3 branches (destructive/success/default) reconciliando a assinatura {title,description,variant} dos exemplos antigos do arch.'
    location: 'lib/toast.ts'
    action_required: false
  - id: 'CR-004'
    severity: info
    finding: 'Migração dos 6 consumidores é cirúrgica: git diff = exatamente 1 linha de import trocada por arquivo (sonner → @/lib/toast), mensagens/comportamento idênticos. Regressão coberta pelos 4 component tests de auth (22 testes) verdes pós-migração; mocks sonner→@/lib/toast atualizados em LoginForm.test.tsx + ResetPasswordRequestForm.test.tsx (os outros 2 não mockavam sonner).'
    location: 'components/auth/*, components/dashboard/ResendEmailButton.tsx'
    action_required: false

