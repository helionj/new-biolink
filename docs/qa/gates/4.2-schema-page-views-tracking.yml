status_reason: 'Implementação completa dos 5 ACs (migration 0008 + dedup window 30min + RLS + /api/track/view + lib/track + ViewBeacon Client beacon). CI da PR #19 mergeada com 11/11 checks SUCCESS (install, lint, typecheck, test-unit, test-components, test-integration, build, gitleaks, audit, lighthouse, Vercel). Schema remoto sincronizado (0001..0008, page_views.rls_enabled=true, 1 policy SELECT, zero policies INSERT/UPDATE/DELETE — AC4 via ausência-de-policy + service-role bypass). 4 ratificações vinculantes do PO v0.2 (DEV-3/8/9/10) honradas. 2 observações low não-bloqueantes herdadas (auth_rls_initplan na 9ª policy + bundle re-measure deferido).'
reviewer: 'Quinn'
updated: '2026-05-27T13:01:43Z'

top_issues:
  - id: 'PERF-001'
    severity: low
    finding: |
      Lint `auth_rls_initplan` na nova policy `page_views_select_own` —
      `auth.uid()` chamado direto no predicado (JOIN 1-hop page → profile)
      em vez de `(select auth.uid())`, causando re-evaluation por linha em
      scans amplos. Confirmado via `get_advisors performance`: agora são
      **9 policies** no padrão herdado (profiles_update_own, pages_select_own,
      pages_update_own, links_select_own/insert_own/update_own/delete_own,
      click_events_select_own, page_views_select_own). Não é regressão de 4.2 —
      é coerência arquitetural ratificada como DEV-3 pelo PO em v0.2 da story.
      Mitigação por índice composto `idx_page_views_page_id_viewed_at`
      (incluído na 0008) reduz custo prático; tabela apenas com SELECT por
      owner (poucas linhas por scan).
    suggested_action: |
      Expandir `[STORY-4.1-F1]` (LOW open em STORY-BACKLOG.md) de "8 policies"
      para "9 policies" — batch fix em migration 0009+ companheira substituirá
      `auth.uid()` por `(select auth.uid())` em todas. Não bloqueante para 4.2;
      tracking pelo backlog existente.

  - id: 'TEST-001'
    severity: low
    finding: |
      Re-medição programática de bundle First Load JS de `/[username]` (Task 7.5)
      seguiu bloqueada por Turbopack drift — `.next/build-manifest.json` lista 0
      files para a rota desde 3.5. Continuação do `[STORY-3.5-F1]` (LOW —
      monitorar margem <200 KB gz); +50-100 bytes gz estimados pelo Client beacon
      mantêm folga ampla vs budget NFR4 (200 KB gz).
    suggested_action: |
      Gate efetivo já está em CI: `.github/workflows/lighthouse.yml` (Story 3.5)
      passou em PR #19 (job `lighthouse` SUCCESS @ 03:31:47Z). Qualquer regressão
      de bundle/performance será capturada no PR. Resolver o drift do
      build-manifest é tarefa de tooling (não-bloqueante).

