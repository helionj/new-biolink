        (confirmação end-to-end da Route Handler em prod, não pollution de
        teste — todas as 3 views pertencem ao mesmo page_id de /@demo).

    - id: AC2
      verdict: PASS
      evidence: |
        `app/api/track/view/route.ts` (106 LOC, POST handler, runtime:nodejs,
        force-dynamic) resolve page via `createAdmin()` (service-role) com
        check `is_published=true` (DEV-6 ratificado). Retorna 404 se page
        inexistente ou is_published=false; 400 se Zod falhar; 429 em rate
        limit; 500 em erro Supabase. Para tracking server-side via Client
        beacon, `components/public/ViewBeacon.tsx` (52 LOC) dispatch via
        `navigator.sendBeacon` (primário) ou `fetch+keepalive` (fallback);
        `components/public/PublicPage.tsx` integra `<ViewBeacon pageId={page.id} />`
        preservando ISR `revalidate=60` da Story 2.7 (DEV-8 ratificado, arch
        §L443 sanciona explicitamente).

    - id: AC3
      verdict: PASS
      evidence: |
        `lib/track.ts:insertPageView()` (88 LOC) aplica dedup window app-side:
        `SELECT id FROM page_views WHERE page_id=$1 AND ip_hash=$2 AND viewed_at
        >= now() - INTERVAL '30 minutes' LIMIT 1` antes do INSERT (DEDUP_WINDOW_MS
        = 30 * 60 * 1000). Bypass quando ipHash ausente (sem chave estável,
        defensivo, idem rate-limit da 4.1). Race window <0.1% documentada em
        JSDoc (DEV-2) como trade-off MVP — mitigação DB-level rejeitada (Postgres
        não suporta now() em predicate de partial unique index; must be IMMUTABLE).
        Validado por 7 unit tests (tests/unit/track.test.ts) + integration test
        cenário (b) com 2 POSTs consecutivos → apenas 1 row no DB.

    - id: AC4
      verdict: PASS
      evidence: |
        RLS habilitada + apenas 1 policy SELECT (`page_views_select_own`) com
        predicado JOIN 1-hop page → profile (mais simples que o 2-hop da
        `click_events_select_own`). Zero policies INSERT/UPDATE/DELETE —
        defesa canônica Supabase via ausência-de-policy + service-role bypass
        (DEV-5 herdado de 4.1 DEV-2 APPROVED). Validado por 10 cenários em
        `tests/integration/rls/page-views.test.ts`: owner/non-owner/anon ×
        SELECT + INSERT/UPDATE/DELETE bloqueados + CASCADE + check constraint
        + service-role insert OK. Confirmado no remoto via Studio: 1 policy
        SELECT, zero INSERT/UPDATE/DELETE policies.

    - id: AC5
      verdict: PASS
      evidence: |
        AC5 satisfeito como forward-looking (DEV-9 ratificado pelo PO) —
        schema 4.2 habilita queries de agregação consumidas em Story 4.3
