top_issues:
  - id: 'SEC-001'
    severity: low
    finding: |
      Lint `function_search_path_mutable` (0011) introduzido em **2 funções
      novas** desta story — `public.get_link_clicks_series(uuid, integer)` e
      `public.get_page_views_series(uuid, integer)`. Ambas criadas com
      `LANGUAGE sql SECURITY INVOKER STABLE` mas sem cláusula
      `SET search_path = public, pg_temp` — supabase advisor (WARN) recomenda
      definir search_path explicitamente para mitigar schema-shadowing attacks.
      Severidade real LOW porque: (a) SECURITY INVOKER (atacante só atacaria
      próprio schema — sem elevação de privilégio); (b) LANGUAGE sql one-liner
      (Postgres inline-otimiza com search_path do caller); (c) tabelas
      referenciadas (`page_views`, `click_events`) qualificadas como public.
      Precedente: lint idêntico em `public.set_updated_at` (de 1.4) foi
      aceito em todos os gates anteriores (1.4 → 4.2) — coerência com herança.
    suggested_action: |
      Criar `[STORY-4.3-F1]` LOW em `docs/STORY-BACKLOG.md` para batch fix
      via migration companheira `0010_function_search_path_fix.sql`:
      `ALTER FUNCTION ... SET search_path = public, pg_temp` para as 3 funções
      afetadas (`set_updated_at`, `get_link_clicks_series`, `get_page_views_series`).
      Não bloqueante; advisor passa de 3 WARN para 0 após apply. Não toca
      `reorder_links` (já 0005, mesmo modelo SECURITY INVOKER STABLE — confirmar
      empiricamente no fix se precisa ou não da cláusula).

waiver: { active: false }

