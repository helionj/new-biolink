handoff:
  next_agent: '@devops'
  next_command: '*push'
  condition: |
    Gate PASS com 1 MEDIUM (PERF-001 — Lighthouse pendente CI) +
    2 LOW (DOC-001 comentário ESLint enganoso; SMOKE-001 smoke 9.2
    pulado com cobertura indireta forte). @devops deve:
    (1) Verificar baseRefName antes de merge (MEMORY
        feedback_check_pr_base_before_merge.md) — PR esperado contra main.
    (2) Criar branch `feat/4.5-conta-exportar-excluir` + commit
        Conventional Commits com ref `[Story 4.5]` (padrão 4.1-4.4).
    (3) Push do branch para origin + abrir PR contra main.
    (4) Aguardar required status checks (install/lint/typecheck/test-unit/
        test-components/test-integration/build/gitleaks/audit) + Lighthouse
        CI workflow.
    (5) MONITORAR Lighthouse Performance score do /dashboard/account —
        esperado PASS (account page leve, sem chart lib); se < 0.85,
        escalar (improvável).
    (6) Após PR CLEAN + MERGEABLE → merge squash em main.
    (7) Marcar Story 4.5 Status InReview → Done.
    (8) Notar no Change Log da story (close-story commit): Epic 4 fechado;
        MVP backbone completo (4.1+4.2+4.3+4.4+4.5).
  alternatives:
    - condition: 'Operador opcionalmente faz smoke 9.2 antes de @devops push'
      action: 'Criar conta descartável via signup → criar 1 link → /dashboard/account → delete → confirmar toast + redirect + login falha. Se OK, atualizar story Completion Notes removendo "risco residual" + atualizar este gate file (SMOKE-001 → CLOSED).'
    - condition: 'Lighthouse Performance < 0.85 no CI (improvável)'
      action: '@dev *apply-qa-fixes 4.5 — investigar bundle do dashboard authenticated; mitigação preventiva via dynamic import se necessário. Re-medir.'
