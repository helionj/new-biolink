schema: 1
story: '4.5'
gate: PASS
status_reason: |
  Implementação completa dos 5 ACs do PRD §Epic 4 Story 4.5 L611-615 (page
  /dashboard/account + JSON export blob + delete com username confirmation +
  signOut/redirect + integration tests cascade). Quality gates locais 100%
  verdes (re-rodados pelo @architect): typecheck ✅ / lint ✅ / build ✅
  (15 pages, /dashboard/account dynamic) / 188 component tests 33 files ✅
  (9 novos em features/account/) / 160 integration tests 18 files ✅
  (7 novos em account.test.ts cobrindo cenários a/b/c/d/d.2/e/f — shape do
  export + minimal + wrong-username + cascade 5 tabelas + case-insensitive
  match + unauth defense + Storage cleanup end-to-end). 16 deviations
  DEV-1..DEV-16 ratificadas pelo @po em v0.2 e materializadas verbatim em
  v0.3 sem ajustes (único refinamento: form.watch → useWatch para silenciar
  warning react-hooks/incompatible-library, alinhamento ao pattern do projeto
  em SignupForm/UsernameForm). **Security clean (story Security-critical):**
  (1) Service-role ISOLADO via grep — `createAdmin` importado em apenas 4
  paths legítimos (server/account/actions.ts NOVO + 2 trackers /api/track +
  lib/track.ts), zero vazamento para components/ ou outros dashboards.
  (2) Cascade chain DB-side confirmada em 5 migrations
  (0002:65 → 0003:58 → 0004:56 → 0007:72 + 0008:75) — endorse explícito em
  0002:53 verbatim "ON DELETE CASCADE garante limpeza via deleteAccount
  Server Action — Story 4.5". (3) Defense-in-depth no username match —
  server-side case-insensitive em actions.ts:157 carrega profile.username
  da session (não confia no client) + client mirror em
  DeleteAccountSection.tsx:50-52 como UX (integration (c) prova: client mock
  passa "errado-nope", server bloqueia). (4) Ordering deleteUser → signOut
  → return ok respeitado em actions.ts:193-203 com decisão consciente DEV-9
  de delegar redirect ao client (toast cross-nav). (5) RLS-aware export —
  exportAccountData usa createClient() RLS-aware, zero admin no path de
  leitura (arch §Middleware/Guards L1571 respeitado). (6) Auth guards
  layered — middleware (1.7) + dashboard/layout (2.4) + page (4.5) +
  Server Action getUser() — 4 camadas independentes. (7) Storage cleanup
  explícito best-effort com try/catch + console.warn nos 3 fail points
  (list/remove/throw) — orphan storage previne quota leak; integration (f)
  prova end-to-end com upload PNG real → delete → list vazio. Constitution
  Art. IV (no invention) respeitada — todas as 16 DEVs com fonte verbatim
  (architecture.md §Server Actions L410-414 + §Components #9 L560-569 +
  §Workflow 4 L767-792 + PRD §Story 4.5 L603-615 + 0002:53 endorse +
  lib/supabase/admin.ts REUSE). Constitution Art. V (no premature
  optimization) respeitada — DEV-3 rejeita DELETE manual em 5 tabelas
  (cascade nativo é atômico); DEV-13 rejeita RPC SQL customizada para export.
  **Zero migration nova, zero policy RLS nova** (cascade pré-existente
  desde 1.4/2.2/2.3/4.1/4.2). **Epic 4 fechado** — MVP backbone completo
  (4.1+4.2+4.3+4.4+4.5). 2 observações LOW informacionais (DOC-001
  comentário enganoso sobre "ESLint guard" que é apenas convenção;
  SMOKE-001 risco residual de smoke 9.2 pulado com permissão do operador)
  + 1 observação MEDIUM herdada (PERF-001 — Lighthouse CI pendente PR;
  esperado PASS facilmente porque account page é leve sem chart lib nova).
reviewer: 'Aria'
updated: '2026-05-28T19:00:00Z'

top_issues:
  - id: 'PERF-001'
    severity: medium
    finding: |
      Lighthouse Performance score do `/dashboard/account` ainda não medido
      empiricamente nesta validação local. Workflow `.github/workflows/
      lighthouse.yml` (Story 3.5; estabilizado em 4.2 com runs:3 mediana
      per [STORY-3.5-F3] Done) vai disparar no PR porque trigger
      `paths: [app/**, components/**]` matchéia commits desta story
      (app/dashboard/account/, components/account/). Diferença vs 4.4: a
      account page é MUITO mais leve (1 query profiles.username + 2 client
      components SEM chart lib — apenas alert-dialog/button/input/label
      primitives já existentes; sonner + RHF + Zod já no bundle base).
      Risco material < 4.4 (que tinha recharts ~30-50 KB gz).
    suggested_action: |
      Aceitar como gate-PASS-com-monitoramento (padrão idêntico ao 4.4).
      @devops deve VALIDAR Lighthouse CI após push — se Performance score
      do `/dashboard/account` < 0.85, escalar para @dev (improvável pelo
      perfil leve da página). Se PASS (>= 0.85), nenhuma ação. Documentar
      resultado no Change Log da story ao mover Status InReview → Done.

  - id: 'DOC-001'
    severity: low
    finding: |
      Comentário em `server/account/actions.ts:165` afirma "ESLint guard
      recommend: importar createAdmin somente em server/account/actions.ts"
      — entretanto não existe tal lint rule no projeto; trata-se apenas
      de convenção arquitetural (arch §Middleware/Guards L1571). A
      verificação foi feita manualmente via grep (4 paths legítimos
      detectados: account/actions.ts + 2 trackers + lib/track.ts). O
      comentário pode confundir um leitor futuro a procurar uma rule que
      não existe.
    suggested_action: |
      Não-bloqueante. Possível ajuste em Phase 2: (a) editar comentário
      para "convenção arquitetural verificada manualmente — arch §1571";
      ou (b) criar uma ESLint rule customizada `no-restricted-imports`
      restringindo `@/lib/supabase/admin` a paths específicos. Não criar
      story dedicada; encaixar em qualquer follow-up de housekeeping.

  - id: 'SMOKE-001'
    severity: low
    finding: |
      Task 9.2 (smoke runtime manual do delete em conta descartável) foi
      SKIPPED com permissão explícita do operador (interactive answer
      durante develop) e alinhamento à MEMORY `feedback_skip_manual_smoke.md`.
      Cobertura indireta: integration (d) prova cascade end-to-end em 5
      tabelas + auth.users; (d.2) prova case-insensitive; (e) prova unauth
      defense; (f) prova Storage cleanup com upload PNG real → list vazio.
      Component tests cobrem AlertDialog open/close/disabled/submit/error
      em 6 cenários. **Risco residual:** (a) blob download nativo via
      URL.createObjectURL + <a download> não exercitado em browser real
      (browser pode bloquear download, renderizar inline, ou sanitizar
      filename); (b) AlertDialog focus trap (Base UI nativo) não validado
      em screen-reader; (c) sonner toast cross-navigation (persist 4s
      após router.push) não validado visualmente. Mitigações: (a) pattern
      idêntico ao usado em projects comparáveis; (b) REUSE direto do
      mesmo alert-dialog primitive já usado em LinkRow.tsx (Story 2.5/2.6
      Done; focus trap testado lá indiretamente); (c) sonner default 4s
      + pattern REUSE de UsernameForm.tsx (Story 2.4 Done).
    suggested_action: |
      Não-bloqueante. Operador pode opcionalmente fazer smoke 9.2 manual
      com conta descartável (signup novo → criar 1 link → /dashboard/account
      → delete → confirmar toast + redirect + login falha) antes de @devops
      push. Se feito, atualizar story Completion Notes para remover o
      "risco residual" status. Sem o smoke, gate continua PASS — cobertura
      automatizada é robusta.

