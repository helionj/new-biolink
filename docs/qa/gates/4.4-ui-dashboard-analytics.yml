handoff:
  next_agent: '@devops'
  next_command: '*push'
  condition: |
    Gate PASS com 1 MEDIUM (PERF-001 — Lighthouse pendente CI) +
    1 LOW (TEST-001 — flakes ambientais). @devops deve:
    (1) Verificar baseRefName antes de merge (MEMORY
        feedback_check_pr_base_before_merge.md) — PR esperado contra main.
    (2) Push do branch feat/4.4-ui-dashboard-analytics para origin + abrir PR.
    (3) Aguardar required status checks (install/lint/typecheck/test-unit/
        test-components/test-integration/build/gitleaks/audit) + Lighthouse
        CI workflow.
    (4) MONITORAR Lighthouse Performance score do /dashboard/analytics —
        se < 0.85, ESCALAR para @dev aplicar DEV-7 mitigação (dynamic
        import recharts) e re-medir.
    (5) Após PR CLEAN + MERGEABLE → merge squash em main.
    (6) Marcar Story 4.4 Status InReview → Done.
  alternatives:
    - condition: 'Lighthouse Performance < 0.85 no CI'
      action: '@dev *apply-qa-fixes 4.4 — aplicar `dynamic(() => import("recharts"), { ssr: false })` em TimeSeriesChart.tsx; re-build; verificar score.'
    - condition: 'Story 4.5 ready to draft (Conta: Exportar e Excluir — FR16)'
      action: '@sm *draft 4.5 — fecha Epic 4 (analytics + account management).'
