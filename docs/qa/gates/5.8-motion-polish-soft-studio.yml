residual_risks:
  - id: 'RISK-SF-1-SUB-PERCEPTUAL'
    severity: low
    finding: 'Switch flip 75ms + ease-spring (AC2) é semanticamente sub-perceptual — spring overshoot precisa duração ≥ 150-200ms para visual differentiation vs ease-out. Spec §4.5 L1193 confirma `prefers-reduced-motion: reduce` desabilita animações `>= 150ms` (Switch 75ms está abaixo desse threshold). Decisão SF-1 user opt-in ratificada: ship spec verbatim per Art. IV most-specific-wins (§1.5.1 L309 canonical durations + §1.5.2 L321 reserved patterns).'
    mitigation: 'Manual visual review @qa pré-merge via Lighthouse a11y + Vercel preview deploy + dev preview. Se durante review visual smoke acusar ausência de bounce perceptível, considerar amend AC2 em story follow-up (não bloqueia este merge). Trade-off aceito por consistency com motion system canonical.'
  - id: 'RISK-SMOKE-SKIP'
    severity: low
    finding: 'Smoke runtime manual macOS Reduce Motion ON/OFF × 4 motion surfaces (Switch + Dialog + LinkRow drag + Skeleton shimmer) SKIPPED user opt-in pre-implementation (Tasks 8.4 + 12 marcados [x] com nota SKIPPED per MEMORY feedback_skip_manual_smoke.md).'
    mitigation: 'Cobertura indireta via (a) AC6 motion-reduce: explicit em Skeleton primitive (Tailwind 4 variant ≡ @media prefers-reduced-motion: reduce); (b) Switch/Dialog CSS transitions nativas — browsers pause reduced-motion OS-level; (c) dnd-kit/tw-animate-css/sonner library-level reduced-motion respect; (d) Lighthouse a11y audit gate ≥0.85 no PR. Snapshot regen Dialog confirma intenção visual + tests 195/195 PASS confirmam behavior preservation. Pattern Stories 5.4/5.5/5.6/5.7 todas mergeadas com smoke SKIP.'
  - id: 'RISK-HOTFIX-LATE-DISCOVERY'
    severity: low
    finding: 'Build error descoberto pós-commit feat (`d6d89fc`) — story file finalizado APÓS my pnpm build inicial em Task 9; padrões literais `duration-*` no story file (linhas 28/208/340/395) acionaram Tailwind v4 auto-scanner. Hotfix `aad02fb` aplicou `@source not "../docs/**"` em globals.css resolvendo definitivamente.'
    mitigation: 'Future-proof: @source not docs/ é solução canônica Tailwind v4 + previne stories 5.9+ de quebrar build com class patterns em documentação técnica. Test:components + typecheck + lint + build todos re-rodaram pós-hotfix com PASS. Learning para @sm/@po: stories podem mencionar class patterns em comentários sem risk (exclude funcionando).'
  - id: 'MNT-001-DEV-D-SKEL-TEST-SKIP'
