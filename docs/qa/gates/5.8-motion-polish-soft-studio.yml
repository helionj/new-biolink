    finding: 'Skeleton primitive test ESKIP (Task 6.3) — cobertura indireta via AnalyticsLoadingSkeleton.test.tsx pós-refactor (test passou 195/195 confirmando Skeleton primitive consumido corretamente).'
    mitigation: 'Skeleton primitive é trivial (~20 LOC, sem state/handlers, className passthrough via cn()/tailwind-merge pattern bem-validado em Stories 5.3/5.4/5.6). Risk zero — primitive é decoração visual + aria-hidden + consumer já testado. Learning emergente para future stories: NEW primitives triviais (className-only) podem ESKIP test dedicado se consumer tests cobrem indirectly.'

