  §2.1: header sticky novo (bg-background/95 + backdrop-blur + wordmark biolink
  lowercase + Entrar ghost conditional), hero H1 'Seu link na bio, do seu jeito.'
  (text-display 40px verbatim), body 'Crie sua página pública gratuita...'
  (text-body-lg 18px verbatim), CTAs h-12 (primary + secondary ghost
  conditional via DEV-A1 className override), 3 motivos como Card components
  (ShieldCheck/BarChart3/Code icons — DEV-A2 lucide choices), footer minimal
  com ExternalLinkIcon + 'open-source no GitHub' + LGPD-mindful. Auth shared
  layout (app/(auth)/layout.tsx) — ← voltar + wordmark text-h3 lowercase per
