  per §1.3.2). 4 auth forms (Login/Signup/ResetRequest/ResetConfirm) — h-12
  className override em 14 applications (inputs + submits, DEV-A1 NÃO mexer
  em primitives Story 5.3 escopo fechado); Login: 'Esqueci a senha →' movido
  de FormLabel header para self-end entre password input e submit per spec
