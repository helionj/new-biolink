top_issues:
  - id: 'OBS-001'
    severity: low
    finding: |
      **Landing 3 Cards motivos a11y semantic concern (heading hierarchy).**
      Implementação usa `<CardTitle className="text-h2 mt-2">{title}</CardTitle>`
      — visualmente apresenta texto em 24px peso 500 (text-h2 typescale class),
      mas semanticamente renderiza como `<div data-slot="card-title">` (shadcn
      Card primitive — verificado em `components/ui/card.tsx:36`).

      **Impact WCAG 1.3.1 (Info and Relationships):** Screen readers que
      navegam por heading levels (rotor iOS, NVDA H key, JAWS H key) NÃO
      encontram esses cards como `<h2>` headings. Navegação por landmarks
      (`<section>`) ainda funciona; conteúdo é lido sequencialmente.

      **Mitigação parcial existente:** label "3 motivos:" acima dos cards
      estabelece contexto visual + textual (text-body-sm uppercase). Card
      bodies usam CardDescription com text padrão (`text-sm
      text-muted-foreground`).

      Story 5.4 Dev Notes JÁ flagou: "3 Cards motivos usam CardTitle
      (renders como `<div>`) — não é `<h2>` semântico, mas role aria-level
      pode ser adicionado se @qa exigir".
    suggested_action: |
      Não-bloqueante. Heading hierarchy é nice-to-have visual para essa
      surface (cards são informacionais, não navegação primária). Opções:
      (1) **Quick fix** (~5 min): adicionar `role="heading" aria-level="2"`
          ao `<CardTitle>` na Landing — preserva CardTitle data-slot pattern
          shadcn; ARIA reconciliação. Pode ser implementado em
          `[STORY-5.4-F1]` LOW se design system exigir formal a11y heading
          tree.
      (2) **Spec amend** (~10 min): shadcn CardTitle primitive shipped como
          `<div>` é decisão de framework consciente (CardTitle é semantic
          neutral, deixando consumer decidir heading level via composition).
          Story 5.5+ que use Cards podem usar `<h2 className="text-h2">`
          direto no children do Card ao invés de CardTitle. Recomendar
          guideline em `docs/architecture/components.md` se existir.
      (3) **Aceitar como design choice**: Cards informacionais não-navegáveis
          podem usar visual hierarchy sem strict heading semantic — pattern
          comum em landing pages modernas. Documentar decisão e seguir.
      Sem ação obrigatória pré-merge. Aceitar OBS-001 LOW como observation;
      decidir solução em design system review pós-Epic 5 completion.

  - id: 'OBS-002'
    severity: low
    finding: |
      **DEV-A3 header sticky simplificação vs spec wording.** Spec §2.1
      L368 prescreve "Header sticky (transparent on scroll-top)" — wording
      sugere comportamento dinâmico (header transparente quando scrollY=0,
      vira opaque/blur ao scrollar).

      Implementação @dev (DEV-A3 anticipated + aprovado @po validate):
      header SEMPRE `bg-background/95 backdrop-blur-sm` (semi-transparent
      constante). Razão: (a) JS scroll listener adiciona Client Component
      overhead em landing (anti-LCP NFR1); (b) spring transition é Story
      5.8 escopo; (c) backdrop-blur já cria sensação "flutuante" coerente
      com mood Soft Studio.

      Avaliação @qa: trade-off defensável. Constante semi-transparency
      atinge ~80% do perceived effect "flutuante" sem custo JS. Real
      transparent-on-top + scroll-driven blur seria refinamento de
      polish — escopo natural de Story 5.8 (Motion + polish).
    suggested_action: |
      Aceitar como gate-PASS-com-monitoramento. Recomendações:
      (1) Tracking opcional em `[STORY-5.4-F2]` LOW: se Story 5.8 motion
          polish for executada, considerar implementar real
          transparent-on-scroll-top via Client Component wrapper +
          scroll listener (~15 linhas). Owner: `@ux-design-expert`.
      (2) Se design review pós-Epic 5 julgar perceived effect insuficiente,
          decidir entre: (a) aceitar simplification permanente; (b)
          implementar JS scroll listener (custo LCP <100ms estimado pois
          1 listener apenas); (c) explorar CSS-only solution via
          @container queries ou scroll-driven animations Web standard
          (suporte iOS 14+ verificar).
      Sem ação obrigatória pré-merge. Documentar OBS-002 no Change Log da
      Story 5.4 ao mover Status InReview → Done (post-push).

  - id: 'OBS-003'
    severity: low
    finding: |
      **DEV-A2-extra footer icon substitution.** Spec §2.1 L408 prescreve
      "[github icon] open-source" — wording sugere logo GitHub específico.

      Implementação @dev (DEV-A2-extra discovered durante typecheck):
      `lucide-react` v1.14 deste projeto NÃO exporta `Github`/`GithubIcon`
      (verificado via `Object.keys(require('lucide-react'))` — 0 matches
      para "hub" pattern). @dev substituiu por `ExternalLinkIcon` + texto
      "open-source no GitHub" (semantic preservado, repository link
      target intact).

      Workaround é defensible:
      - Alternative options consideradas (per Dev Notes): inline SVG
        custom (brand asset concern), drop icon (UX downgrade)
      - ExternalLinkIcon comunica "link sai do site" — semantic match
        para link externo a github.com
      - Texto "open-source no GitHub" comunica destino verbalmente

      Trade-off: perde reconhecimento visual do logo GitHub, mas ganha
      consistência com icon library do projeto.
    suggested_action: |
      Aceitar como gate-PASS. Sem ação obrigatória. Considerações
      futuras:
      (1) Se brand reconhecimento github logo for crítico, opção de
          adicionar custom SVG inline (`<svg>` com path do GitHub mark
          public asset) — Story 5.9 (Logo + favicon) é o lugar natural
          se design exigir.
      (2) `lucide-react` v1.14 é versão minor/fork do projeto — upgrade
          para canonical `lucide-react` v0.x latest pode expor Github
          export, mas é decision separada (Story TBD se upgrade for
          desejado). Não impacta Story 5.4.

  - id: 'PERF-001'
    severity: low
    finding: |
      Lighthouse Performance score do `/` e `/[username]` ainda não medido
      empiricamente nesta validação local — vai ser medido pelo workflow
      `.github/workflows/lighthouse.yml` disparado no PR via trigger
      `paths: [app/**, components/**]`. Match definitivo: story modifica
      `app/page.tsx` + `app/(auth)/**` + `components/auth/**`. Workflow
      estável após [STORY-3.5-F3] Done (runs:3 + mediana). Bundle expected
      delta **+1-2 KB max** pelos 4 ícones lucide novos (ShieldCheckIcon/
      BarChart3Icon/CodeIcon/ExternalLinkIcon) — todos tree-shakeable;
      Card primitive já no bundle pós-Story 5.3. Header sticky novo + 3
      Cards adicionam ~80 linhas JSX (~2 KB minified).
    suggested_action: |
      Aceitar como gate-PASS-com-monitoramento (padrão Stories 5.2/5.3).
      @devops deve:
      (1) Verificar Lighthouse CI no PR como housekeeping. Se workflow
          falhar por flake, re-run; se 1 das 3 runs falhar mas median
          passar, OK (mediana é o critério canônico per [STORY-3.5-F3]).
      (2) Capturar First Load JS de `/` e `/[username]` reportados pelo
          workflow. Confirmar **mantém** vs baseline pós-5.3 (~180-185 KB
          esperado). Se piorar inesperadamente (>200 KB), investigar
          antes do merge.
      (3) Confirmar LCP `/` mantém < 2.0s per NFR1 (AC15) — header sticky
          é SSR (não-Client), zero impacto LCP esperado.
      (4) Documentar resultado real no Change Log da story ao mover
          Status Ready for Review → Done.

