  fallback) + ghost 'Criar conta →' per §2.3 L506-509; Signup: ADDED password
  helper 'Mínimo 8 caracteres.' per §2.2 L443 (gap real, era ausente).
  Quality gates locais re-rodados independentemente pelo @qa: typecheck exit
  0 ✅ / lint zero warnings ✅. Gates pesados (build Next 16.2.5 Turbopack
  15/15 static pages, test:components 194/194 em 220s) validados pelo @dev
  em sessão develop — outputs capturados em Debug Log References. **1
  snapshot HomePage rewrite + 1 obsolete removed** (auth form tests não usam
  toMatchSnapshot; DEV-D anticipated revisado vs draft que esperava ~5).
  **HomePage.test.tsx rewrite** necessário (não apenas snapshot update — DEV-E):
  2 behavior assertions falharam (getAllByRole('listitem').length=3 não bate
  pois <li> virou <Card>; getByRole exact match falha pois CTAs têm arrow
  suffix); reescrita com regex matchers + getByText em CardTitle + assertions
  para secondary CTA/header Entrar conditional. DEV-A1..A4 + DEV-B/C/D/E + 1
  novo **DEV-A2-extra** todas materializadas e documentadas em Completion
  Notes. **DEV-A2-extra (critical discovery):** lucide-react v1.14 deste
  projeto NÃO exporta Github/GithubIcon (verificado via Object.keys
  filter — 0 matches); @dev substituiu por ExternalLinkIcon + texto
  'open-source no GitHub' — semantic preservado, workaround defensível.
  Constitution Art. IV (No Invention) preservada — ícones lucide são exports
  oficiais (validados via Node), copy verbatim spec §2.1-2.4, tokens
  consumidos via @theme inline classes (text-display/text-h1/text-h2/
  text-body-lg/text-body-sm/text-caption — todas em globals.css pós-5.2).
  Article III (Story-Driven) preservada — escopo restrito ao Source Tree
  listado; zero touch em dashboard/profile/theme/account/analytics/public/
  primitives/migrations/RLS/Server Actions. Backward compat ✓ — zero API
  change nas auth forms (RHF/zodResolver/Server Actions intact); Landing
  getUser() data flow preservado; URL semantics inchanged. Security clean:
  story toca apenas page-level JSX/className + 1 import lucide novo;
  pre-commit gitleaks PASS no commit 5cb9f5d; zero hardcoded secrets;
  zero impact em auth/RLS/env. 3 observações: **OBS-001 LOW** (Landing 3
  Cards motivos usam CardTitle que renders como `<div className="text-h2">`
  ao invés de `<h2>` semântico — story já flagou; WCAG 1.3.1 mitigação via
  contexto label 'motivos:' acima, mas heading navigation degrada; sugestão
  refactor opcional a `<h2>` ou `role="heading" aria-level="2"` — fora de
  escopo desta story, deferir para `[STORY-5.4-F1]` LOW se design system
  exigir); **OBS-002 LOW** (DEV-A3 header sticky sempre semi-transparent ao
  invés de scroll-driven transparent-on-top — defensible LCP-friendly
  decision; spec wording §2.1 L368 sugere comportamento dinâmico, mas
  perceived effect coerente; tracked para Story 5.8 motion+polish se @ux
  exigir); **OBS-003 LOW** (DEV-A2-extra ExternalLinkIcon vs spec '[github
  icon]' — lucide v1.14 ausente Github*, workaround semantic preservado);
  **PERF-001 PENDING-CI** (Lighthouse dispara via paths `app/**` +
  `components/**`; delta esperado +1-2 KB para 4 ícones lucide novos
  tree-shakeable, mantém ≤ 200 KB threshold).
