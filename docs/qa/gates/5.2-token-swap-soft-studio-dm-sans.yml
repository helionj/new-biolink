top_issues:
  - id: 'OBS-001'
    severity: low
    finding: |
      Spec bug + omissão pré-existente do `check-contrast.mjs`. Spec
      `frontend-spec.md` §1.2.1 L148 reivindica `destructive #D14A4A vs
      destructive-foreground #FFFFFF = 4.8:1 AA` mas recalc independente
      (@qa via JS puro com algoritmo W3C WCAG 2.1) confirma **4.385:1
      FAIL** (descoberto pelo @dev no Task 5.1 → DEV-9 swap aplicado).
      Spec §1.2.3 L201 reivindica brand `destructive #D14A4A vs
      background #F0E8FF = 4.6:1 AA` — recalc independente: **3.694:1
      FAIL por 0.806**. Mesmo após DEV-9 swap para `#C84141`, o par
      `text-destructive` (cor) sobre `--background` brand é
      `C84141 vs F0E8FF = 4.126 FAIL AA por 0.374`. Esse par NÃO é coberto
      por `check-contrast.mjs` (cobre só `destructive ↔ destructive-foreground`
      como par "destructive como surface com texto branco em cima" — 4.90
      PASS, padrão pre-existente Story 3.2 dos 9 PAIRS canônicos). Uso
      real de `text-destructive` (como cor de texto) só materializa em
      primitives que consomem essa classe — ex.: `FormMessage` shadcn
      (`text-destructive` para erros de validação) renderizado dentro de
      Card no brand theme renderiza vermelho com contraste 4.13 sobre o
      bg lavender deeper. Sem impacto material na Story 5.2 (AC2 explicita
      "9 pares × 3 temas = 27 checks" e cita preservação da convenção
      Story 3.2 — refactor para parser CSS automatizado + ampliação de
      pares é `[STORY-3.2-F1]` LOW, fora de escopo). Issue **descoberto**
      no gate, **não regressão** da story.
    suggested_action: |
      Não-bloqueante para Story 5.2. Recomendações:
      (1) Registrar **`[STORY-5.2-F1]` LOW** no `docs/STORY-BACKLOG.md`:
          "Amend `frontend-spec.md` §1.2.1 L148 + §1.2.3 L201 com
          ratios corretos pós-DEV-9 (`#C84141 vs #FFFFFF = 4.90` light,
          `#C84141 vs #F0E8FF = 4.13` brand-LOW); decidir se mantém
          `#C84141` (assumindo `text-destructive` é raro em brand) ou
          escurece mais (ex.: `#B83838` para passar AA em brand
          também — recalc: ~4.8). Owner: `@ux-design-expert`."
      (2) Em **Story 5.3 (primitives audit)**: auditar consumidores de
          `text-destructive` (grep em `components/`): `FormMessage`
          shadcn, `DeleteAccountSection`, qualquer outro alert/badge
          destructive renderizado em brand theme. Se algum primitive
          usa `text-destructive` em color (não bg), validar contraste
          contra `--background` brand visualmente ou via testing-library
          `getComputedStyle`.
      (3) Em **Story 5.7** quando Analytics + recharts forem auditados:
          considerar ampliar `check-contrast.mjs` PAIRS para incluir
          `text-destructive ↔ background` (3 themes × 1 par = +3 checks
          → 30 total). Tracked em `[STORY-3.2-F1]` LOW (refactor para
          parser CSS automatizado é o trigger natural).
      Sem ação obrigatória pré-merge. Documentar OBS-001 no Change Log
      da Story 5.2 ao mover Status InReview → Done (post-push).

  - id: 'OBS-002'
    severity: low
    finding: |
      Smoke runtime manual (Task 5.3) **SKIPPED com user-approval**
      durante develop (per MEMORY `feedback_skip_manual_smoke.md`).
      Story file marca `[x]` com nota `_(SKIPPED — cobertura indireta
      via check:contrast 27/27 + test:components 194/194 + build PASS;
      risco residual...)_`. Validação visual de paleta Soft Studio
      renderizando em runtime (`/`, `/dashboard`, `/@demo` × 3 temas)
      não foi exercitada — gate aceita esta convenção dado que: (a)
      check:contrast cobre os 9 PAIRS canônicos × 3 temas = 27 checks
      determinísticos; (b) snapshot `PublicPage.test.tsx.snap`
      confirmou que swap não quebra HTML (Tailwind classes resolvem
      em runtime via `@theme inline`); (c) `test:components` 194/194
      PASS valida que primitives shadcn renderizam corretamente sob
      novos tokens; (d) `build` PASS valida que Tailwind v4 resolve
      todas as utility classes novas (`text-display`, `rounded-2xl`,
      `shadow-lg`, etc.). Risco residual: surfaces secundárias que
      consomem tokens fora dos 9 PAIRS canônicos podem renderizar
      contraste imprevisto (ver OBS-001 sobre `text-destructive`).
    suggested_action: |
      Aceitar como gate-PASS-com-monitoramento (padrão idêntico Story
      5.1 OBS smoke validado em prod pós-merge). Recomendações:
      (1) Smoke pode ser feito por operador opcionalmente antes do
          @devops push — sequência: `pnpm dev` → abrir `/`, `/dashboard`
          (login com seed), `/@demo` em cada um dos 3 temas (alternar
          via `/dashboard/theme`); validar paleta Soft Studio renderiza
          (lavender mist / plum-night / deeper lavender backgrounds +
          deep plum buttons + peach onde já consumidos); DM Sans Variable
          carregada (Network tab confirma `.woff2`); zero FOUT visível
          além de `display: 'swap'`. Se OK, atualizar Completion Notes
          da story removendo SKIPPED + atualizar este gate (OBS-002 →
          PASS-validated-runtime).
      (2) Pós-merge em prod (idem Story 5.1): @devops verifica `/@demo`
          e `/` em prod com 3 temas alternados, captura screenshot OU
          confirma HTTP 200 + html contém classes Tailwind esperadas.
          Sem ação obrigatória; padrão "smoke pós-merge informacional".

  - id: 'PERF-001'
    severity: low
    finding: |
      Lighthouse Performance score do `/` e `/[username]` (rotas
      cobertas pelos thresholds oficiais) ainda não medido
      empiricamente nesta validação local — vai ser medido pelo
      workflow `.github/workflows/lighthouse.yml` (Story 3.5 Task 6 +
      estabilizado em 4.2 com runs:3 mediana per [STORY-3.5-F3] Done)
      disparado no PR via trigger `paths: [app/**]`. Match definitivo:
      story modifica `app/globals.css` + `app/layout.tsx`. Bundle
      baseline `/` antes desta story estava em **199.06 KB gz First
      Load JS** ([STORY-3.5-F1] LOW — margem apertada ~1KB do
      threshold AC3 < 200KB de Story 3.5). Story 5.2 muda:
      **+** DM Sans Variable woff2 (~22 KB latin-ext per spec §1.3.1)
      **−** Geist Sans woff2 (~25-28 KB)
      **−** Geist_Mono woff2 (~12-15 KB — REMOVIDO via DEV-4, sem
            consumer real no MVP).
      **Net estimated:** **−15 a −20 KB** no bundle de `/`. Margem
      AC3 da Story 3.5 deve **melhorar**.
    suggested_action: |
      Aceitar como gate-PASS-com-monitoramento (padrão idêntico 5.1
      PERF-001). @devops deve:
      (1) Verificar Lighthouse CI no PR como housekeeping. Se workflow
          falhar por flake, re-run; se 1 das 3 runs falhar mas median
          passar, OK (mediana é o critério canônico per
          [STORY-3.5-F3]).
      (2) Capturar First Load JS de `/` e `/[username]` reportados
          pelo workflow. Confirmar **melhoria** vs baseline 199.06 KB
          (esperado < 185 KB). Se piorar inesperadamente (>200KB),
          investigar antes do merge (pode ser DM Sans com latin-ext
          maior que estimado).
      (3) Documentar resultado real no Change Log da story ao mover
          Status InReview → Done.

