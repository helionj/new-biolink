    Gate PASS com 2 LOW observations + 1 PENDING-CI:
    - OBS-001 LOW: spec bug + omissão pré-existente check-contrast (não
      bloqueia AC2; tracking via [STORY-5.2-F1] LOW);
    - OBS-002 LOW: smoke runtime SKIPPED user-approved (validar pós-merge
      em prod, padrão Story 5.1);
    - PERF-001 PENDING: Lighthouse CI no PR (bundle expected to improve).

    @devops deve:
    (1) Verificar baseRefName antes de merge (MEMORY
        `feedback_check_pr_base_before_merge.md`) — PR esperado contra
        `main` (Story 5.2 = primeira do refresh Epic 5; branch base =
        main; sem stack sobre outro feature branch).
    (2) Branch `feat/5.2-token-swap-soft-studio` já existe local (2
        commits ahead: `e6271c0` docs + `0f25f0d` feat). Push do branch
        para origin via `git push -u origin feat/5.2-token-swap-soft-studio`.
    (3) Abrir PR contra main via `gh pr create --base main --title
        "feat: Soft Studio token swap + DM Sans (Story 5.2)" --body ...`.
    (4) Aguardar required status checks: install/lint/typecheck/test-unit/
        test-components/test-integration/build/gitleaks/audit/lighthouse.
    (5) MONITORAR Lighthouse CI no PR (PERF-001). Capturar First Load JS
        de `/` e `/[username]` reportados — esperado < 185 KB (melhoria
        vs baseline 199.06 KB). Se workflow falhar por flake, re-run
        (mediana é critério canônico [STORY-3.5-F3]); se piorar
        inesperadamente, investigar antes do merge.
    (6) Após PR CLEAN + MERGEABLE → merge squash em main.
    (7) Marcar Story 5.2 Status `Ready for Review → Done`.
    (8) Notar no Change Log da story (close-story commit): primeira
        story do refresh visual Epic 5 (Soft Studio Phase 1) materializada;
        `[EPIC-5-S2]` ✅ DONE no backlog; path crítico desbloqueado
        (Story 5.3 pronta para `@sm *draft`).
    (9) **Backlog action (housekeeping):** registrar `[STORY-5.2-F1]`
        LOW em `docs/STORY-BACKLOG.md` — "Amend `frontend-spec.md`
        §1.2.1 L148 + §1.2.3 L201 com ratios destructive recalculados
        (DEV-9 swap); decidir se ajusta mais hex para passar AA também
        em brand `text-destructive` color sobre bg lavender". Owner:
