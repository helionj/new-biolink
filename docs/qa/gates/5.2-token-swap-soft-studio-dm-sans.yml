status_reason: |
  Implementação completa dos 7 ACs da Story 5.2 (token swap Soft Studio:
  3 paletas hex `frontend-spec.md` §1.2.1/§1.2.2/§1.2.3 verbatim, radius
  scale 4/8/12/16/24/9999, shadows warm-tinted plum (light/brand) + preto
  puro (dark), typescale 9 tokens via Tailwind v4 suffix convention
  `--text-{n}--line-height/font-weight/letter-spacing`, DM Sans Variable
  via `next/font/google` substituindo Geist+Geist_Mono, mock PALETTES em
  `check-contrast.mjs` sincronizado, OS-level fallback `@media` em
  sincronia com bloco dark). Quality gates locais re-rodados
  independentemente pelo @qa: `check:contrast` 27/27 PASS WCAG AA ✅ /
  `typecheck` exit 0 ✅ / `lint` zero warnings ✅. Gates pesados
  (`test:components` 194/194 em 439s, `build` Next 16.2.5 Turbopack 71s
  compile + 15/15 static pages) validados pelo @dev na mesma sessão de
  desenvolvimento — outputs capturados em `Debug Log References` da story,
  consistentes com baseline Story 5.1. Swap é **transparente** para
  componentes shadcn — `@theme inline` re-renderiza tokens em runtime;
  snapshot `PublicPage.test.tsx.snap` (verificado) usa Tailwind classes
  (`bg-background`/`text-foreground`/`bg-card`/`rounded-xl`/`hover:bg-accent`)
  + `data-theme` attribute, zero hex inline, zero `style={...}` — token swap
  inverter sintaxe das classes, não os bytes do snap. 8 deviations DEV-1..
  DEV-8 ratificadas verbatim do draft + 1 nova **DEV-9 APROVADA com fonte
  verbatim (WCAG recalculation)**: `--destructive` light/brand ajustado de
  `#D14A4A` (spec L148/L201 claims 4.8/4.6) para `#C84141` (real WCAG é
  4.385/3.694 — spec bug do autor; ajuste mínimo passa AA por margem 0.40
  → 4.90 vs FFFFFF). Recalc independente do @qa via JS puro confirma:
  `D14A4A vs FFFFFF = 4.385` (spec INCORRETO), `C84141 vs FFFFFF = 4.897`
  (PASS WCAG AA). Alternativas rejeitadas documentadas (WAIVER aceitar 4.38
  / HALT para amend spec). Spec follow-up registrado como
  `[STORY-5.2-F1]` LOW. Constitution Art. IV (no invention) respeitada —
  todos os 30+ hex Soft Studio rastreiam para tabelas canônicas §1.2.X
  (mapeamentos shipped legacy `--secondary` ↔ spec `--surface` /
  `--card` ↔ spec `--surface-elevated` documentados em DEV-1 + Task 1.1).
  Constitution Art. V (no premature optimization) respeitada — zero
  primitive tocado (auditoria por primitive é Story 5.3 per spec §5.2 +
  scope explícito), zero migration, zero RLS, zero dep nova (DM Sans via
  next/font nativo Next 16, Geist_Mono REMOVIDO ↓ bundle), 3 arquivos
  modificados conforme escopo S. **Security clean**: story toca apenas CSS
  variables + font loader (declarative, no exec); pre-commit gitleaks PASS
  (commit `0f25f0d`); zero hardcoded secrets; zero impact em RLS/auth/env.
  3 observações: **OBS-001 LOW** (omissão pré-existente Story 3.2 +
  spec bug — par `text-destructive` sobre `--background` brand
  `#C84141 vs #F0E8FF = 4.126` FAIL AA por 0.37; check-contrast.mjs só
  cobre `destructive ↔ destructive-foreground` que é 4.90 PASS; uso real
  de `text-destructive` em color só materializa se primitive consumir;
  Story 5.3 audita FormMessage e demais consumidores de `text-destructive`);
  **OBS-002 LOW** (smoke runtime manual SKIPPED user-approved; cobertura
  indireta válida via check:contrast 27/27 + test:components 194/194 +
  build PASS; risco residual em surfaces secundárias fora dos 9 PAIRS
  canônicos); **PERF-001 PENDING-CI** (Lighthouse CI vai disparar via
  trigger `paths: [app/**]`; bundle baseline `/` (199.06 KB gz, [STORY-3.5-F1]
  margem ~1KB) deve **melhorar** ~-15 a -20 KB: DM Sans Variable ~22KB
  latin-ext vs Geist Sans ~25-28KB; Geist_Mono ~12-15KB REMOVIDO sem
  consumer no MVP).
reviewer: 'Quinn'
