schema: 1
story: '1.9'
gate: PASS
status_reason: 'Landing pública SSR + canary de produção, fechamento do Epic 1. Stub create-next-app de `app/page.tsx` removido 100% e reescrito como Server Component async: hero/3-benefícios/footer-GitHub + CTA condicional por sessão via `createClient()`+`auth.getUser()` (pattern de dashboard/layout.tsx — correto porque middleware bypassa `/`, Story 1.7). 5/6 ACs PASS direto (AC1/AC2/AC3/AC5/AC6); AC4 (Lighthouse) = handoff manual ao owner pós-deploy com `lighthouse.yml` DIFERIDO via decisão PO documentada (DP-1, Change Log v0.2) + backlog item rastreado [STORY-1.9-F1] + risco LOW — NÃO-bloqueante, consistente com o padrão de handoff validado 1.5–1.8. Quality gate 6/6 verde confirmado INDEPENDENTEMENTE pelo CI do PR #7 (run 25937802724: lint/typecheck/test-unit/test-components/test-integration/build/audit/gitleaks todos pass). Zero regressão, 0 deps NPM novas, 0 mudanças DB/Server Actions/migrations. CTA via `buttonVariants` (zero JS de cliente — protege AC4/Lighthouse); job `health-check` em ci.yml seguro (curl+grep -qF, URL pública, sem secrets, push:main only). Gate MANUAL aplicado per QA-001 (CodeRabbit disabled em core-config `mcp.enabled:false` + macOS/WSL incompatível; ver docs/qa/known-issues.md).'
reviewer: 'Quinn'
updated: '2026-05-15T15:52:00Z'

acceptance_criteria_coverage:
  AC1_landing_ssr_hero_beneficios_footer: PASS    # app/page.tsx reescrito de stub create-next-app → Server Component async. <main> com <section> hero (<h1> "Sua presença digital em um único link" + <p> tagline + CTA), <section> benefícios = <ul> com EXATAMENTE 3 <li> (BENEFITS as const), <footer> com link GitHub (https://github.com/helionj/new-biolink, rel="noopener noreferrer" target="_blank"). SSR confirmado (ƒ / no build output). Markup determinístico verificado no component test (h1 level 1, getAllByRole('listitem') length 3, link github href/rel/target).
  AC2_cta_condicional_sessao: PASS                # `const supabase = await createClient(); const { data: { user } } = await supabase.auth.getUser();` (idêntico ao pattern canônico de app/dashboard/layout.tsx). Guest → ctaLabel "Criar minha página" / ctaHref "/signup"; autenticado → "Ir para meu dashboard" / "/dashboard". `/` é bypass explícito do middleware (Story 1.7) → a página chama getUser() ela mesma — consequentemente `/` é SSR DINÂMICA (ƒ /), esperado e correto per Dev Notes §Auth (NÃO defeito). Ambas as branches cobertas pelo component test (guest + autenticado, incl. queryByRole confirmando ausência do CTA guest no estado autenticado).
  AC3_seo_meta_og_placeholder: PASS               # `export const metadata: Metadata` em page.tsx (title/description landing-oriented + openGraph com images:[{url:'/og-image.png'}]). public/og-image.png placeholder neutro 1200×630 (slate-300, 3.1 KB, zlib — sem identidade visual, correto: branding é escopo @ux-design-expert/Epic 3). Fix correto: `metadataBase: new URL(env.NEXT_PUBLIC_SITE_URL)` no root layout (sem ele Next resolveria OG p/ localhost:3000) — reusa env validado de lib/env, WHY-comment apropriado, fonts/<Toaster/> intocados (boundary respeitado). lang="pt-BR" confirmado intocado.
  AC4_lighthouse_90: CONCERNS                      # NÃO-BLOQUEANTE — handoff manual ao owner. `.github/workflows/lighthouse.yml` NÃO criado (compliance com DP-1: decisão PO documentada em Change Log v0.2 — automação Lighthouse DIFERIDA a story de CI dedicada, backlog item [STORY-1.9-F1] criado pelo PO com risk LOW + acceptance definidos). AC4 verbatim diz "na URL de produção", não "automatizado no CI" (≠ AC6 que exige "no CI") → evidência manual satisfaz o AC literal. Guards de UI aplicados e verificados no código p/ proteger o score: zero JS de cliente no CTA (`<Link className={buttonVariants({size:'lg'})}>`, sem 'use client', sem next/image), <h1> único, semântica <ul>/<li>, text-foreground/text-muted-foreground (contraste AA), foco/teclado nativos (<a>/<Link>). Scores reais (Performance/Accessibility/Best Practices/SEO) = handoff ao owner pós-deploy (branch ainda não merged/deployed; mesma natureza do smoke Task 7.1). Consistente com o padrão de handoff PASS de 1.5–1.8.
  AC5_health_indicator_footer: PASS               # Footer renderiza `Build {buildTime} · {commitSha}` discreto (text-xs text-muted-foreground, somente footer, hero intocado). Injeção via next.config.ts `env: { NEXT_PUBLIC_BUILD_TIME: new Date().toISOString(), NEXT_PUBLIC_COMMIT_SHA: process.env.VERCEL_GIT_COMMIT_SHA?.slice(0,7) ?? 'local' }` (DP-2 default aprovado pelo PO). Fallback determinístico `?? 'dev'`/`?? 'local'` fora da Vercel (estável p/ snapshot). WHY-comment apropriado em next.config.ts.
  AC6_health_check_ci: PASS                       # Job `health-check` em .github/workflows/ci.yml (DP-3 default aprovado PO): `needs: build`, `if: github.event_name == 'push' && github.ref == 'refs/heads/main'` (só pós-merge — no PR aparece corretamente como "skipping", ≠ falha). Polling curl (30 tentativas × 10s = ~5 min teto) tolerando o deploy assíncrono Vercel↔GitHub; sucesso = HTTP 200 + `grep -qF "Criar minha página"` (CTA guest, fixed-string seguro); falha = dump debug + exit 1. Sem framework E2E (PRD §Requisitos de Testes). Sem secrets, URL pública hardcoded (NFR10). `set -uo pipefail` (sem -e deliberado p/ não abortar no curl de tentativa falha — correto p/ retry loop).

security_checklist:
  no_injection_surface: PASS              # Nenhum dangerouslySetInnerHTML; todo conteúdo são constantes app-controladas (título/tagline/BENEFITS/labels) renderizadas como texto. `user` (getUser) usado apenas p/ branch booleano + href, NUNCA renderizado. Zero superfície XSS introduzida.
  external_link_hardening: PASS           # Link GitHub e (no stub removido) externos: footer GitHub usa rel="noopener noreferrer" target="_blank" — verificado no código e asserido no component test. Reverse tabnabbing mitigado.
  no_secrets_in_code: PASS                # Job health-check sem `env:`/secrets (URL pública hardcoded). next.config.ts injeta apenas build-time ISO + short SHA (não-sensível). gitleaks (CI run 25937802724) pass. metadataBase reusa NEXT_PUBLIC_SITE_URL (já validado em lib/env, público por design).
  ci_no_shell_injection: PASS             # health-check usa `grep -qF "$EXPECTED"` (fixed-string, sem interpretação de regex/glob) e variáveis aspeadas; URL/EXPECTED são literais hardcoded no workflow (não input externo). curl --max-time 20 + -sSL. Sem `eval`, sem interpolação de input não-confiável.
  no_authz_change: PASS                   # Nenhuma mudança de auth/authz/RLS/Server Actions. getUser() na landing é leitura defensiva (sem redirect — `/` é público por design, middleware bypassa). Defesa-em-profundidade alinhada a arch §Middleware/Guards.
  no_new_env_or_config_risk: PASS         # 0 deps NPM novas; vars NEXT_PUBLIC_* são build-time não-sensíveis; tests/setup.ts intocado.

