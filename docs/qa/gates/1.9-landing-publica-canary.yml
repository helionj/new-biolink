code_review_findings:
  - id: 'CR-001'
    severity: info
    finding: 'CTA implementado como `<Link className={buttonVariants({ size: "lg" })}>` em vez de `<Button render={<Link/>}>`. Alternativa EXPLICITAMENTE sancionada pela story (buttonVariants cva confirmado exportado em components/ui/button.tsx). Escolha correta: zero JS de cliente na landing-canary (protege AC4/Lighthouse, Task 5 guard) + markup determinístico p/ o component test. Ainda é REUSE do design system (mesma fonte de estilo buttonVariants), NÃO variante inventada (Constitution Art. IV ok).'
    location: 'app/page.tsx'
    action_required: false
  - id: 'CR-002'
    severity: info
    finding: 'metadataBase adicionado ao root app/layout.tsx (não a page.tsx). Correto: metadataBase é config de resolução de URL absoluta que pertence ao root metadata; sem ele o build avisa que /og-image.png resolveria p/ localhost:3000. Reusa env.NEXT_PUBLIC_SITE_URL (lib/env validado). Fonts/<Toaster/> intocados — boundary @dev respeitado (metadata do layout é editável; o que NÃO se deve tocar é fonts/Toaster, e não foi).'
    location: 'app/layout.tsx'
    action_required: false
  - id: 'CR-003'
    severity: info
    finding: 'health-check usa `set -uo pipefail` (deliberadamente SEM `-e`): correto p/ um retry loop — `-e` abortaria o script no primeiro curl de tentativa falha, impedindo o polling. O tratamento de erro é explícito (HTTP_CODE=...||echo "000", exit 1 só após esgotar MAX_ATTEMPTS). Rationale documentado no comentário do job.'
    location: '.github/workflows/ci.yml (job health-check)'
    action_required: false
  - id: 'CR-004'
    severity: info
    finding: 'Component test mocka `next/link` p/ um anchor determinístico — evita necessidade de AppRouter context em jsdom (DP-4 default usado, sem fallback de componente síncrono). Pattern mock-then-import espelha tests/components/features/auth/SignupForm.test.tsx (precedente do projeto). Cenário autenticado também asserta AUSÊNCIA do CTA guest (queryByRole ... not.toBeInTheDocument) — cobertura de branch robusta.'
    location: 'tests/components/features/landing/HomePage.test.tsx'
    action_required: false

