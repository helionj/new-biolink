deviations_reviewed:
  - description: 'DEV-1: RPC `reorder_links` via migration 0005 (não updates sequenciais client-side)'
    resolution: 'APPROVED — materialização mecânica de schema-design.md §7 Q1 RESOLVED L899-926 (decisão do @data-engineer documentada EXPLICITAMENTE para a Story 2.6). 0004_links.sql tail (linhas 185-202) já documenta o padrão BEGIN;UPDATE×N;COMMIT; mencionando "Server Action reorderLinks() da Story 2.6". Constitution Art. IV compliant — não invenção. Já validado pelo gate @po v0.2 (IDS G3 override com razão documentada).'
    severity: 'low'
  - description: 'DEV-2: `@dnd-kit/core` + `@dnd-kit/sortable` + `@dnd-kit/utilities` via pnpm add (altera package.json + lock legitimamente)'
    resolution: 'APPROVED — diferente do precedente shadcn-add 2.4/2.5 (lock intacto): dep de runtime real, sancionada arch §Tech Stack L167 ("@dnd-kit/core + @dnd-kit/sortable... Reorder de links (FR7)... Touch-friendly, a11y nativa"). @dnd-kit/utilities é helper de CSS.Transform.toString do template canônico arch §1069. Versões instaladas: @dnd-kit/core ^6.3.1, @dnd-kit/sortable ^10.0.0, @dnd-kit/utilities ^3.2.2. Já validado @po v0.2.'
    severity: 'low'
  - description: 'DEV-3: Botões ↑/↓ (AC4) inline no cluster de controles do LinkRow, não em dropdown'
    resolution: 'APPROVED — AC4 literal "no menu de cada link" interpretada como cluster de controles (onde já vivem switch/edit/delete). Dropdown esconderia a alternativa de teclado AC-mandada, piorando descoberta a11y e contrariando o espírito da AC. Interpretação sólida via espírito de AC4 + arch §2401 (a11y) + precedente DEV-6 da 2.5 (AC UX destrutivo aceita pelo @po). Já validado @po v0.2.'
    severity: 'low'
  - description: 'DEV-4: KeyboardSensor (dnd-kit) E botões ↑/↓ (ambos, não um ou outro)'
    resolution: 'APPROVED — KeyboardSensor dá paridade DnD por teclado no widget sortable nativo; AC4 EXIGE explicitamente os botões ↑/↓ como alternativa. Ambos chamam o mesmo persistOrder (DRY). AC mantida verbatim. Decisão de implementação correta.'
    severity: 'low'
  - description: 'DEV-5: router.refresh() pós-sucesso reconcilia server state, mantendo otimismo'
    resolution: 'APPROVED — padrão das ops existentes em LinkRow (commitTitle/commitUrl/onConfirmDelete chamam router.refresh()). Estado otimista local + revalidateUserSurface na action + router.refresh = consistência eventual correta. useState+snapshot+rollback é padrão sancionado em LinkRow (arch §1141). Decisão de implementação.'
    severity: 'low'
  - description: 'DEV-6: position 1-based vindo de WITH ORDINALITY (gaps OK)'
    resolution: 'APPROVED — WITH ORDINALITY é 1-based; usar direto como position. Client ordena por position ASC, base 0 vs 1 é irrelevante p/ UI. Gaps em outras ops (delete) sancionados Q1 RESOLVED ("eventualmente normalizados se usuário reorderar"). Decisão de implementação.'
    severity: 'low'
  - description: 'DEV-7: Regenerar lib/supabase/types.ts via mcp__supabase__generate_typescript_types (não editar à mão)'
    resolution: 'APPROVED — supabase.rpc("reorder_links", ...) tipado off Database["public"]["Functions"]; sem a função nos types, cliente strict acusa erro. Regeneração é o caminho sancionado (regra 2.5 "NÃO tocar types.ts" = não editar à MÃO; regenerar é OK). Diff revisado: APENAS adiciona Functions.reorder_links substituindo `[_ in never]: never`. Zero drift em links/pages/profiles.'
    severity: 'low'
  - description: 'QA-FIX-001: 3 non-null assertions em LinkList.test.tsx (typecheck strict noUncheckedIndexedAccess)'
    resolution: 'APPLIED BY QA — typecheck re-rodado pelo @qa falhou inicialmente em linhas 105/122/135 (user.click(upButtons[1])/downButtons[1]/downButtons[0] com HTMLElement|undefined sob noUncheckedIndexedAccess). Fix mínimo (3 chars `!`) dentro da QA authority "QA owns test suites". Pós-fix: typecheck exit 0, test:components 99/99. Não-bloqueante; merece registro em Change Log v0.4 da story.'
    severity: 'low'

