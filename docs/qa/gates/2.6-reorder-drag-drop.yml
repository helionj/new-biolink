top_issues:
  - id: 'QA-FIX-001'
    severity: low
    category: 'tooling'
    finding: >-
      `pnpm typecheck` re-rodado pelo @qa falhou inicialmente em 3 linhas de
      tests/components/features/links/LinkList.test.tsx (linhas 105, 122,
      135): `user.click(upButtons[1])` / `user.click(downButtons[1])` /
      `user.click(downButtons[0])` com `tsconfig.json` `noUncheckedIndexedAccess: true`
      → indexed-access retorna `HTMLElement | undefined`, mas
      `userEvent.click()` exige `Element`. Tests passavam em runtime
      (222/222 antes do fix) — falha exclusivamente em tsc --noEmit strict.
      Change Log v0.3 do @dev reportou "typecheck ✓"; divergência
      provavelmente por cache stale do tsserver ou ordem dos passos.
    suggested_action: >-
      RESOLVIDO no review — @qa aplicou non-null assertion (`!`) nos 3
      indexed-access (`upButtons[1]!`/`downButtons[1]!`/`downButtons[0]!`)
      após os `expect(...[0]).toBeDisabled()` adjacentes que já provam a
      existência. Fix mínimo (3 chars), dentro da authority "QA owns test
      suites" (qa.commands.create-suite). Pós-fix: typecheck exit 0;
      test:components 99/99 em 16 files (zero regressão). Não-bloqueante,
      mas merece registro em Change Log v0.4 (qa-fix) na story.
  - id: 'OBS-001'
    severity: low
    category: 'security'
    finding: >-
      `has_function_privilege('service_role', reorder_links, 'EXECUTE')` =
      true. É o default Postgres — service_role mantém EXECUTE em funções
      do schema `public` mesmo após REVOKE de PUBLIC/anon. service_role
      bypassa RLS, então em tese poderia chamar `reorder_links` em nome de
      qualquer usuário.
    suggested_action: >-
      Não-bloqueante — mitigado pelo corpo da função: `auth.uid()` em
      conexão service_role (sem `set_config` de JWT) é NULL → o primeiro
      guard `RAISE EXCEPTION 'Não autenticado' USING ERRCODE = '42501'`
      bloqueia. Defense-in-depth funcional. Revogar explicitamente de
      service_role seria over-engineering e desvia do padrão Supabase
      (service_role é por design onipotente; assumir senão é miss
      arquitetural maior). Documentado para auditoria; sem ação
      requerida.

