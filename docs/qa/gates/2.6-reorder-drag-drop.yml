status_reason: 'Todos os 5 ACs satisfeitos. Reorder drag-and-drop implementado via RPC `reorder_links` (migration 0005, SECURITY INVOKER + WITH ORDINALITY single-statement + DEFERRABLE constraint avaliada no COMMIT da função — materialização canônica de schema-design.md §7 Q1 RESOLVED). AC1 handle dedicado `<button aria-label="Reordenar link">` com `{...attributes} {...listeners}` + `touch-none` + sensores Pointer/Touch/Keyboard com activationConstraints corretos (distance:6 mouse, delay:200/tolerance:6 touch, sortableKeyboardCoordinates teclado); AC2 `persistOrder(nextLinks)` em LinkList: snapshot → setLinks otimista → await reorderLinks → rollback em !ok + toast.error / sucesso → toast.success("Ordem atualizada") + router.refresh(); AC3 batch transacional: `supabase.rpc("reorder_links", { p_ordered_ids })` em Server Action espelhando verbatim padrão das 4 actions 2.5 (safeParse+flattenFieldErrors, guard getUser→SESSION_EXPIRED, mapLinkError sem vazar error.message cru, revalidateUserSurface); AC4 paridade teclado dupla: KeyboardSensor nativo do dnd-kit + botões `<ChevronUp/>`/`<ChevronDown/>` no cluster de controles do LinkRow (aria-label "Mover para cima"/"Mover para baixo", disabled nos boundaries — interpretação DEV-3 inline-não-dropdown validada @po v0.2); AC5 integration test (c) seed de 5 links via createLink + reorderLinks({orderedIds:[id5,id1,id2,id3,id4]}) + re-fetch via admin confirma positions=[1,2,3,4,5], new Set(positions).size===5 (unicidade), ordem por position bate com newOrder — prova material do DEFERRABLE-em-1-TX via RPC. quality_gate_tools re-executados INDEPENDENTEMENTE pelo @qa: pós QA-fix-001 (3 non-null assertions em LinkList.test.tsx triggered por noUncheckedIndexedAccess: true) — typecheck/lint/build exit 0; pnpm test 222/222 em 27 arquivos (baseline 2.5 = 203/27, delta +19 testes 2.6, zero regressão); pnpm test:components pós-fix 99/99 em 16 files (sem regressão pelo fix). Migration aplicada ao projeto Supabase único `ibpliihqaceafdykgwiu` confirmada: pg_proc → prosecdef=false (INVOKER ✓), proconfig=["search_path=public"] ✓, EXECUTE auth=true / anon=false / public=false / service_role=true (default Postgres — service_role bypassa RLS mas a função RAISE 42501 quando auth.uid() IS NULL, defense-in-depth ok); list_migrations confirma registro `20260520010618_0005_reorder_links_fn`. Segurança OWASP/RLS: SECURITY INVOKER preserva auth.uid()+RLS links_update_own; WHERE links.page_id = v_page_id (resolvido de pages WHERE profile_id=auth.uid()) → ids cross-user não casam (no-op silencioso, sem leak de existence — validado integração (d) cross-user); RAISE EXCEPTION em auth/page nula (42501/P0002); GRANT EXECUTE TO authenticated + REVOKE PUBLIC/anon (least-privilege espelhando RLS de 0004); mapLinkError NUNCA vaza error.message cru; Zod safeParse com input:unknown sem `as any`; sem novos imports de next/cache (revalidateUserSurface mantém autoridade exclusiva — lib/cache.ts); sem secrets/credenciais; gitleaks clean. 0 blockers; 2 observações low/info não-bloqueantes (QA-FIX-001 typecheck strict aplicado em testes — corrigido; OBS-001 service_role.EXECUTE=true é default Postgres, mitigado por RAISE 42501 no corpo). DEV-1..DEV-7 todas APPROVED (arch §167 dnd-kit; §400 reorderLinks signature; §742-765 Workflow 3; §1066-1104 LinkRow useSortable canônico; §2398 revalidateUserSurface; schema-design.md §7 Q1 RESOLVED L899-926; §549 gaps 1-based WITH ORDINALITY — não invenção; já validadas pelo gate @po v0.2). IDS G3 override (executor:@dev / quality_gate:@qa vs Schema/DB→@data-engineer) APPROVED — design CLOSED (Q1 RESOLVED + 0004 tail especificam o reorder explicitamente para 2.6, autoria @data-engineer); migration 0005 = materialização mecânica, não novo design; precedente verbatim sancionado 2.1/2.3/2.4/2.5 (todas Done).'
reviewer: 'Manual gate per QA-001 (CodeRabbit self-healing loop indisponível em macOS sem WSL/CodeRabbit CLI — docs/qa/known-issues.md). @qa Quinn auditou o código real (lib/validators/link.ts, server/links/actions.ts, components/links/{LinkList,LinkRow}.tsx, supabase/migrations/0005_reorder_links_fn.sql + rollback companion, lib/supabase/types.ts regenerado, 4 test files appended) + matriz de rastreabilidade AC↔teste Given-When-Then + re-execução INDEPENDENTE dos quality_gate_tools no commit e45877f pós QA-fix-001 (typecheck/lint/build exit 0; pnpm test 222/222 em 27 arquivos) + introspecção do projeto Supabase único `ibpliihqaceafdykgwiu` via mcp__supabase__list_migrations + execute_sql (pg_proc: prosecdef/search_path/has_function_privilege) para suprir ausência de CI nesta fase. Branch feat/2.6-reorder-drag-drop, 1 commit (e45877f) stacked sobre main (aaf2e11 — Story 2.5 mergeada via PR #12). Sem PR/CI nesta fase — push + PR + CI são downstream de @devops (exclusivo @github-devops, agent-authority.md).'
