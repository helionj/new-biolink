schema: 1
story: '2.7'
gate: PASS
status_reason: 'Todos os 7 ACs satisfeitos (AC6 Lighthouse manual pendente conforme precedente sancionado 2.5/2.6 — não-bloqueante). Página pública `/@username` implementada como Server Component (zero JS client-side) com `getPublicPage` envolto em `cache()` do React para dedup entre `generateMetadata` e render (2 round-trips Supabase via embed `profiles!inner` — DEV-3 vs RPC nova). RLS anon-path coberta pelas policies `profiles_select_public` / `pages_select_public` / `links_select_public` já materializadas (Stories 1.4/2.2/2.3 — Done). `<a target="_blank" rel="noopener noreferrer">` literal por link (AC4) via createElement-pattern de LinkRow (Story 2.5). DEV-1 (divergência consciente do arch §Routing L1167 — `app/[username]/page.tsx` ao invés de `app/@[username]` por colisão com convenção parallel routes do Next.js 16) documentada no header do arquivo + guard `parseUsername` decoded → `notFound()`. DEV-FIX-003 (FIX-RT-001) capturou e corrigiu bug runtime crítico: Next.js 16 Turbopack RSC entrega `params.username` URL-encoded (`%40helionporto`), não decoded — `parseUsername` extraída para `lib/parse-username.ts` com `decodeURIComponent` defensivo + 10 unit tests cobrindo literal/encoded/malformed/edge. Smoke runtime do user confirmou `/@helionporto` → HTTP 200 pós-fix. quality_gate_tools re-executados INDEPENDENTEMENTE pelo @qa no commit c06a8cb: typecheck/lint/build exit 0; pnpm test 238/238 em 30 arquivos (delta +16 vs baseline 2.6 — unit +10 parse-username, components +3 PublicLinkCard, integration +3 public-page). Branch feat/2.7-pagina-publica-ssr (2 commits dbf8cbf feature + c06a8cb fix) stacked sobre f7d9676 (Story 2.6 Done; main = aaf2e11 com 2.5 #12). 2 observações low não-bloqueantes (OBS-001 Lighthouse manual; LESSON-001 unit test de parser para rotas dinâmicas com chars especiais — memória salva). DEV-1..DEV-4 + DEV-FIX-001..DEV-FIX-003 todas APPROVED.'
reviewer: 'Manual gate per QA-001 (CodeRabbit self-healing loop indisponível em macOS sem WSL/CodeRabbit CLI — docs/qa/known-issues.md). @qa Quinn auditou o código real committed (commits c06a8cb + dbf8cbf) — app/[username]/page.tsx, app/not-found.tsx, components/public/{PublicPage,PublicLinkCard}.tsx, lib/parse-username.ts, server/page/queries.ts, tests/{unit/parse-username,integration/public-page,components/features/public/PublicLinkCard,components/ui/button}.test.{ts,tsx} — + matriz de rastreabilidade AC↔teste Given-When-Then + re-execução INDEPENDENTE dos quality_gate_tools (typecheck/lint/build exit 0; pnpm test 238/238 em 30 arquivos) + validação SQL via projeto Supabase único `ibpliihqaceafdykgwiu` (REST embed direto reproduzindo a query exata do getPublicPage para confirmar AP-1 — payload válido retornado para anon-key) + smoke runtime do próprio user `/@helionporto` → HTTP 200 pós DEV-FIX-003. Branch feat/2.7-pagina-publica-ssr stacked sobre f7d9676 (Story 2.6 Done). Sem PR/CI nesta fase — push + PR + CI são downstream de @devops (exclusivo @github-devops, agent-authority.md).'
updated: '2026-05-20T13:50:00Z'

review_method: manual
review_note: >-
  Gate manual aplicado via workaround QA-001 (docs/qa/known-issues.md) —
  ambiente macOS sem WSL/CodeRabbit; Seção 0 (CodeRabbit Self-Healing Loop)
  da task qa-review-story.md travaria. Story end-to-end frontend (rota SSR +
  query SSR + 2 Server Components + 404 page + helper de parsing): quality_gate
  owner é @qa (per Executor Assignment + IDS G3 flag já validado pelo gate @po
  v0.2 — não re-litigado; precedente sancionado e Done de 2.1/2.3/2.4/2.5/2.6).
  Revisão dos 7 quality checks lendo o código real committed (c06a8cb + dbf8cbf)
  + AC traceability + re-execução INDEPENDENTE dos gates locais
  (typecheck/lint/build exit 0; pnpm test 238/238 em 30 arquivos —
  unit 62, components 102, integration 74) + reprodução da query AP-1 via REST
  direto no Supabase (curl com anon-key → embed profiles!inner retornou row
  válida, prova material do RLS anon-path) + smoke runtime do user no dev
  server confirmou /@helionporto HTTP 200 pós DEV-FIX-003. Deviations já
  validadas pelo gate @po v0.2 (DEV-1..DEV-4) não re-litigadas (convenção 2.3+).
  DEV-FIX-003 (FIX-RT-001) é o achado mais importante deste ciclo: bug runtime
  que NÃO seria pego pelos integration tests (que chamam getPublicPage com
  slug já decoded, mascarando o problema do params raw); detectado APENAS via
  smoke manual do user — lição arquitetural relevante para futuras rotas
  dinâmicas (Story 4.x extenderá esta rota). Memória salva em
  ~/.claude/projects/.../memory/project_next16_turbopack_params_encoded.md.

top_issues:
  - id: 'OBS-001'
    severity: low
    category: 'requirements'
    finding: >-
      AC6 (Lighthouse ≥ 90 nas 4 categorias em página de perfil seed) não foi
      executado nesta sessão — requer `pnpm dev` + seed user + Chrome + `npx
      lighthouse`. Smoke manual também permanece [ ] (Task 10.3) por padrão.
    suggested_action: >-
      Não-bloqueante per precedente sancionado das Stories 2.5/2.6 (smoke
      manual = handoff owner, não bloqueia Done). User pode rodar antes de
      @po *close-story 2.7 OU aceitar como tech debt para Lighthouse-CI da
      Story [STORY-1.9-F1] (backlog). Threshold ≥ 90 em
      Performance/Accessibility/Best Practices/SEO. Comando documentado em
      Completion Notes da story (`npx lighthouse http://localhost:3000/@<seed-user>
      --preset=desktop/--preset=perf --view`).
  - id: 'LESSON-001'
    severity: low
    category: 'testing'
    finding: >-
      O bug DEV-FIX-003 (Next.js 16 Turbopack RSC entrega `params.username`
      URL-encoded `'%40helionporto'`, não decoded) NÃO foi detectado pelos
      integration tests existentes — esses chamam `getPublicPage(slug)`
      diretamente com a string já decoded, mascarando o problema no parser
      de rota. Detectado APENAS via smoke runtime do user. Lição arquitetural
      relevante para Story 4.x (extenderá esta rota) e para qualquer futura
      rota dinâmica com chars especiais (`/[...slug]`, `/[foo]`).
    suggested_action: >-
      RESOLVIDO no próprio commit c06a8cb — `parseUsername` extraída para
      `lib/parse-username.ts` com 10 unit tests cobrindo literal/encoded/
      malformed/edge cases. Memória persistida em
      `~/.claude/projects/.../memory/project_next16_turbopack_params_encoded.md`
      para evitar re-incidência em futuras stories. Recomendação para o
      template `create-next-story.md`: incluir checklist "se a rota tem
      segmento dinâmico com chars especiais (não-ASCII), adicionar unit test
      do parser de params explicitando literal+encoded+malformed" — issue
      upstream no framework AIOX (não-bloqueante para esta story).
  - id: 'OBS-002'
    severity: low
    category: 'architecture'
    finding: >-
      `components/public/PublicPage.tsx` usa `<Image src={profile.avatar_url}>`
      do `next/image`. Quando a Story 3.4 (Avatar UX — upload de avatar via
      Supabase Storage) entrar e usuários efetivamente uploadarem avatars,
      o `next.config.ts` precisará whitelistar o hostname do Supabase Storage
      (`*.supabase.co/storage/...`) via `images.remotePatterns`. Hoje NÃO
      dispara em runtime porque signup-fresh tem `avatar_url=null` (fallback
      `<User/>` lucide DEV-4 é renderizado).
    suggested_action: >-
      Não-bloqueante para esta story (zero impacto em runtime hoje).
      Documentar para a Story 3.4 — adicionar à Task de "Avatar UX" o
      side-effect de atualizar `next.config.ts` `images.remotePatterns` com
      o hostname canônico do Supabase Storage. Alternativa: pré-emptivamente
      atualizar `next.config.ts` agora (mas seria over-engineering — a Story
      3.4 vai precisar configurar bucket+RLS+uploader; configurar o
      remotePatterns junto é mais coesivo).

