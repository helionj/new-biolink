deviations_reviewed:
  - description: 'DEV-1: `app/[username]/page.tsx` (segmento dinâmico) ao invés do literal `app/@[username]/page.tsx` do arch §Routing L1167'
    resolution: 'APPROVED — Next.js 16 trata qualquer pasta `@folder` como slot de parallel route, rejeitando `app/@foo/` como segmento URL. Resolução pragmática: segmento `[username]` simples + guard server `params.username.startsWith('@')` (post-decode) + middleware bypass `/@*` (Story 1.7:39, não-tocado) + lib/reserved-usernames.ts (Story 2.1) bloqueando colisão de signup. Divergência consciente documentada em header-block de 23 linhas no próprio arquivo (precedente: middleware.ts:6-19). Já validado @po v0.2.'
    severity: 'low'
  - description: 'DEV-2: Tracking server-side de page view (FR10) é Story 4.2 — fora de escopo desta story'
    resolution: 'APPROVED — PRD Story 2.7 ACs 1-7 não mencionam tracking; arch §Workflow 2 L728 cita insert de `page_views` server-side mas explicitamente como Story 4.2. Hoje esta rota tem ZERO side-effects extras na primeira render (Lighthouse limpo). Story 4.2 estenderá `page.tsx` adicionando call a `insertPageView()` server-side. Já validado @po v0.2.'
    severity: 'low'
  - description: 'DEV-3: 2 round-trips Supabase com embed (vs RPC `get_public_page` única)'
    resolution: 'APPROVED — Supabase JS suporta JOIN via embed (`profiles!inner(...)`) mas não compõe 2 statements em 1 round-trip; RPC exigiria migration 0006 nova + função SECURITY INVOKER, complexidade desnecessária para esta story. 2 × 30-50ms cabem no P95<100ms target arch §Performance L2188-2196. Verificado durante o gate via REST direto: embed retorna `{id, theme, profiles: {...}}` corretamente (relação 1:1 via FK isOneToOne:true). Refactor para RPC postergado se Lighthouse mostrar gargalo de TTFB. Já validado @po v0.2.'
    severity: 'low'
  - description: 'DEV-4: Avatar fallback é `<User/>` lucide em `<div bg-muted>`, não iniciais color-hashed'
    resolution: 'APPROVED — preserva LCP (sem `next/image` quando não há src real), a11y (`<User aria-hidden="true">` em decorativo); iniciais + color-hash exigiria util novo (overkill MVP). Precedente shadcn/ui Avatar (componente real de Story 3.4 pendente — refactor trivial). Já validado @po v0.2.'
    severity: 'low'
  - description: 'DEV-FIX-001: `tests/components/ui/button.test.tsx` href `/x` → `https://example.com/x`'
    resolution: 'APPROVED — dano colateral INEVITÁVEL da introdução de `app/[username]/page.tsx` (segmento dinâmico captura qualquer single-segment path); a regra `@next/next/no-html-link-for-pages` passou a disparar para `<a href="/x">` artificial do teste de polimorfismo do `Button` (Story 1.8). Fix mínimo (URL absoluta) preserva 100% da intenção do teste (polimorfismo render→<a>) sem `eslint-disable`; comentário inline explica a razão. Modifica arquivo de outra story (1.8) mas é fix técnico inevitável dentro do escopo legítimo "make a new dynamic route work". Aceitável.'
    severity: 'low'
  - description: 'DEV-FIX-002: `import "server-only"` removido de `server/page/queries.ts`'
    resolution: 'APPROVED — package só existe no runtime do Next.js (não no Vitest puro), causando "Cannot find package" nos integration tests. Codebase inteiro NÃO usa este package em nenhum outro lugar (grep verificado: zero matches além do `server/page/queries.ts` original). Remoção alinha com padrão existente (`lib/cache.ts`, `server/links/actions.ts` também não usam). Proteção contra import do client continua via convenção de path (`server/`).'
    severity: 'low'
  - description: 'DEV-FIX-003 (FIX-RT-001): `parseUsername` extraída para `lib/parse-username.ts` com `decodeURIComponent` defensivo'
    resolution: 'APPROVED + APPLAUDED — fix de bug runtime crítico descoberto via smoke manual do user. Causa raiz: Next.js 16 Turbopack RSC entrega `params.username` URL-encoded (`%40helionporto`) e NÃO decoded; `parseUsername` inicial `raw.startsWith("@")` rejeitava `%40` → notFound silencioso. Fix: extrair para lib/ (pure helper testável, reusável); `decodeURIComponent(raw)` com try/catch (URI malformed → null sem expor erro); guard de username vazio; lowercase normalization. 10 unit tests cobrindo literal/encoded/lowercase/malformed/edge. **CRÍTICO:** o bug NÃO era detectável pelos integration tests (que chamam getPublicPage com slug já decoded — mascarando o problema no parser de rota); este é exatamente o tipo de issue que justifica `*develop` produzir release-candidate + smoke validation antes do gate. Lição salva em memória (LESSON-001) e recomendada como checklist no template `create-next-story.md` para rotas dinâmicas com chars especiais. Smoke runtime pós-fix do user confirmou `/@helionporto` HTTP 200.'
    severity: 'medium → resolved (was a real runtime bug, classified low after fix)'

