      username', usernameLower).eq('is_published', true).maybeSingle()` —
      sintaxe canônica Supabase JS validada via REST direto durante o gate;
      query (b) usa `idx_links_page_id_position_visible` parcial de
      0004_links.sql L88 (index-only scan possível); cast `pageRow.profiles
