      className="mx-auto flex w-full max-w-md flex-col items-center gap-6
      px-4 py-8 sm:py-12">` (mobile-first, sem `lg:max-w-...`); avatar com
      `<Image priority width={96} height={96} alt="">` (LCP arch §Performance
