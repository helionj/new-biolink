  - description: 'DEV-5: lib/link-icons.ts catálogo curado — lucide@1.14 sem ícones de marca (Instagram/Github/etc removidos por trademark, verificado por introspecção); usa genéricos por propósito'
    resolution: 'APPROVED — DEV-5 tem latitude sancionada (@po v0.2: default aceitável, ajustável sem refactor). Todos os slugs casam o CHECK ^[a-z0-9-]{1,40}$ e resolvem p/ componente existente (verificado). Decisão alinhada à realidade do pacote instalado, não invenção.'
