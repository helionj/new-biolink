    status: PASS
    notes: |
      Server Actions: queries em PK/FK indexados (profiles.id PK,
      pages.profile_id FK, links.page_id FK idx_links_page_id de 0004,
      links.id PK). createLink = 4 queries leves (username, page, maxPos,
