    severity: 'low'
  - description: 'DEV-2/DEV-3: Zod alinhado ao CHECK do DB (não ao snippet ilustrativo arch §1310-1317) + input:unknown/flattenFieldErrors (não `as any` §1327)'
    resolution: 'APPROVED — anti-hallucination correto (Constitution Art. IV): snippet arch tem defeitos (.url() deprecado, icon max(50)≠CHECK, as any); alinhar ao CHECK real de 0004 + precedente 2.1 Done é fonte+precedente, não invenção. Já validado @po v0.2.'
    severity: 'low'
  - description: 'DEV-correlato (anti-hallucination, descoberto na Task 9): embed profiles.pages!inner(id) (arch §1338-1342) tipado como array pelos tipos gerados mas PostgREST retorna objeto único (FK 1:1) — quebrava createLink + dashboard/page.tsx em runtime'
    resolution: 'APPROVED — mesma classe DEV-2: realidade runtime/typegen > snippet ilustrativo arch. Substituído por 2 queries diretas type-safe (sem casts). Bug não pego por typecheck/lint/component-tests, EXPOSTO pelo teste de integração real — valida a estratégia de testes da story. Fix correto e mínimo. NÃO invenção (FK/queries triviais alinhadas ao schema 0004 real).'
    severity: 'low'
  - description: 'DEV-4: primitivos shadcn dialog/switch/alert-dialog via add (sem init); button.tsx/package.json/lock intactos'
    resolution: 'APPROVED — pattern sancionado 2.4 (add só faltantes, Base UI-backed). Verificado: md5 package.json/lock idêntico antes/depois, button.tsx overwrite recusado. Não invenção. Já validado @po v0.2.'
