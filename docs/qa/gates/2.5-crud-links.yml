top_issues:
  - id: 'UX-001'
    severity: low
    category: 'usability'
    finding: >-
      LinkRow.commitTitle/commitUrl chamam setEditing(false) ANTES de aguardar
      updateLink, então o input desmonta imediatamente e o título/URL estático
      mostra o valor ANTIGO até a Server Action resolver (setTitle/setUrl com
      res.data). Janela de inconsistência visual sub-segundo durante o
      round-trip.
    suggested_action: >-
      Não-bloqueante — consistência eventual, sem erro de correção de dados
      (o valor correto aparece ao resolver; router.refresh re-sincroniza).
      Polish futuro: manter o input visível/disabled (pending) até a action
      resolver, então sair do modo edição. Sem impacto em AC3.
  - id: 'OBS-002'
    severity: low
    category: 'reliability'
    finding: >-
      updateLink/deleteLink/toggleLinkVisibility fazem uma 2ª query
      profiles.select('username') pós-mutation só para revalidate; se essa
      query falhar, revalidateUserSurface(null) pula a revalidação da página
      pública.
    suggested_action: >-
      Não-bloqueante — degradação graciosa: /dashboard ainda revalida; a rota
      /@username só existe a partir da Story 2.7 (revalidar path inexistente
      já é no-op). Aceitável p/ MVP; revisitar quando a página pública existir.
  - id: 'OBS-003'
    severity: low
    category: 'concurrency'
    finding: >-
      createLink calcula nextPos = max(position)+1 via SELECT separado seguido
      de INSERT (não atômico). Dois createLink concorrentes na mesma page
      podem colidir na constraint UNIQUE(page_id, position) → 23505.
    suggested_action: >-
      Não-bloqueante e POR DESIGN — mapeado defensivamente p/ 'Conflito de
      ordenação' (mapLinkError 23505). Dashboard é single-user (baixa
      concorrência); o reorder atômico via constraint DEFERRABLE é escopo
      explícito da Story 2.6 (arch §7 Q1 RESOLVED). Comportamento alinhado ao
      design arquitetural fechado.

waiver: { active: false }

quality_checks:
  code_review:
    status: PASS
    notes: |
      server/links/actions.ts: 4 actions espelham server/profile/actions.ts —
      'use server', input:unknown + Zod safeParse (DEV-3, sem `as any`),
      flattenFieldErrors local verbatim (não acopla módulos server/), guard
      getUser ×4 → SESSION_EXPIRED, mapLinkError(code) → PT-BR (PGRST116→
      "Link não encontrado", 42501→"Operação não permitida", 23514→"Dados do
      link inválidos", 23505→"Conflito de ordenação", fallback genérico) SEM
      vazar error.message cru. createLink: resolve username + pageId via 2
      queries diretas type-safe (fix do bug typegen↔runtime), nextPos=max+1
      (gaps OK — Q1), insert+select+single. updateLink: patch só com campos
      presentes (guard empty), RLS update_own. deleteLink: .delete().select('id')
      detecta não-owner (0 rows ⇒ ok:false). toggleLinkVisibility: update+
      single. lib/validators/link.ts: Zod 4 PascalCase+Input, alinhado
      VERBATIM ao CHECK de 0004 (trim/min1/max100; regex ^https?:// i;
      ^[a-z0-9-]{1,40}$ opcional; uuid). lib/cache.ts: revalidateUserSurface
      conforme arch §1278-1298 (único módulo a importar revalidatePath).
      lib/link-icons.ts: catálogo curado de slugs lucide GENÉRICOS (marca
      removida do lucide@1.14 — verificado), todos casam o CHECK, getLinkIcon
      fallback Link. LinkRow.tsx: inline edit (Enter/blur commit, Escape
      cancela), Switch otimista+rollback, AlertDialog confirmação dupla,
      createElement p/ ícone (lint-stable). AddLinkModal.tsx: Dialog
      controlado + RHF/zodResolver, select nativo (icon ''→undefined p/ não
      quebrar o opcional Zod; SEM primitivo select extra — escopo DEV-4),
      trigger via prop p/ reuso. page.tsx RSC: guard + query direta pages
      (fix typegen) + links order position asc. Código limpo, legível,
      manutenível. 0 CRITICAL/HIGH.
