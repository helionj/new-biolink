  - description: 'DEV-6: "modal de confirmação dupla" (AC5) = AlertDialog destrutivo + botão "Excluir" explícito ≠ "Cancelar"'
    resolution: 'APPROVED — arch §2401 exige "sempre modal" em destrutivos; interpretação confirmada suficiente p/ MVP pelo gate @po v0.2 (type-to-confirm seria over-engineering p/ delete de link). AC mantida verbatim. Não invenção.'
