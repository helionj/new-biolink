        page.tsx:39-42 monta `<ProfileMetaForm currentDisplayName=... currentBio=... />`
        entre `<AvatarUpload>` e `<UsernameForm>` (DEV-7 ordem visual).
        `components/profile/ProfileMetaForm.tsx:70-94` renderiza FormField
        `display_name` com `<Input type="text" maxLength={50}>`;
        :95-117 renderiza FormField `bio` com `<Textarea maxLength={280} rows={4}>`.
        Ambos campos opcionais — defaults usam `currentDisplayName ?? ''`
        e `currentBio ?? ''` (linha 37-40); Zod schema marca ambos como
        `.optional()` (validators/profile.ts:62-69). Test 2 prova render
        com defaults null vazios + submit funciona sem erro de validação.

    - id: AC2
      verdict: PASS
      evidence: |
        `lib/validators/profile.ts:62-69` UpdateProfileMetaInput schema:
        `display_name: z.string().trim().max(50, 'Nome de exibição deve ter
        no máximo 50 caracteres').optional()` (PT-BR per NFR11);
        `bio: z.string().trim().max(280, 'Bio deve ter no máximo 280
        caracteres').optional()`. `.trim()` antes de `.max()` é exigência
        verbatim do AC2 ("limites de FR13 + `trim`") e funcionalmente
        idêntico ao snippet original (que tinha `.trim().max().optional()`
        + transform). Test 3 prova trim aplicado (`'  Novo Nome  '` →
        mock recebe `'Novo Nome'`). Test 4 prova erro PT-BR em > 50 chars
        ("Nome de exibição deve ter no máximo 50 caracteres"); Test 5
        análogo para > 280 chars ("Bio deve ter no máximo 280 caracteres").
        Limites alinhados verbatim a CHECK constraints em
        `0002_profiles.sql:68-69` (display_name <= 50; bio <= 280) — defense
        in depth server-side preserva validação mesmo se Zod for bypassed.

    - id: AC3
      verdict: PASS
      evidence: |
        `server/profile/actions.ts:120-165` `updateProfileMeta(input: unknown):
        Promise<ActionResult<Profile>>` segue 1:1 o padrão de `updateUsername`
        (linhas 29-77 do mesmo arquivo): (a) `safeParse(input)` → fieldErrors
        achatados via `flattenFieldErrors`; (b) `createClient()` + `getUser()`
        → defense in depth com mensagem "Sessão expirada"; (c) UPDATE sob
        RLS `profiles_update_own` (0002:107-115 USING/WITH CHECK auth.uid()
        = id) → sem service-role; (d) `error || !profile` → mensagem genérica
        PT-BR "Erro ao atualizar perfil. Tente novamente". Retorno
        `{ ok: true, data: profile }` consistente com ActionResult<T>
        (lib/result.ts). Sem mapeamento 23505 (não há UNIQUE em
        display_name/bio — ao contrário de username) — corretamente omitido.
        Test 3 prova happy path com `{ok: true, data: makeProfile(...)}`;
        Test 6 prova error path do server propagado para toast.error.

    - id: AC4
      verdict: PASS
      evidence: |
        `components/profile/ProfileMetaForm.tsx` espelha estrutura de
        `components/profile/UsernameForm.tsx` (Story 2.1): mesmo Form +
        FormField + FormControl + FormLabel + FormMessage; mesmo
        zodResolver + RHF; mesmo padrão toast.success/error + setError
