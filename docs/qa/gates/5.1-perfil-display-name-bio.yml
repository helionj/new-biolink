schema: 1
story: '5.1'
gate: PASS
status_reason: |
  Implementação completa dos 6 ACs do PRD §FR13 / §Epic 5 Story 5.1 (form
  /dashboard/profile com display_name + bio editáveis sob RLS profiles_update_own,
  validação Zod com limites 50/280 + trim + PT-BR, Server Action
  updateProfileMeta no padrão de updateUsername, UI shadcn Form + RHF
  espelhando UsernameForm, router.refresh + revalidateUserSurface, 6 component
  tests cobrindo render + validação + submit + erro + trim). Quality gates
  locais 100% verdes (re-rodados pelo @qa): typecheck ✅ / lint ✅ / build ✅
  (15 pages, /dashboard/profile dynamic per esperado) / 194 component tests
  34 files ✅ (6 novos em features/profile/ProfileMetaForm.test.tsx; zero
  regressão na suite full). 7 deviations DEV-1..DEV-7 ratificadas verbatim
  + 1 nova **DEV-8 APROVADA com fonte verbatim**: normalização `'' → null`
  movida do Zod `.transform` (snippet original) para a Server Action
  `updateProfileMeta`. Motivo técnico documentado em
  `lib/validators/profile.ts:54-71`: o shim shadcn `<FormField>` em
  `components/ui/form.tsx:28-37` declara `ControllerProps<TFieldValues, TName>`
  com **2 generics** (sem `TTransformedValues`), incompatível com
  `useForm<TInput, _, TOutput>` quando o schema tem `.transform`. Alternativas
  rejeitadas: cast `as any` (perde safety) e modificar shim (toca primitive
  design system, fora do escopo). Semântica funcional **idêntica**: '' chega
  ao banco como NULL via inline `v && v.length > 0 ? v : null` em
  `server/profile/actions.ts:140-151`, preservando fallback
  `display_name ?? '@username'` em `components/public/PublicPage.tsx:34`
  (verificado por leitura direta). Constitution Art. IV (no invention)
  respeitada — todas as 8 DEVs com fonte verbatim citada (FR13 + 0002:65-69
  CHECK + 0002:107-115 RLS + PublicPage.tsx:34/63 + lib/cache.ts
  revalidateUserSurface + UsernameForm.tsx pattern + form.tsx:28-37 shim
  constraint). Constitution Art. V (no premature optimization) respeitada —
  zero migration nova, zero RLS policy nova, REUSE extensivo (Input primitive,
  FormField, revalidateUserSurface, ActionResult, toast, cn helper,
  UsernameForm pattern). **Security clean**: usa `createClient()` RLS-aware
  (zero service-role), auth guards em 3 camadas (middleware 1.7 + dashboard
  layout 2.4 + Server Action getUser), sem mapeamento 23505 (não há UNIQUE
  em display_name/bio — único error path é `error || !profile` → mensagem
  genérica). 2 observações: OBS-001 LOW (caveat de processo no Dev Agent
  Record — a afirmação "test:components 2× PASS" foi imprecisa: 2 das 3
  execuções tinham output vazio do pipe `| tail` e exit code não refletia a
  execução real; @qa detectou aqui 1 teste falhando da própria story após
  DEV-8 refactor → assertion `{display_name: null}` mudou para `''`,
  correção de 1 linha + suite full re-validada verde 194/194; recomendação:
  no futuro, evitar `| tail` em runs longos ou usar `tee` para preservar
  exit code) + PERF-001 LOW (Lighthouse CI vai disparar no PR via
  `paths: [app/**, components/**]` — rota é authenticated `/dashboard/profile`,
  fora dos 4 categories da landing/público; risco material ~zero porque
  add é +1 Client Component leve sem chart lib).
reviewer: 'Quinn'
updated: '2026-05-29T12:00:00Z'

top_issues:
  - id: 'OBS-001'
    severity: low
    finding: |
      Caveat de processo descoberto durante QA gate (não bloqueia produto).
      Dev Agent Record na story afirma "`pnpm test:components` (suite completa)
      → PASS (exit 0, 2 execuções consecutivas)". Investigação no QA gate
      mostra que 2 dessas 3 execuções foram lançadas em background com pipe
      `2>&1 | tail -10` e output files de tamanho 0 — o exit code 0
      reportado pelo runtime de bash era do `tail` (que recebeu EOF antes do
      vitest emitir), não da execução real do vitest. A 1ª run da story
      isolada genuinamente passou (após fix do '18/280'), mas a suite full
      pós-DEV-8 refactor NÃO foi re-validada de fato. Quando @qa re-rodou
      `pnpm test:components` no foreground, **1 teste da própria 5.1**
      falhou: `<ProfileMetaForm> renderiza vazio com defaults null e submete
      { display_name: null, bio: null }` — assertion antiga esperava
      `{ display_name: null, bio: null }` mas com Zod sem transform o
      onSubmit recebe `{ display_name: '', bio: '' }` (a normalização para
      `null` agora vive na Server Action — DEV-8). Correção de 1 linha
      aplicada + isolated suite verde 6/6 + suite full re-validada verde
      **194/194** em 727s. Zero impact em produção.
    suggested_action: |
      Não-bloqueante. Recomendações para futuras stories:
      (1) Evitar `pnpm test 2>&1 | tail -N` em background — usar `tee log
          | tail -N` se precisar de stream e arquivo, OU rodar direto sem
          pipe (foreground); o `| tail` pode mascarar exit code do upstream
          em pipefail-off shells.
      (2) Sempre re-rodar a suite full no foreground após refactor de
          schema/types que afete shape de mocks (DEV-8 mudou shape dos
          values enviados pelo client; assertions de mocks precisam ser
          revisitadas).
      (3) Considerar adicionar `set -o pipefail` em scripts de CI/local
          (já é default no GitHub Actions runner) — confirmar comportamento
          local em macOS/zsh.
      Sem ação obrigatória no produto. Cobrir como "lição aprendida" em
      MEMORY do @dev (ou folow-up no backlog se virar recorrente).

  - id: 'PERF-001'
    severity: low
    finding: |
      Lighthouse Performance score do `/dashboard/profile` ainda não medido
      empiricamente nesta validação local. Workflow `.github/workflows/
      lighthouse.yml` (Story 3.5 Task 6 + estabilizado em 4.2 com runs:3
      mediana per [STORY-3.5-F3] Done) vai disparar no PR porque trigger
      `paths: [app/**, components/**]` matchéia commits desta story
      (`app/dashboard/profile/page.tsx` + `components/profile/ProfileMetaForm.tsx`
      + `components/ui/textarea.tsx`). Diferença vs landing: `/dashboard/profile`
      é rota authenticated, **NÃO** medida pelos 4 thresholds Lighthouse
      oficiais do gate (que cobrem `/` + `/[username]`). Workflow vai rodar
      mas score da rota authenticated não bloqueia. Adds da story são
      mínimos: +1 Client Component leve (RHF + Zod já no bundle base) + 1
      primitive Textarea (~200 bytes). Sem chart lib, sem dynamic imports
      novos. Risco material praticamente zero.
    suggested_action: |
      Aceitar como gate-PASS-com-monitoramento (padrão idêntico a 4.4 / 4.5).
      @devops deve verificar Lighthouse CI no PR como housekeeping. Se
      workflow falhar por outro motivo (flake), @devops re-run; se passar,
      nenhuma ação. Documentar resultado no Change Log da story ao mover
      Status InReview → Done.

