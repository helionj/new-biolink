updated: '2026-06-05T15:30:00Z'

top_issues:
  - id: 'REL-001'
    severity: low
    finding: |
      `pnpm db:types` produziu diff cosmético de 528 lines em `lib/supabase/types.ts`
      pós-apply (single-quote → double-quote, semicolon removal, multi-line Json
      expansion). Causa: Supabase CLI v2.98.2 emite TypeScript com Prettier 3
      defaults built-in (double-quote, no-semi) — diverge do projeto `.prettierrc`
      (`singleQuote: true`, `semi: true`). Diff é PURAMENTE FORMATTING (zero
      schema/type change semântico verificado via prettier reconcile). Resolvido
      em runtime via `pnpm exec prettier --write lib/supabase/types.ts` →
      diff final empty ✓ AC6 PASS. Mitigação documentada em Dev Agent Record
      Completion Notes + Change Log v1.0.
    suggested_action: |
      (a) Adicionar `pnpm exec prettier --write lib/supabase/types.ts` ao script
      `pnpm db:types` para auto-reconcile pós-regen (1-line script change em
      `package.json`); OU (b) atualizar Supabase CLI 2.98.2 → 2.105.0 (latest)
      para verificar se nova versão respeita `.prettierrc` do projeto. Não-bloqueante;
      workaround comprovado. Considerar `[STORY-INFRA-F1]` (XS) se priorizado.

  - id: 'OBS-001'
    severity: low
    finding: |
      12 lints PERF herdados de Stories 2.x (`multiple_permissive_policies` em
      `links_select_own` + `links_select_public`; `pages_select_own` +
      `pages_select_public`) + 5 lints SEC herdados (`anon_security_definer_function_executable`
      + `authenticated_security_definer_function_executable` + `auth_leaked_password_protection`
      + `extension_in_public` (citext) + `public_bucket_allows_listing` (avatars))
      permanecem post-Story 6.2 — TODOS explicitly OUT-OF-SCOPE per Story 6.2
      Dev Notes "Out-of-Scope" section + AC7/AC8 narrow scope statement. Bonus
      removal observado: `set_updated_at search_path mutable` (lint SEC herdado
      Story 1.4) também resolvido pelo batch hardening Section 2 ALTER FUNCTION
      — baseline SEC herdado caiu 6→5 lints.
    suggested_action: |
      Tracking via `[STORY-X-F1]` futuras LOW se priorizadas:
      (a) `multiple_permissive_policies` em links/pages: refactor para single
      OR-combined policy (separate Phase 2 story tech-debt);
      (b) `anon/authenticated_security_definer_function_executable`: review
      `on_auth_user_created` SECURITY DEFINER → considerar SECURITY INVOKER
      se possible (separate hardening story);
      (c) `auth_leaked_password_protection`: config Auth (Studio dashboard
      toggle — devops scope);
      (d) `extension_in_public` (citext): migrate citext para schema dedicado
      (Phase 2 schema refactor — breaking change requer migration plan);
      (e) `public_bucket_allows_listing` (avatars): refactor bucket policy
      (Phase 2 storage hardening).
      Não-bloqueante; lints WARN não-ERROR; produção MVP sem impact mensurável.

  - id: 'OBS-002'
    severity: low
    finding: |
      DEV-3 REVERSAL cross-story documented: Story 4.2 v0.2 explicitly ratified
      `auth.uid()` direto em `page_views_select_own` por "coerência arquitetural
      com 8 policies anteriores" + comment inline `0008_page_views.sql:127`
      "usar auth.uid() direto (NÃO `(select auth.uid())`)". Story 6.2 REVERTE
      essa decisão via batch hardening — wrapper canonical aplicado a TODAS
      as 9 policies inclusive `page_views_select_own`. Defensibility:
      (a) coerência batch hardening cross-story (advisor compliance unified);
      (b) Supabase advisor pós-2024 explicitly recommends wrapper como canonical
      fix; (c) zero mudança de comportamento observable — apenas execution plan
      otimizado (InitPlan 1× vs N×); (d) gate file 4.3 handoff alternatives
      explicitly suggested consolidation in `0010_db_hardening`. Documented
      em 3 locais: migration header (Section "DEV-3 REVERSAL NOTE") + Dev Agent
      Record Completion Notes + STORY-BACKLOG Change Log entry.
    suggested_action: |
      Não-action — reversal explicitly documented + ratified user opt-in
      pre-implementation (AskUserQuestion 2026-06-04 Cluster B approach). Para
      futuros leitores: `0008_page_views.sql:127` comment é HISTORICAL CONTEXT
      (decisão original Story 4.2); reality post-Story 6.2 é wrapper aplicado.
      Considerar update inline comment em 0008 separately se priorizado spec
      hygiene (`[STORY-6.2-F1]` opcional — XS effort, doc-only).

  - id: 'OBS-003'
    severity: low
    finding: |
      Single-shared Supabase project pattern (`ibpliihqaceafdykgwiu` local/CI/prod
      compartilhado per MEMORY `reference_supabase_project.md`) — Story 6.2
      `supabase db push --linked` aplicou migration **diretamente em produção**
