decisions_review:
  - decision: 'DEV-1: Dashboard surface inteira permanece light; cada card aplica seu próprio tema via wrapper interno'
    source: '@sm draft v0.1'
    validated_by: '@po gate v0.2 (GO 10/10 HIGH confidence)'
    qa_verdict: ENDORSED
    qa_note: 'Não re-litigado (convenção 2.3+). Arquiteturalmente sólido: (i) schema não tem profiles.theme (FR12 = "tema por página"); (ii) introduzir DDL nesta story violaria Art. IV; (iii) usar pages.theme como proxy de "tema do user" é semanticamente errado (page ≠ user em phase 2). UX trade-off intencional aceitável — usuário entende que /dashboard/theme mostra previews, não o tema da própria UI. Consistente com Stories 3.1/3.2 (dashboard light, página pública themed). Se @po decidir dashboard themed pós-MVP, story dedicada STORY-3.x-DASHBOARD-THEME é o caminho.'
  - decision: 'DEV-2: Server Component <ThemePreview> em vez de iframe (AC3 admite ambos)'
    source: '@sm draft v0.1'
    validated_by: '@po gate v0.2'
    qa_verdict: ENDORSED
    qa_note: 'Não re-litigado. Trade-off documentado: cascade `<div data-theme>` já provado em 3.2 PublicPage; iframe exigiria rota dedicada (/api/theme-preview?theme=X) + CSP + refresh handling — overhead sem ganho. Preview é thumbnail ~200×280px — facsimile fiel é suficiente. Alternativas rejeitadas (transform: scale, iframe com rota) corretamente NÃO executadas.'
  - decision: 'DEV-3: Single-query UPDATE filtrado por profile_id (RLS já garante isolamento)'
    source: '@sm draft v0.1'
    validated_by: '@po gate v0.2'
    qa_verdict: ENDORSED
    qa_note: 'Não re-litigado. RLS `pages_update_own` (0003_pages.sql Story 2.2) restringe UPDATE ao owner — `.eq("profile_id", user.id)` é defense in depth. Relação 1:1 profiles→pages garantida por trigger AFTER INSERT ON auth.users (Story 2.2). `.single()` garante exit precoce em zero rows. Performance: 1 query vs 2 do padrão server/links/actions.ts:createLink (que precisa do page_id porque mexe em links, não em pages). Integration test (d) "two-users isolation" valida programaticamente: USER_B muta SUA page, page de USER_A intacta — RLS confirmado in vivo.'
  - decision: 'DEV-4: Optimistic UI + rollback + useTransition (não useOptimistic)'
    source: '@sm draft v0.1'
    validated_by: '@po gate v0.2'
    qa_verdict: ENDORSED
    qa_note: 'Não re-litigado. Padrão verbatim Story 2.6 LinkList.tsx:48-62 (sancionado e Done). `useOptimistic` rejeitado corretamente — exige `<form action={...}>`, ThemeSelector usa `<button onClick>` puro. Rollback explícito (setSelected(previous)) é fácil de testar — test it (4) "erro do server reverte seleção" valida. useTransition evita bloqueio do main thread.'
  - decision: 'DEV-5: Snapshot test do <ThemePreview> opcional (cascade já validado pelo PublicPage.test.tsx)'
    source: '@sm draft v0.1'
    validated_by: '@po gate v0.2'
    qa_verdict: ENDORSED
    qa_note: 'Não re-litigado. PublicPage.test.tsx da Story 3.2 já valida cascade `<div data-theme={theme}>` + classe `.dark` condicional verbatim (mesmo pattern). Snapshot per-theme do ThemePreview seria redundante (3 snapshots quase idênticos, apenas diferindo no atributo) e gera ruído em snapshot updates. Cobertura indireta via ThemeSelector test (3 cards renderizados, cada com <ThemePreview> interno). Se @qa quisesse cobertura programática adicional, `ThemePreview.test.tsx` com `it.each(THEMES)` × `toHaveAttribute("data-theme", theme)` é trivial — não exigido neste gate.'

top_issues:
  - id: 'TEST-001'
    severity: low
    finding: 'Smoke manual visual em `pnpm dev` (login → /dashboard/theme → ver 3 cards com previews distintos → clicar em "Dark" → ver loader → ver toast → reload persistido → abrir /@<username> em outra aba e ver tema aplicado) NÃO foi executado nesta sessão @qa. Story v0.3 declarou "deferido para gate @qa" mas o roteiro depende de execução interativa no browser. Programaticamente todos os AC1-4 estão cobertos (component test + integration test + build + contrast — 27/27 + 285/285 PASS).'
    suggested_action: 'Não bloqueia o PASS — cobertura programática é completa e robusta. Recomendação operacional: o user pode rodar o smoke manualmente após o gate, antes do push, ou deixar para validação pós-merge no ambiente Vercel preview. Nenhum risco identificado para o caminho dourado (sucess) nem para o caminho de erro (rollback testado).'
  - id: 'DOC-001'
    severity: low
    finding: 'Aviso pré-existente do Next 16.2.5: "The middleware file convention is deprecated. Please use proxy instead." aparece no build. middleware.ts intocado por esta story (File List "Não tocados" explícito) — herdado da Story 1.7 (middleware/proteção de rotas) + Next 16 framework deprecation.'
    suggested_action: 'Não-bloqueante. Tech debt para uma story dedicada (refactor middleware.ts → proxy.ts conforme nova convenção do Next 16) — pode ser registrada no backlog quando o time priorizar limpeza de warnings de framework. Não há impacto funcional imediato.'

