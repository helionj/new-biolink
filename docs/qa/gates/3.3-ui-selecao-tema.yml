ac_traceability:
  - ac: 'AC1: Página /dashboard/theme com 3 cards (preview thumbnail + nome do tema).'
    given: 'app/dashboard/theme/page.tsx (66 LOC) Server Component fetcha profile+page+top-3-links e passa para o <ThemeSelector>; THEMES (Story 3.1) é a single source dos 3 presets light/dark/brand; ThemeSelector renderiza grid de cards via THEMES.map.'
    when: 'Inspeção manual do source + render assertion no component test (3 radio elements + 3 LABELS visíveis).'
    then: 'PASS — app/dashboard/theme/page.tsx:44-65 renderiza <header> + <ThemeSelector>; components/theme/ThemeSelector.tsx:68-103 monta `<div role="radiogroup">` com `THEMES.map(theme => <button role="radio">)` produzindo exatamente 3 cards (light/dark/brand) cada qual com `<ThemePreview theme={theme}>` thumbnail + `<span>{LABELS[theme]}</span>` nome. LABELS em :13-17 ("Light"/"Dark"/"Brand"). Test it (1) renderiza 3 cards: passes; getAllByRole("radio") toHaveLength(3) confirma exatamente 3.'
    verdict: PASS
    coverage: 'tests/components/features/theme/ThemeSelector.test.tsx:63-69 ("renderiza 3 cards (light, dark, brand) com nomes visíveis (AC1)") + :120-123 ("container tem role=radiogroup com aria-label"). Build confirma rota criada (/dashboard/theme `ƒ` Dynamic).'
    notes: 'Thumbnail (~aspect-[3/4] container envolvendo ThemePreview) garante proporção consistente entre cards; rendered visual smoke deferido (ver TEST-001 abaixo) — programaticamente AC1 está plenamente coberto.'

  - ac: 'AC2: Card selecionado destacado; clique salva via Server Action.'
    given: 'ThemeSelector.tsx mantém estado local `selected` inicializado com `currentTheme` (prop); cada card aplica `border-primary` + `ring-2 ring-primary/30` quando `isSelected === true`, vs `border-border hover:border-muted-foreground` quando neutro; clique aciona handleSelect que chama updateTheme(server action) com optimistic state.'
    when: '@qa inspecionou ThemeSelector.tsx:80-86 (className condicional) + :45-60 (handleSelect → updateTheme). Component test simula click e verifica aria-checked + chamada do mock.'
    then: 'PASS — (i) Highlight visual: ThemeSelector.tsx:82-84 aplica `border-primary` + `ring-2 ring-primary/30` no card selecionado; outros recebem `border-border`. Token `--primary` resolve para violet-600 #7C3AED na surface light do dashboard (Story 3.2 paleta light:24). Test it (2) "card atual está aria-checked=true; outros aria-checked=false" passes — single-true invariant garantido por `isSelected = theme === selected`. (ii) Persistência: handleSelect:50-59 invoca `await updateTheme({ theme: next })` dentro de `startTransition`; em sucesso, `setSelected(next)` permanece e dispara toast.success; em falha, rollback explícito (setSelected(previous) + toast.error). Test it (3) "clique chama updateTheme + toast.success" + it (5) "clique no card já selecionado é no-op" cobrem o pattern. Integration test (c) confirma row DB persistida no projeto único `ibpliihqaceafdykgwiu`.'
    verdict: PASS
    coverage: 'tests/components/features/theme/ThemeSelector.test.tsx:78-90 (sucesso), :92-108 (rollback em erro), :110-118 (no-op no já-selecionado); tests/integration/server-actions/theme.test.ts:156-174 ((c) válido autenticado → updated_at tocado pelo trigger trg_pages_set_updated_at — confirma UPDATE real no DB).'
    notes: 'DEV-4 honrado: padrão verbatim LinkList.tsx:48-62 (Story 2.6 Done) — useState + useTransition + rollback explícito. `useOptimistic` rejeitado porque exige <form action={...}> e ThemeSelector usa onClick puro. Disabled em todos durante a transição impede cliques múltiplos (race condition). Loader2 com aria-label="Salvando" alimenta leitor de tela.'

  - ac: 'AC3: Preview mini da página pública renderizada inline com o tema escolhido (iframe ou Server Component isolado).'
    given: 'AC3 admite "iframe OU Server Component isolado". DEV-2 (gate @po v0.2 endossou) escolhe Server Component isolado: components/theme/ThemePreview.tsx (81 LOC) reproduz o wrapper de PublicPage.tsx verbatim. Cascade `<div data-theme={theme}>` aplica tema localmente sem necessidade de iframe.'
    when: '@qa comparou ThemePreview.tsx:38-44 contra PublicPage.tsx:36-42 (Story 3.2 wrapper). Estrutura: wrapper data-theme + classe .dark condicional → avatar 48×48 next/image (ou fallback User lucide com bg-muted) → display_name → bio (line-clamp-1) → ul de até 3 links com border-border bg-card text-card-foreground.'
    then: 'PASS — (i) Cascade reproduzido verbatim: wrapper L38-43 = `<div data-theme={theme} className={cn("flex h-full w-full flex-col items-center gap-2 rounded-md bg-background px-3 py-4 text-foreground", theme === "dark" && "dark")}>` — mesma estratégia provada na Story 3.2 (snapshots HTML-only validaram que `data-theme` + classe `.dark` é suficiente para cascade visual em dev real). (ii) Tokens consumidos são idênticos aos da PublicPage real: bg-background, text-foreground, bg-card, text-card-foreground, border-border, text-muted-foreground, bg-muted — facsimile fiel. (iii) `aria-hidden="true"` no wrapper L44 (DEV-1 a11y) evita o leitor de tela narrar 3× o conteúdo (uma vez por card). (iv) `next/image` com width=48 height=48 (sem `priority` porque é thumbnail não-LCP) evita CLS. (v) Sem rota dedicada, sem CSP/sandbox — overhead zero vs iframe.'
    verdict: PASS
    coverage: 'Inspeção manual do source contra PublicPage.tsx:36-42 + render assertion implícito nos 3 cards renderizados pelo ThemeSelector test (cada card contém um <ThemePreview theme={theme}>). DEV-5 (snapshot per-theme do ThemePreview) endossado como opcional pelo @po — cascade já validado pelo PublicPage.test.tsx da Story 3.2.'
    notes: 'DEV-2 honrado: Server Component preferido sobre iframe pelos 4 motivos documentados na story (cascade já provado em 3.2 / preview thumbnail não precisa de fidelidade total / iframe exige rota+CSP / facsimile usando os mesmos tokens é visualmente próximo). Alternativas rejeitadas (transform: scale + iframe com rota dedicada) corretamente NÃO executadas.'

  - ac: 'AC4: Toast de confirmação após save; revalidate /@<username> cache.'
    given: 'ThemeSelector handleSelect chama toast.success("Tema atualizado") em sucesso e toast.error(res.error) em falha — via @/lib/toast facade (Story 1.8 — feature code NÃO importa `sonner` direto). updateTheme Server Action chama revalidateUserSurface(profile?.username ?? null) que é o único caminho autorizado a invalidar cache (Coding Standards §revalidate — `revalidatePath` está apenas em lib/cache.ts).'
    when: '@qa inspecionou ThemeSelector.tsx:50-59 (toast paths) + server/page/actions.ts:80-86 (revalidateUserSurface após UPDATE). Tests cobrem ambos os caminhos.'
    then: 'PASS — (i) Toast sucesso: ThemeSelector.tsx:58 `toast.success("Tema atualizado")` PT-BR literal (Coding Standards i18n PT-BR-only no MVP). Test it (3) `expect(mockedToastSuccess).toHaveBeenCalledWith("Tema atualizado")` confirma. (ii) Toast erro: ThemeSelector.tsx:55 `toast.error(res.error)` propaga GENERIC_ERROR / SESSION_EXPIRED do Server Action. Test it (4) cobre rollback + toast.error. (iii) Revalidate: server/page/actions.ts:80-86 invoca `revalidateUserSurface(profile?.username ?? null)` após UPDATE bem-sucedido — passa por lib/cache.ts:21-29 que faz `revalidatePath("/dashboard", "layout")` + `revalidatePath(/@${username})` (Story 1.1+). AC4 "revalidate `/@<username>` cache" satisfeito. Integration test (c) confirma que após updateTheme a row no DB tem o novo theme — caminho completo (Zod → auth → DB UPDATE → revalidate) funciona end-to-end.'
    verdict: PASS
    coverage: 'tests/components/features/theme/ThemeSelector.test.tsx:78-90 (toast.success), :92-108 (toast.error em rollback); tests/integration/server-actions/theme.test.ts:156-174 ((c) UPDATE + (e) sequencing trocando todos os 3 temas). Mock `vi.mock("@/lib/cache", () => ({ revalidateUserSurface: vi.fn() }))` no integration test isola revalidatePath (no-op fora de request Next), mas o caminho server→cache→client é validado por inspeção + tests independentes do helper revalidateUserSurface (Story 1.x).'
    notes: 'AC4 literal "revalidate /@<username> cache" satisfeito pelo helper revalidateUserSurface — não convém duplicar revalidatePath no Server Action (Coding Standards proíbe). Caminho de erro silencioso: profile fetch falha → revalidateUserSurface(null) é no-op (lib/cache.ts:25-26) — mutation ainda persistiu, mas a página pública só re-renderiza no próximo visit (TTL natural). Aceitável: AC4 fala em "após save", e o save persiste mesmo sem o revalidate.'

