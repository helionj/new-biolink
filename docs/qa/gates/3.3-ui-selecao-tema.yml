status_reason: >-
  Todos os 4 ACs cumpridos no working tree auditado. Story end-to-end de aplicação
  (Server Action `updateTheme` + page Server Component + ThemeSelector client com
  optimistic UI + ThemePreview presentational) — zero DDL, RLS, migration ou novo
  índice (Constitution Art. IV — IDS REUSE de Story 2.2 `pages.theme` + RLS
  `pages_update_own`, Story 3.1 `lib/theme.ts`, Story 3.2 wrapper `data-theme`,
  Story 1.8 `@/lib/toast` facade, Story 2.6 padrão `useState`+`useTransition`).
  server/page/actions.ts:46-88 implementa updateTheme com Zod boundary, auth guard
  defense-in-depth, single-query UPDATE filtrado por profile_id (RLS isolation +
  defense in depth), error masking via GENERIC_ERROR e revalidateUserSurface como
  único caminho de cache (Coding Standards §revalidate). lib/validators/page.ts:10
  reusa THEMES de @/lib/theme — sem duplicar literal `['light','dark','brand']`
  (Art. IV verbatim). app/dashboard/theme/page.tsx:21-28 paraleliza profile+page
  via Promise.all e fetcha top-3 links visíveis para o preview. components/theme/
  ThemePreview.tsx:38-44 reproduz wrapper verbatim de PublicPage.tsx (`<div
  data-theme={theme}` + `.dark` condicional) com `aria-hidden="true"` e
  `next/image` width/height fixos (zero CLS). components/theme/ThemeSelector.tsx:
  45-60 implementa optimistic UI + rollback + `useTransition` verbatim
  precedente LinkList.tsx:48-62 (Story 2.6 PASS); a11y completa via
  `role="radiogroup"`/`aria-label`/`role="radio"`/`aria-checked`/disabled durante
  transição/`focus-visible:ring-2`. Decisões DEV-1..DEV-5 (PO gate v0.2 GO 10/10
  HIGH confidence) honradas verbatim — não re-litigadas. quality_gate_tools
  re-executados INDEPENDENTEMENTE pelo @qa: typecheck exit 0; lint exit 0; build
  Next 16.2.5 success com /dashboard/theme listada como `ƒ (Dynamic)` (RSC com
  auth.getUser não-prerenderable, igual /dashboard/profile); pnpm test 285/285
  PASS em 35/35 files (delta +11 testes em +2 arquivos vs baseline 3.2 274/274 em
  33 files, exatamente como projetado); pnpm check:contrast 27/27 PASS WCAG AA
  (sanity — paleta inalterada). Sem flake nesta sessão (vs 3.2 que sofreu fork
  pool macOS flake) — fileParallelism:false continuou suficiente. Aviso
  pré-existente "middleware file convention is deprecated" herdado de Next
  16.2.5 — fora do escopo (middleware.ts intocado per File List da story).
reviewer: 'Manual gate per QA-001 (CodeRabbit self-healing loop indisponível em macOS sem WSL/CodeRabbit CLI — docs/qa/known-issues.md). @qa Quinn auditou o working tree (criados: server/page/actions.ts, lib/validators/page.ts, app/dashboard/theme/page.tsx, components/theme/ThemePreview.tsx, components/theme/ThemeSelector.tsx, tests/components/features/theme/ThemeSelector.test.tsx, tests/integration/server-actions/theme.test.ts; modificados: docs/stories/3.3.ui-selecao-tema.story.md + docs/STORY-BACKLOG.md tocado para Story 3.2) + matriz de rastreabilidade AC↔teste Given-When-Then + re-execução INDEPENDENTE dos quality_gate_tools (pnpm typecheck exit 0; pnpm lint exit 0; pnpm build success com /dashboard/theme ƒ Dynamic e zero regressão de prerender; pnpm check:contrast 27/27 PASS WCAG AA; pnpm test 285/285 tests PASS em 35/35 files — full run sem flake). Decisões DEV-1..DEV-5 endossadas verbatim pelo @po em v0.2 (GO 10/10 HIGH) — não re-litigadas (convenção 2.3+). Sem PR/CI nesta fase — push + PR + CI são downstream de @devops (exclusivo @github-devops, agent-authority.md).'
