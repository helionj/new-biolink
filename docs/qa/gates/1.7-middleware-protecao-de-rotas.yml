  session_management_refresh: PASS       # pattern oficial: req.cookies.set + supabaseResponse rebuild + cookies.set no response (middleware.ts:59-64)
  redirect_cookie_propagation: PASS      # redirectWithCookies (middleware.ts:74-87) copia supabaseResponse.cookies.getAll() para redirect — sem ele browser perde sessão entre redirects
  service_role_isolation: PASS           # middleware usa createServerClient com anon key (env.NEXT_PUBLIC_SUPABASE_ANON_KEY); zero referência a admin client
  env_via_zod: PASS                      # env.NEXT_PUBLIC_SUPABASE_URL/_ANON_KEY de @/lib/env (NÃO process.env direto); arch §Coding Standards linha 2396 enforçado
