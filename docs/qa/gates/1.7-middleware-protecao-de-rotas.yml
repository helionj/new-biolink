status_reason: 'Refactor cirúrgico do middleware para o pattern canônico do arch §Routing Architecture (matcher amplo `/((?!_next/static|_next/image|favicon.ico|.*\.(?:svg|png|jpg|jpeg|gif|webp)$).*)` + bypass early-return explícito). Todos os 7 ACs cobertos por código + 15 cenários de integration test (PROTECTED 4, AUTH_PAGES 5, bypass 6) cobrindo 100% das branches do handler. Quality gate 6/6 verde (typecheck/lint/build/test:unit/test:components/test:integration). Padrão oficial @supabase/ssr (setAll dupla propagação + redirectWithCookies helper) e exact-match em AUTH_PAGES preservados de 1.6. Bypass de `/auth/callback` (decisão arquitetural Story 1.7 PSN #1) elimina race condition latente entre middleware setAll e exchangeCodeForSession do Route Handler.'
reviewer: 'Quinn'
updated: '2026-05-14T22:55:00Z'

