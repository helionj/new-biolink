code_review_findings:
  - id: 'CR-001'
    severity: info
    finding: 'Bypass `/auth/callback` é divergência consciente vs Story 1.6 (que incluía o path no matcher pra refresh proativo). Decisão arquitetural Story 1.7 PSN #1: Route Handler executa exchangeCodeForSession próprio que já refresca cookies; rodar middleware antes é redundante e em cenários adversariais (usuário com session antiga clicando no link de email em outra aba) cria race condition entre dois setAll. Trade-off aceitável.'
    location: 'middleware.ts:31-44'
    action_required: false
  - id: 'CR-002'
    severity: info
    finding: 'AUTH_PAGES usa `.includes(path)` (exact match) em vez de `.some(startsWith)` do snippet do arch §Routing linha 1213. Divergência consciente (Story 1.6 PSN #3, re-documentada aqui): `/reset-password/confirm` precisa session válida (oposto do "se logado → /dashboard" das auth pages); `startsWith` engoliria o confirm para `/dashboard` redirect. Pattern correto pós-1.6 — snippet arch é didático/pré-1.6.'
    location: 'middleware.ts:15-22, 93'
    action_required: false
  - id: 'CR-003'
    severity: info
    finding: 'Tests via import direto + mock de @supabase/ssr (não via Next.js Edge runtime). Trade-off: não cobrimos o glue real do matcher do `config` (em produção o regex filtra ANTES do handler; nos testes podemos chamar o handler com qualquer path, inclusive `/foo.svg`). Mitigação: matcher é validado em build-time (Next 16 valida regex malformado); função middleware é testada deterministicamente. Cobertura combinada adequada per arch §Testing Pyramid linha 2222 (sem E2E no MVP).'
    location: 'tests/integration/middleware.test.ts:5-21'
    action_required: false
  - id: 'CR-004'
    severity: info
    finding: 'Bypass de tests adicionalmente assertam `getUserMock.not.toHaveBeenCalled()` (não está no AC6 obrigatório). Valida a otimização de latência declarada em Task 1.2 — early-return acontece ANTES de instanciar createServerClient. Vai além do mínimo da AC, fortalece o teste contra regressão futura (ex.: alguém mover o bypass para depois do client setup).'
    location: 'tests/integration/middleware.test.ts:153,162,169,178,187,196'
    action_required: false

