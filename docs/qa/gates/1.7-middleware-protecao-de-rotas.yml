  AC5_refresh_transparente: PASS         # middleware.ts:50-67 (let supabaseResponse + setAll dupla propagação) + middleware.ts:73-87 (redirectWithCookies helper copia cookies em redirect). Não-testável em integration per AC; padrão preservado de 1.6.
