informational_notes:
  - id: 'INFO-001'
    severity: low
    finding: 'Build warning não-bloqueante "The middleware file convention is deprecated. Please use proxy instead." (Next 16). O arquivo `middleware.ts` continua funcionando; o output do build mostra "ƒ Proxy (Middleware)" indicando que Next 16 mapeia internamente. Migração `middleware.ts → proxy.ts` é deprecation notice apenas — não há ação requerida nesta story.'
    suggested_action: 'Criar story dedicada (ex.: 1.X.1 ou parte de housekeeping de uma futura epic) para renomear `middleware.ts → proxy.ts` quando o convention `proxy` estiver estável no Next 16+. Cross-ref Completion Notes #5 da Story 1.7.'
  - id: 'INFO-002'
    severity: low
    finding: 'Task 4 (smoke manual end-to-end) deixado intencionalmente unchecked — handoff para owner durante gate/merge review. Integration tests cobrem deterministicamente o invariante (AC2/3/4); smoke é confirmação adicional E2E manual. Consistente com pattern Stories 1.5/1.6.'
    suggested_action: 'Owner roda smoke manual cobrindo: (a) guest /dashboard → /login?next=/dashboard; (b) guest /login passthrough; (c) auth /login → /dashboard (idem signup/reset-password); (d) auth /@anything → 404 sem redirect (Story 2.7 pendente); (e) auth /auth/callback?code=invalid → /login?error=auth_callback_failed. Documentar no PR antes de merge.'
  - id: 'INFO-003'
    severity: low
    finding: 'Consumo do `next` query param em signIn (redirect pós-auth para `next` em vez de `/dashboard` hardcoded) NÃO está em escopo desta story — AC2 só requer que o middleware EMITA o `next=<path>`. Documentado em §Security Considerations e PSN #10 como handoff.'
    suggested_action: 'Quando a story futura implementar consumo de `next` em signIn Server Action, DEVE validar `next.startsWith("/") && !next.startsWith("//")` antes do redirect (pattern safeNext do /auth/callback Route Handler de 1.6) para prevenir open-redirect. Sem ação imediata nesta story.'
  - id: 'INFO-004'
    severity: low
    finding: 'CodeRabbit Integration desabilitada em core-config.yaml (igual 1.5/1.6) — validação automatizada de patterns/segurança não executada. Per memory QA-001, @qa *review trava em macOS (CodeRabbit/WSL incompatibility); gate manual aplicado conforme docs/qa/known-issues.md.'
    suggested_action: 'Quando CodeRabbit for habilitado em epic futuro, revisitar diffs de middleware/auth com scan automatizado. Sem ação imediata.'

