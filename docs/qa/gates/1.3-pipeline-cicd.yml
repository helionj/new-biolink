      delta 4× melhor). Pre-commit + pre-push hooks executam <5s cada (lint-staged
      em escopo restrito + typecheck incremental).
  security:
    status: PASS
    notes: |
      gitleaks ativo em 2 camadas (defense-in-depth): (1) local pre-commit hook com
      command -v guard + [extend] useDefault=true para herdar defaults oficiais;
      (2) CI canônico via gitleaks/gitleaks-action@v2 com fetch-depth:0 (full history).
      6 GitHub Actions secrets configurados via subshell + indireção bash (valores
      nunca apareceram em transcript). SUPABASE_SERVICE_ROLE_KEY isolado no job
