  performance:
    status: PASS
    notes: |
      Pipeline CI completa em ~21s no caminho crítico (build job, gargalo via
      needs:[lint,typecheck,test-unit,test-components]). Jobs paralelos rodam em
      10-20s cada (install 14s, lint 15s, typecheck 14s, test-unit 18s, test-
