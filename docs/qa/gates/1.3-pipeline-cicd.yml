  condition: |
    Push remoto já executado por @devops (PR #1 mergeado em commit 5c2c842 em main, CI 8/8 verdes sobre o próprio commit do CI per run 25708250239). Branch protection rule ativa. Story pode transicionar InReview → Done com gate decision CONCERNS — verdict aprovado com 2 observações documentadas (AC2 deferral + enforce_admins:false). Story 1.4 DEVE iniciar com resolução obrigatória de CI-001 antes de adicionar test-integration real.
