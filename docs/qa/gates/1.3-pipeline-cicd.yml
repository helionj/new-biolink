deviations_reviewed:
  - description: 'AC2 (test-integration) DEFERIDO para Story 1.4 — bloqueio SASL auth fail no pooler Supavisor após 4 bugs resolvidos'
    resolution: 'APPROVED — escopo da Story 1.3 é infra CI/CD; AC2 requer credenciais Supabase Branching que mudaram shape (CLI v2.98.2) e dependem de Direct Connection IPv4 (paid add-on) ou suffix .project_ref no user (não emitido pela API). Story 1.4 (primeiro DDL real + RLS) é o ponto natural de re-ativação porque introduz testes que precisam do branch isolado. CI-001 documenta 3 caminhos de resolução.'
    severity: 'medium'
  - description: 'Branch protection rule com enforce_admins:false (Plan B per Task 6.6.2)'
    resolution: 'APPROVED — owner solo no MVP precisa de bypass para hotfix emergencial e para resolver bootstrap problem (commit que adiciona ci.yml não tem CI verde sobre si mesmo). Revisitar quando 2º contributor entrar ou em story dedicada de hardening.'
    severity: 'low'
  - description: 'pnpm downgrade 11.x → 10.33.4 (vs Pre-Flight decision v0.3 de manter 11.x)'
    resolution: 'APPROVED — pnpm 11.x requer Node ≥22.13 (node:sqlite builtin) e CI usa Node 20 LTS (architecture §Tech Stack linha 191). Decisão Pre-Flight foi revisada com base em erro real de CI em commit e9873bc. packageManager field e ci.yml reconciliados; lockfile v9.0 compatível com ambas as versões.'
    severity: 'low'
  - description: 'Pre-commit usa `command -v gitleaks` em vez do `||` literal de Task 2.6'
    resolution: 'APPROVED — pattern `cmd || { echo ...; exit 0 }` faria bypass silencioso de leaks reais (mesmo exit code 1 para "não instalado" e "leak detectado"). `command -v` diferencia binário ausente (skip + warning) de detecção legítima (bloqueia commit). Deviation de segurança válida.'
    severity: 'low'
  - description: '.gitleaks.toml com `[extend] useDefault=true` (não previsto na Task 2.7 literal)'
    resolution: 'APPROVED — sem essa flag, gitleaks substitui defaults pelo conteúdo do toml e roda com zero rules (validado experimentalmente — nenhum leak detectado em teste). Com useDefault=true, allowlist do projeto estende as defaults oficiais. Correção crítica para AC6 funcionar.'
    severity: 'low'
  - description: 'AC1 textual lista 8 jobs incluindo test-integration; ci.yml final tem 8 jobs SEM test-integration'
    resolution: 'APPROVED — test-integration comentado (linhas ~86-153) com documentação completa dos 5 bloqueios. AC1 reconciliado em nota inline ("test-integration originalmente listado aqui — DEFERIDO para Story 1.4"). Pipeline ativa tem 8 jobs: install/lint/typecheck/test-unit/test-components/build/gitleaks/audit.'
    severity: 'low'
  - description: 'Job audit incluído (architecture §1946 recomenda; PRD AC não pede explicitamente)'
    resolution: 'APPROVED — política de waiver SF-2 documentada em Task 3.7 para CRITICAL sem fix upstream. Custo baixo, valor de segurança alto. Permanência aceita.'
    severity: 'low'
  - description: 'URL final Vercel é `new-biolink.vercel.app` (não `biolink-app.vercel.app` planejado em Pre-Flight)'
    resolution: 'APPROVED — todos os 10 lugares com referência antiga (ci.yml, story 1.3, architecture.md §Vercel env + §1933 + §2066, prd.md NFR18) reconciliados em commit incluído no PR #1. Single source of truth preservada.'
    severity: 'low'
  - description: '`.gitleaks.toml` em vez de `.gitleaksignore` (architecture §1632 menciona o legacy)'
    resolution: 'APPROVED — `.gitleaks.toml` é o formato moderno (gitleaks v8+) com config + allowlist mais expressiva. Funcionalmente equivalente. Documentado em Project Structure Notes.'
    severity: 'low'

handoff:
  next_agent: '@po'
