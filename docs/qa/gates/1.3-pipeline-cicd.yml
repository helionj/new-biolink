waiver:
  active: false

quality_checks:
  code_review:
    status: PASS
    notes: |
      Implementação literal de architecture.md §1809-1961 para ci.yml (8 jobs ativos:
      install/lint/typecheck/test-unit/test-components/build/gitleaks/audit). Husky 9.x
      configurado com .husky/_ entrypoints (padrão atual). lint-staged config em
      package.json com globs corretos (.ts/.tsx/.js/.jsx + .json/.md/.yml/.yaml/.css).
      .gitleaks.toml com [extend] useDefault=true — sem isso defaults seriam substituídas
      (deviation corretiva validada experimentalmente). pre-commit usa `command -v
      gitleaks` em vez do `||` literal — deviation de segurança aprovada (evita bypass
      silencioso de leaks reais). vitest.config.ts usa `projects` array (Vitest 4.x
      moderno), substituto do legacy vitest.workspace.ts.
  unit_tests:
    status: N/A
    notes: |
      Scaffold-only por design (Task 1.7). Os 3 projects (unit/components/integration)
      configurados com passWithNoTests:true permitem CI jobs sucederem antes dos
      primeiros testes reais. Validação: `pnpm test:unit/components/integration` 3×
      exit 0 com mensagem "No test files found, exiting with code 0" (vitest 4.1.5).
      Primeiros testes reais: RLS em Story 1.4, componentes em Story 1.8.
  acceptance_criteria:
    status: CONCERNS
    notes: |
      AC1 (8 jobs paralelos): PASS — install/lint/typecheck/test-unit/test-components/
      build/gitleaks/audit todos verdes em ci.yml + validados em main run 25708250239.
      AC2 (test-integration Supabase Branching): **DEFERIDO** para Story 1.4 — cadeia
      de 5 bloqueios (4 resolvidos: pnpm/Node 22 compat, --experimental flag,
      POSTGRES_URL uppercase keys, IPv6→pooler IPv4; 1 bloqueado: SASL auth fail).
      Documentado em known-issues.md CI-001 com 3 caminhos de resolução.
      AC3 (branch protection): PASS — rule criada via gh api -X PUT com 8 required
      status checks + strict:true + allow_force_pushes:false + allow_deletions:false.
      enforce_admins:false (Plan B intencional, ver top_issues).
      AC4 (Vercel auto-deploy <5min): PASS — smoke deploy mediu 69s (1m9s) em
      2026-05-12T01:47:10Z → 2026-05-12T01:48:19Z. Região gru1.
      AC5 (PR previews): PASS — preview Vercel `new-biolink-git-feat-story-13-cicd-
      helionj-projects.vercel.app` HTTP 200 + bot comment com link clicável.
      AC6 (Husky + lint-staged + gitleaks): PASS — validado em 6 pre-commit hooks
      do PR #1 (lint-staged + prettier + gitleaks "no leaks found") + 6 pre-push hooks
      (typecheck exit 0). Fake GitHub PAT bloqueado em teste local (HOOK_EXIT=1).
      AC7 (README documenta): PASS — README.md ampliado com 6 scripts test:* + seção
      "Como contribuir" (4 passos); docs/dev-setup.md §9 (6 GHA secrets), §10 (5
      Vercel env vars por escopo), §11 (Husky/lint-staged/gitleaks install macOS/Linux).
  regressions:
    status: PASS
    notes: |
      Stories 1.1 e 1.2 mantidas verdes: typecheck/lint/build em main run 25708250239
      sobre commit 5c2c842 PASS (estado final após merge). Landing page boilerplate
