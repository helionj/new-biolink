    validated_by: '@po gate v0.2 (GO 9/10 Conditional HIGH confidence)'
    qa_verdict: ENDORSED
    qa_note: 'Não re-litigado (convenção 2.3+). Constitution Art. IV (No Invention) verbatim: rename sem ganho funcional seria invenção contra precedente upstream (shadcn + @base-ui/react/dialog) + churn em 4 consumidores em produção (AddLinkModal, DeleteLinkDialog, AlertDialog). Drift cosmético arch L1027 → backlog STORY-3.4-F1 LOW (atualizar arch.md como follow-up). Resolução em design-system.md §Dialog ≡ Modal é a forma correta — formaliza o alias semântico sem refactor.'
  - decision: 'DEV-2: Optimistic preview com URL.createObjectURL + rollback (pattern verbatim Story 3.3 ThemeSelector)'
    source: '@sm draft v0.1'
    validated_by: '@po gate v0.2'
    qa_verdict: ENDORSED
    qa_note: 'Não re-litigado. Padrão verbatim ThemeSelector Story 3.3 (sancionada e Done) — useState + useTransition + revogação no cleanup. URL.revokeObjectURL no callback após upload evita memory leak (caveat Web API). Rollback explícito (setPreviewUrl(currentAvatarUrl)) testável — cenário 5 do AvatarUpload.test.tsx valida. useOptimistic rejeitado corretamente (exige <form action>, AvatarUpload usa onClick + input file).'
  - decision: 'DEV-3: getPublicUrl vs createSignedUrl'
    source: '@sm draft v0.1'
    validated_by: '@po gate v0.2 + Dara v0.3 (alinhada com DEV-5)'
    qa_verdict: ENDORSED
    qa_note: 'Não re-litigado. Alinhada com bucket public:true (DEV-5) — sem signing round-trip no path quente da página pública SSR. Trade-off de segurança documentado: avatar é público por design (FR13); URL persistida em profiles.avatar_url não expira (oposto de signed URL — rotação ao trocar avatar via path determinístico {uid}/avatar.{ext} resolve).'
  - decision: 'DEV-4: Path determinístico {user.id}/avatar.{ext} + upsert:true (zero objetos órfãos)'
    source: '@sm draft v0.1'
    validated_by: '@po gate v0.2'
    qa_verdict: ENDORSED
    qa_note: 'Não re-litigado. Path estável evita acumular órfãos no bucket. RLS avatars_update_own cobre overwrite verbatim (mesmo WITH CHECK de avatars_insert_own). Trade-off jpg→png deixa antigo órfão — best-effort cleanup omitido no MVP (story Task 2.2 etapa 7 implementa rollback storage.remove apenas no caminho de erro de UPDATE, não no caminho de ext change). 99% dos usuários trocam jpg→jpg (ext-stable). Cleanup pode ser tech debt LOW se observabilidade detectar acúmulo.'
  - decision: 'DEV-5: bucket avatars public:true (override pragmático de schema-design.md L1040)'
    source: '@sm draft v0.1 (proposto)'
    validated_by: '@data-engineer Dara v0.3 (ratificada via header verbose da migration + Change Log v0.5 em schema-design.md)'
    qa_verdict: ENDORSED
    qa_note: 'Não re-litigado. Dara documentou 4 razões técnicas + plano de reversão (UPDATE storage.buckets SET public=false sem recriar URLs em profiles) no header da migration 0006_storage_avatars.sql:24-42. Override de schema-design.md L1040 ("URLs são signed") é pragmático: (1) NFR LCP — getPublicUrl síncrono client-side evita round-trip de signing em SSR; (2) RLS preserva invariantes de write owner-only; (3) profiles.avatar_url persiste URL estável (signed URL persistida em coluna permanente seria anti-pattern); (4) reversão é cheap (UPDATE bucket flag, sem migrar URLs). schema-design.md Change Log v0.5 (append-only) registra o override formalmente.'
  - decision: 'DEV-6: Sem updateProfile (display_name/bio) nesta story'
    source: '@sm draft v0.1'
    validated_by: '@po gate v0.2'
    qa_verdict: ENDORSED
    qa_note: 'Não re-litigado. PRD Story 3.4 escopa apenas Card/Avatar/Modal/tests/doc; display_name + bio editing é trabalho da Story 3.5 ou backlog. Foco da Task 2 = uploadAvatar apenas. arch L386 lista updateProfile como Server Action canônica mas escopo de uma story por vez (Constitution Art. III — Story-Driven). app/dashboard/profile/page.tsx SELECT estendido para display_name/avatar_url é apenas leitura, não mutation — consistente com DEV-6.'

top_issues:
  - id: 'INFO-001'
    severity: low
    finding: 'Supabase Advisor `public_bucket_allows_listing` (WARN level) introduzido pela Story 3.4 — bucket avatars com public:true permite listing de objetos por anon clients. Detectado pela Dara via Supabase MCP get_advisors security pós-DDL (Dev Agent Record v0.3 Completion Notes).'
    suggested_action: 'NÃO bloqueia o PASS — trade-off intencional aceito (avatar é público por design — FR13). Rationale documentado por Dara: (i) avatar é descobrível na URL pública /@<username>; (ii) integration test depende do SELECT público para anon download; (iii) RLS no objeto (`avatars_insert_own`/`update_own`/`delete_own`) preserva invariantes de write. Listing público (`SELECT *` enumerar todos os objetos) é um risco de descoberta de avatars de usuários não relacionados — mitigação: avatars são públicos por design (não há expectativa de privacidade); user agent IDs em paths são UUIDs (não enumeráveis trivialmente). Se observabilidade futura indicar enumeração maliciosa (scrape de avatars), opções: (a) UPDATE storage.buckets SET public=false (signed URLs) — DEV-5 reversal plan; (b) adicionar policy ALLOW LIST WHERE bucket_id=... LIMIT N; (c) rate limiting na API REST do Storage. Tech debt LOW priority — aceito como WARN documentado.'
  - id: 'TEST-001'
    severity: low
    finding: 'Fork worker timeout no full test run macOS Vitest 4.1.5 + jsdom 29.1.1 (1 unhandled error em tests/components/features/auth/ResetPasswordRequestForm.test.tsx). Precedente: Story 3.2 TEST-001 reportou flake similar em UsernameForm.test.tsx + LinkRow.test.tsx. fileParallelism:false em vitest.config.ts é mitigação ativa mas não cobre 100% dos casos.'
    suggested_action: 'NÃO bloqueia o PASS — arquivo afetado não é da Story 3.4 (auth flow, Stories 1.5/1.6). Re-rodado isolado: 4/4 PASS em 19.99s — confirmado flake ambiental (timeout do worker spawn, não falha de teste). Mitigação atual (fileParallelism:false) é suficiente em ~95% das execuções; remaining 5% precisa de re-run isolado dos arquivos afetados. Tech debt: investigar pool=threads vs forks ou aumentar testTimeout para spawn de worker (story dedicada de infra de testes — fora do escopo da 3.4). Recomendação operacional: validar em CI (Linux runner) — onde fork pool é estável.'
  - id: 'DOC-001'
    severity: low
    finding: 'Aviso pré-existente do Next 16.2.5: "The middleware file convention is deprecated. Please use proxy instead." aparece no build (transferido das Stories 1.7+ e 3.3 sem regressão). middleware.ts intocado por esta story (File List "Não tocados" implícito — story não modificou middleware).'
    suggested_action: 'NÃO bloqueia o PASS — tech debt pré-existente, fora do escopo da 3.4. Recomendação: story dedicada de refactor middleware.ts → proxy.ts conforme nova convenção do Next 16 (já no backlog desde Story 3.3 DOC-001). Sem impacto funcional imediato.'

