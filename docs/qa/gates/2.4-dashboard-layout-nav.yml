top_issues:
  - id: 'A11Y-001'
    severity: low
    category: 'accessibility'
    finding: >-
      Sidebar e MobileDrawer expõem ambos um <nav aria-label="Navegação
      principal">. Quando dois landmarks de mesmo tipo coexistem na árvore de
      acessibilidade, a recomendação WCAG/ARIA é rótulos distintos para
      desambiguação por leitor de tela.
    suggested_action: >-
      Não-bloqueante — na prática raramente coexistem visíveis: Sidebar é
      `hidden md:flex` (display:none → fora da árvore a11y no mobile) e o
      MobileDrawer (Base UI Dialog) só monta o conteúdo on-open e tem trigger
      `md:hidden` (desktop não renderiza). Polish sugerido (futuro/2.x): rótulos
      distintos, ex. Sidebar "Navegação principal" / MobileDrawer "Navegação
      (menu)". Consulta opcional a @ux-design-expert para revisão a11y WCAG 2.1
      AA permanece recomendada (a própria story DEV-1 já a sinaliza como
      não-bloqueante).

waiver: { active: false }

quality_checks:
  code_review:
    status: PASS
    notes: |
      nav-items.ts: fonte única tipada (NavItem{label,href,icon:LucideIcon}),
      5 itens com labels AC2 verbatim (Links/Profile/Theme/Analytics/Account)
      e hrefs canônicos (arch §Routing). isActive() correto: match EXATO para
      '/dashboard' (não acende "Links" em sub-rotas) + prefixo com guard '/'
      (`startsWith(`${href}/`)` evita falso-positivo /dashboard/profile-x).
      Sidebar.tsx: 'use client' justificado (usePathname/AC3); <aside hidden
      md:flex> + <nav aria-label> semântico; aria-current="page" no ativo;
      tokens --sidebar* (bg-sidebar-accent/text-sidebar-foreground/
      focus-visible:ring-sidebar-ring — não remove outline); next/link → <a>
      nativo (Tab/Enter AC5); ícones aria-hidden. MobileDrawer.tsx: shadcn
      Sheet (Base UI Dialog) controlado (open/onOpenChange); SheetTitle
      sr-only nomeia o dialog (a11y); trigger Button via render-prop com
      aria-label + md:hidden + ícone Menu aria-hidden; reusa nav-items
      (sem duplicar lista); fecha ao navegar (onClick setOpen(false)).
      UserMenu.tsx: getInitials robusto (vazio→'?', 1 token→2 chars, multi→
      iniciais; non-null asserts guardados pelos length-checks); handleCopyUrl
      try/catch (clipboard pode rejeitar) → toast.success/error; handleSignOut
      reusa pattern LogoutButton (useTransition + signOut + toast.error se
      !res.ok); trigger aria-label descritivo + focus-visible:ring;
      AvatarImage alt="" decorativo (botão já rotulado). layout.tsx: guard RSC
      preservado + fetch profiles(username,display_name,avatar_url) (mesmo
      pattern profile/page.tsx, RLS select_own); env só no RSC, siteUrl por
      prop ao Client (coding standard); landmarks header/main/nav/aside;
      <main> único. Sem import de lib/supabase/admin (ESLint restricted +
      lint exit 0). Código limpo, legível, manutenível. 0 CRITICAL/HIGH.
  unit_tests:
    status: PASS
    notes: |
      Sem unit puro novo (única lógica pura — isActive() — é coberta
      comportamentalmente pelos testes do Sidebar: aria-current em
      /dashboard vs /dashboard/profile). Padrão idêntico às stories de UI
      Done 1.5/1.8/1.9 (componentes testados via project Vitest
      `components`, não `unit`). project `unit` segue passWithNoTests:true.
      12 testes novos de componente cobrem AC1-AC5 (ver acceptance_criteria).
  acceptance_criteria:
    status: PASS
    notes: |
      AC1 (layout app/dashboard/layout.tsx com sidebar fixa desktop ou drawer
      mobile): PASS — Sidebar `hidden md:flex md:w-60` (fixa desktop);
      MobileDrawer Sheet com trigger `md:hidden`; layout.tsx compõe flex
      Sidebar + coluna(header+main). Teste MobileDrawer "trigger abre o
      drawer".
      AC2 (itens: Links, Profile, Theme, Analytics, Account): PASS —
      nav-items.ts labels verbatim; Sidebar.test "renderiza os 5 itens com
      hrefs canônicos"; MobileDrawer.test "5 itens de navegação".
      AC3 (rota ativa destacada visualmente): PASS — isActive() +
      aria-current="page" + classes token de destaque; Sidebar.test "marca
      o item da rota ativa com aria-current" e "na raiz /dashboard apenas
      Links fica ativo" (valida match exato — sub-rota não acende Links).
      AC4 (header com avatar + dropdown logout/copy public URL): PASS —
      UserMenu Avatar+DropdownMenu; UserMenu.test iniciais (displayName
      "Maria Silva"→MS; username fallback "joao-silva"→JO), "Copiar URL
      pública" → clipboard.writeText(`${siteUrl}/@${username}`) +
      toast.success, "Sair" → signOut. layout monta UserMenu no header.
      AC5 (a11y: navegação por teclado completa, ARIA roles, focus trap no
      drawer mobile): PASS — links nativos <a> (Tab/Enter); nav landmarks
      nomeados; aria-current; Base UI Dialog entrega focus trap + ESC-to-
      close + role="dialog" NATIVOS (sem implementação manual). MobileDrawer.
      test valida role="dialog", "ESC fecha o drawer", "navegar fecha";
      Sidebar.test valida landmark nomeado. Observação A11Y-001 (rótulo nav
      duplicado) é low não-bloqueante.
  no_regressions:
    status: PASS
    notes: |
      pnpm test 170/170 em 22 arquivos, re-rodado INDEPENDENTEMENTE pelo @qa
      (196s). +12 testes vs feat/2.3 (158) = exatamente as 3 suites novas
      dashboard; zero regressão em tests/components/** (auth/landing/ui/
      profile) e tests/integration/** (middleware/profiles/pages/links/
      server-actions). app/dashboard/page.tsx (header inline + banner
      removidos — migraram p/ shell, DEV-5) e profile/page.tsx (<main>→<div>
      p/ single-<main> AC5) validados via suíte completa (UsernameForm.test
      continua verde — testa o form, não o wrapper). tests/setup.ts: polyfills
      jsdom GUARDADOS (if !...) → suites pré-existentes inalteradas.
  performance:
    status: PASS
    notes: |
      layout.tsx RSC: 1 query profiles por render (.eq('id',user.id).single()
      — id é PK, lookup O(1) indexado; mesmo pattern já em produção em
      profile/page.tsx). Client Components mínimos e justificados (Sidebar/
      MobileDrawer = usePathname; UserMenu = interatividade/clipboard/
      transition). Sem novas dependências (package.json/pnpm-lock intactos —
      shadcn add reusou @base-ui/react já instalado). Sem N+1, sem fetch em
      Client. Build compila em ~71s, bundle dashboard normal. MobileDrawer
      Sheet monta conteúdo só on-open (lazy). Sem regressão de performance.
  security:
    status: PASS
    notes: |
      OWASP basics: (1) sem secrets/credenciais no código; (2) sem import de
      lib/supabase/admin em components/ (service-role isolado — ESLint
      no-restricted-imports + runtime guard; lint exit 0); (3) Env via Zod —
      Client Components NÃO importam lib/env; siteUrl chega por prop do RSC
      (coding standard cumprido); (4) clipboard text `${siteUrl}/@${username}`
      não-injetável: siteUrl de env validado (z.string().url()), username
      DB-side validado pelo regex de signup (^[a-z0-9-]{3,30}$, Stories
      2.1/2.2); (5) AvatarImage src=avatarUrl alt="" — decorativo, sem XSS
      (React escapa atributos; é <img src>, não dangerouslySetInnerHTML);
      (6) links de nav são internos next/link (sem target=_blank/sem
      noopener-concern aqui); (7) layout lê profiles sob RLS select_own
      existente (sem nova superfície DB; logout reusa signOut já testado em
      integration). Sem novo Server Action/endpoint. gitleaks roda no push
      @devops (downstream).
  documentation:
    status: PASS
    notes: |
      Dev Agent Record completo: Agent Model, Debug Log (3 entradas — shadcn
      prompt-hang, clipboard-mock-vs-userEvent, lint import/order nos
      primitives gerados), Completion Notes (AC1-5, DEV-1..6 aplicados,
      desvio profile/page.tsx rastreável a AC5, polyfills setup.ts, gate),
      File List (criados/modificados + nota dos artefatos NÃO-2.4). Story
      Dev Notes self-contained citando fontes reais (Constitution Art. IV).
      Tasks/Subtasks 100% [x]. Comentários inline curtos e úteis (use client
      justificado, isActive rationale, polyfills guardados). Change Log v0.1
      (sm) + v0.2 (po GO) + v0.3 (dev). Sem docs externos a atualizar (story
      de implementação frontend, sem mudança de schema/API).

