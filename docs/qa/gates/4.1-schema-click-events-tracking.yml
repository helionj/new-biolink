  acceptance_criteria:
    - id: AC1
      verdict: PASS
      evidence: |
        Migration `supabase/migrations/0007_click_events.sql` cria tabela com
        colunas (id bigint identity PK, link_id uuid FK ON DELETE CASCADE,
        clicked_at timestamptz default now(), user_agent_hash bytea, ip_hash bytea)
        + check_constraint chk_click_events_hash_size (octet_length=32). Verificado
        no projeto remoto ibpliihqaceafdykgwiu via SQL: rls_enabled=true,
        index_count=2, current_row_count=0.

    - id: AC2
      verdict: PASS
      evidence: |
        `app/api/track/click/route.ts` (POST handler, runtime:nodejs,
        force-dynamic) resolve link via `createAdmin()` (service-role) com
        `pages!inner(is_published)`. Retorna 404 se `link === null` ou
        `is_published === false`. Validado por integration tests cenários
        (b), (c) em `tests/integration/api/track-click.test.ts`.

    - id: AC3
      verdict: PASS
      evidence: |
        `lib/hash.ts` exporta `hashPII()` + `hashPIINullable()` usando Web Crypto
        sha-256 com `env.HASH_SALT` (REUSE de Story 1.x; validado por `lib/env.ts:11-13`
        com z.string().min(32)). DEV-4 resolvido em runtime via formato bytea-text
        `\x<hex>` — smoke confirmou `octet_length(ip_hash)=32, octet_length(user_agent_hash)=32`.
        9 unit tests cobrem determinismo, 32 bytes, salt dependence, null/empty handling.

    - id: AC4
      verdict: PASS
      evidence: |
        RLS habilitada + apenas 1 policy SELECT (`click_events_select_own`) com
        predicado JOIN 2-hop link→page→profile. Zero policies INSERT/UPDATE/DELETE
        — defesa canônica Supabase via ausência-de-policy + service-role bypass
        (DEV-2). Validado por 10 cenários em `tests/integration/rls/click-events.test.ts`:
        owner/non-owner/anon × SELECT + INSERT/UPDATE/DELETE bloqueados + CASCADE
        + check constraint. Confirmado no remoto via SQL: policy_count=1, policies=[click_events_select_own:r].

    - id: AC5
      verdict: PASS
      evidence: |
        `lib/rate-limit.ts` implementa fixed-window in-memory (Map<key, {count,
        windowStart}>) com cleanup piggybacked (cada 100 calls). Route handler
        usa `ip_hash hex` como chave (defesa anti-PII em memória) com max=60,
        windowMs=60_000. Bypass quando ip ausente (defensivo). DEV-5 limitação
        serverless documentada em JSDoc. 8 unit tests cobrem first/last/over-limit,
        window reset, key isolation. Integration test cenário (e) valida 429 +
        `Retry-After` header após 61 POSTs.

    - id: AC6
      verdict: PASS
      evidence: |
        `components/public/TrackedLinkCard.tsx` (Client Component) wrappa
        `PublicLinkCard.tsx` (Server Component preservado) com handlers
        `onClickCapture`/`onAuxClickCapture` que disparam `navigator.sendBeacon`
        (primário) ou `fetch({ keepalive: true })` (fallback). NÃO bloqueia
        navegação (sem `preventDefault`). DEV-6 ratificado pelo PO em v0.2 do
        Change Log — "beforeunload" literal era inalcançável com `target="_blank"`;
        sendBeacon é o primitivo canônico de indústria. 4 component tests cobrem
        render + sendBeacon dispatch + fetch fallback + onAuxClick.
        `components/public/PublicPage.tsx` substitui o import.

