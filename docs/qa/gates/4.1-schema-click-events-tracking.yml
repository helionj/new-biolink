story: '4.1'
gate: PASS
status_reason: 'Implementação completa dos 6 ACs (migration 0007 + RLS + /api/track/click + libs hash/rate-limit + glue client). 367/367 testes verdes (263 unit+components + 104 integration); schema remoto sincronizado com 1 policy SELECT e zero policies INSERT/UPDATE/DELETE (AC4 honrado via ausência-de-policy + service-role bypass). 2 observações low não-bloqueantes (lint performance herdado + bundle re-measure deferido).'
reviewer: 'Quinn'
updated: '2026-05-26T14:22:57Z'

top_issues:
  - id: 'PERF-001'
    severity: low
    finding: |
      Lint `auth_rls_initplan` introduzido pela policy `click_events_select_own` —
      `auth.uid()` é chamado direto no predicado (subquery 2-hop link→page→profile)
      em vez de `(select auth.uid())`, causando re-evaluation por linha em scans amplos.
      Padrão idêntico às 7 policies herdadas de 0002/0003/0004 (`profiles_update_own`,
      `pages_select_own/update_own`, `links_select_own/insert_own/update_own/delete_own`)
      — não é regressão de 4.1, é coerência arquitetural. Mitigação por índice composto
      `idx_click_events_link_id_clicked_at` (incluído na 0007) reduz custo prático.
    suggested_action: |
      Agendar batch fix de auth_rls_initplan para todas as 8 policies em sprint dedicado
      (substituir `auth.uid()` por `(select auth.uid())` em uma migration 0008+ companheira).
      Não bloqueante para 4.1; tracking via STORY-BACKLOG.md como LOW.

  - id: 'TEST-001'
    severity: low
    finding: |
      Re-medição programática de bundle First Load JS de `/[username]` (Task 7.5) ficou
      bloqueada por drift do Turbopack — `.next/build-manifest.json` lista 0 files para a
      rota (drift conhecido vs Story 3.5 que mediu 198.04 KB gz via mesmo método).
      Continuação do `[STORY-3.5-F1]` (LOW — monitorar margem <200 KB gz).
    suggested_action: |
      Gate efetivo já está em CI: workflow `.github/workflows/lighthouse.yml` (Story 3.5)
      roda Lighthouse minScore 0.85 em 4 categorias quando PR toca `app/**` ou `components/**`
      — qualquer regressão de bundle/performance será capturada no PR. Resolver o drift do
      build-manifest é tarefa de tooling (não-bloqueante).

waiver: { active: false }

