ac_traceability:
  - ac: 'AC1: Paletas definidas para os 3 temas (cores primária, secundária, fundo, texto, accent).'
    given: 'Working tree app/globals.css com 3 blocos [data-theme="..."] preenchidos com 27 tokens cada (light slate+brand; dark zinc+brand-light; brand violet-dominant) + @media fallback sincronizado com bloco dark.'
    when: 'Inspeção manual do source (app/globals.css L19-156, fallback L212-248) confronta com decisões inline e PRD §UX/Branding L127.'
    then: 'PASS — light L19-59 (slate-* neutros + #7c3aed primary); dark L70-109 (zinc-* neutros + #a78bfa primary derivado); brand L118-156 (violet-* dominant + #7c3aed primary). Todos os hex são de Tailwind 4 default (slate-*/zinc-*/violet-*/red-*) ou do PRD seed — Constitution Art. IV preservado verbatim. Header comment-block L6-17 documenta a tabela de uso por preset.'
    verdict: PASS
    coverage: 'Inspeção manual + scripts/check-contrast.mjs L31-92 (PALETTES literal espelhando globals.css) + showcase /dev/themes L72-126 (renderização visual das 3 paletas). Sentinela cross-source: 3 fontes da mesma paleta (CSS + script + showcase render) — qualquer drift detectável manualmente.'
    notes: 'Tokens chart-* mantidos da escala slate da 3.1 em todos os presets (Epic 4 reavalia quando houver consumidor real — IDS REUSE de baseline 3.1).'

  - ac: 'AC2: Tema selecionado aplicado consistentemente: dashboard + página pública + componentes interativos.'
    given: 'Interpretação semântica endossada pelo @po em validation (gate v0.2 / DEV-1): dashboard mantém light default nesta story; aplicação user-specific fica para 3.3 (não há profiles.theme; introduzir DDL violaria Art. IV sem doc-fonte). Página pública aplica page.theme via wrapper Server Component; primitives shadcn consomem tokens via @theme inline (cross-surface automático).'
    when: 'components/public/PublicPage.tsx L36-42 envolve <main> em <div data-theme={page.theme} className={cn("min-h-screen bg-background text-foreground", page.theme==="dark" && "dark")}> — wrapper aninhado vence cascade por proximidade. Build success (rota /[username] ƒ Dynamic) confirma SSR funcional; snapshots HTML capturam wrapper top-level corretamente.'
    then: 'PASS — (i) página pública aplica data.page.theme (3 valores possíveis) via wrapper; (ii) classe .dark condicional alimenta @custom-variant dark (&:is(.dark *)) em globals.css L4 — defesa em profundidade para primitives shadcn (verificado: grep "dark:" components/public/PublicLinkCard.tsx zero matches — primitive usa apenas utilities token-based bg-card/text-card-foreground/border-border); (iii) dashboard herda light do <html data-theme={DEFAULT_THEME}> (app/layout.tsx — Story 3.1 Task 3); (iv) componentes interativos shadcn (PublicLinkCard L55-78 do snapshot) renderizam idênticos nos 3 snapshots — apenas wrapper top-level diverge.'
    verdict: PASS
    coverage: 'tests/components/features/public/PublicPage.test.tsx L47-62 (it.each(THEMES) com 3 snapshots + assertions: data-theme correto + .dark class condicional). Snapshot diff entre os 3 temas é EXCLUSIVAMENTE no atributo data-theme do wrapper e na classe .dark (theme==="dark") — confirma DEV-4 (mesmo DOM, theme via cascade de CSS vars). PublicLinkCard interior idêntico nos 3 snapshots (linhas 53-87 do brand snap, 144-178 do dark, 235-269 do light).'
    notes: 'DEV-1 honrado verbatim: dashboard NÃO toca user theme (escopo Story 3.3 com UI de seleção + Server Action updateTheme). Interpretação de "consistentemente" como vocabulário de tokens cross-theme uniforme — endossado @po em validation. Alternativa rejeitada (introduzir profiles.theme nesta story) corretamente NÃO executada — antecipava complexidade sem ganho de UX.'

  - ac: 'AC3: Tema "brand" usa a brand color seed (#7C3AED ou definido por @ux-design-expert).'
    given: 'PRD §UX/Branding L127 fixou #7C3AED como seed; @ux-design-expert opcional per AC3 — não convocado nesta sprint (DEV-2 endossado @po em validation).'
    when: 'Inspeção manual: globals.css L121 (--primary: #7c3aed no [data-theme="brand"]) + L24 (light) + L155 (sidebar brand) + scripts/check-contrast.mjs L37,75 (PALETTES.brand.primary === "#7c3aed" e PALETTES.light.primary === "#7c3aed").'
    then: 'PASS — #7c3aed (violet-600 Tailwind default) presente como --primary em LIGHT e BRAND presets; em DARK aparece como #a78bfa (violet-400 derivado algoritmicamente para garantir contraste contra zinc-950 — DEV documentou no story L57). --primary-foreground = #ffffff em LIGHT/BRAND (par 5.70:1 ≥ 4.5 WCAG AA confirmado). Sidebar tokens (--sidebar-primary, --sidebar-ring) também usam #7c3aed em LIGHT/BRAND (consistência cross-surface).'
    verdict: PASS
    coverage: 'Inspeção manual da paleta + check:contrast 27/27 PASS (light/brand primary↔primary-foreground 5.70:1 ≥ 4.5; dark primary↔primary-foreground 5.87:1 com violet-400 derivado). Constitutional Art. IV satisfeito: #7c3aed do PRD L127, demais hex de Tailwind 4 violet-* default — zero hex inventado.'
    notes: 'DEV-2 honrado: brand color adotado do PRD seed sem convocar @ux-design-expert. Alternativa rejeitada (paleta brand definitiva via @ux-design-expert) corretamente NÃO executada — endossado @po; abrir story dedicada se identidade visual completa for priorizada no futuro (não-bloqueante para MVP per docs/architecture.md "Open Questions").'

  - ac: 'AC4: Verificação WCAG AA de contraste em cada tema (script de check em CI ou manual).'
    given: 'scripts/check-contrast.mjs (Node ESM, zero dep externa) implementa algoritmo W3C WCAG 2.1 (relative luminance + sRGB-linear + contrast ratio (L1+0.05)/(L2+0.05)). 9 pares × 3 temas = 27 checks. Threshold 4.5:1 para texto normal; 3.0:1 para background↔ring (focus indicator — WCAG 1.4.11 Non-text Contrast + 2.4.7 Focus Visible).'
    when: '@qa rodou `pnpm check:contrast` em re-execução INDEPENDENTE.'
    then: 'PASS — SUMMARY: 27/27 pairs PASS (WCAG AA). Ratios reproduzidos identicamente aos do Dev Agent Record. Light: bg↔fg 17.85, primary↔pf 5.70, muted↔mf 6.92, destructive↔df 4.83, bg↔ring 5.70. Dark: bg↔fg 19.06, primary↔pf 5.87, muted↔mf 5.81, destructive↔df 6.20, bg↔ring 7.31. Brand: bg↔fg 14.20, primary↔pf 5.70, muted↔mf 7.57, destructive↔df 6.47, bg↔ring 5.31. Todos os pares ≥ threshold respectivo.'
    verdict: PASS
    coverage: 'pnpm check:contrast (27 checks executados em re-execução @qa independente; output completo anexado abaixo em "Independent Gate Re-run"). Script é hermético (zero dep externa, algoritmo W3C 2.1 fórmula padrão).'
    notes: 'DEV-3 honrado: script manual entregue nesta story; integração CI (gate bloqueador em PRs) consolidada em Story 3.5 com Lighthouse CI. AC4 admite literalmente "CI ou manual" — interpretação correta. DEV-5 (par background↔border → background↔ring): re-validado pelo @qa — WCAG 1.4.11 aplica-se a "componentes UI grandes" funcionais (focus ring é exigido por 2.4.7, exemplos canônicos); bordas decorativas de cards NÃO se qualificam ("componentes UI grandes" do PRD L114 são funcionais — inputs, focus, controles — não bordas estéticas). Refinamento de método válido; paleta em globals.css preservada (shadcn convention slate-200/zinc-800/violet-300 borders mantidas). Tech-debt aceito: duplicação manual paleta↔script (Comment header explícito "MANTER EM SINCRONIA" + entrada backlog [STORY-3.2-F1] LOW priority).'

  - ac: 'AC5: Page snapshot tests cobrem renderização em cada tema.'
    given: 'tests/components/features/public/PublicPage.test.tsx (62 LOC) usa it.each(THEMES) gerando 3 snapshot cases (light/dark/brand) + assertions adicionais de defesa em profundidade (data-theme correto + .dark class condicional). 3 snapshots gerados em __snapshots__/PublicPage.test.tsx.snap. DEV-4 (snapshot HTML-only) justificado: jsdom 29 + Tailwind 4 @theme inline não resolve CSS vars de stylesheets externas confiavelmente (Story 3.1 DEV-1).'
    when: '@qa re-executou em isolamento: `pnpm test:components -- tests/components/features/public/PublicPage.test.tsx tests/components/features/links/LinkRow.test.tsx tests/components/features/profile/UsernameForm.test.tsx` resultou em 19/19 files / 118/118 tests PASS — confirma que os 3 cases novos (light/dark/brand) passam consistentemente sem regressão nos vizinhos.'
    then: 'PASS — 3 snapshots HTML-only capturam: (i) wrapper top-level <div data-theme="light|dark|brand" className="min-h-screen bg-background text-foreground [dark|]">; (ii) <main> + <h1>/<p>/<ul> intermediários idênticos nos 3; (iii) <PublicLinkCard> interior idêntico nos 3 (li>a>svg+span). Diff entre os 3 snaps é EXCLUSIVAMENTE no atributo data-theme do wrapper e na classe dark (theme==="dark"). Assertion adicional toHaveAttribute("data-theme", theme) previne regressão silenciosa de snapshot update sem wrapper. Assertion className match/notMatch /\\bdark\\b/ valida classe condicional.'
    verdict: PASS
    coverage: 'tests/components/features/public/PublicPage.test.tsx 3 cases × (1 snapshot + 1 attribute assertion + 1 class assertion) = 9 assertions total. Re-execução isolada @qa: 118/118 tests PASS (componentes project completo). Snapshot file inspecionado manualmente — diff entre temas confirmado conforme esperado.'
    notes: 'DEV-4 honrado: snapshot HTML-only é estratégia documentada e endossada (Story 3.1 DEV-1 + 3.2 DEV-4). Validação visual real fica para `pnpm check:contrast` (programática, AC4) + `/dev/themes` showcase (manual, suporte AC1) + smoke `pnpm dev` (browser real, opcional para QA). Sem regressão em outros snapshots (PublicLinkCard.test.tsx.snap pré-existente intacto — re-execução isolada confirmou).'

