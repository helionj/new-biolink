    finding: 'Tech-debt: scripts/check-contrast.mjs#PALETTES duplica manualmente os hex de app/globals.css. Mitigação atual: comentário "MANTER EM SINCRONIA" no header do script + entrada [STORY-3.2-F1] em docs/STORY-BACKLOG.md (LOW priority).'
    suggested_action: 'Endereçar em [STORY-3.2-F1] (refactor parser CSS automatizado). Detectável manualmente em code review (diff de PR mostra ambos os arquivos). Não-bloqueante.'

