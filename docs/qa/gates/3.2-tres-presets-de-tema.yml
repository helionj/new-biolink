decisions_review:
  - decision: 'DEV-1: Dashboard mantém light default — aplicação user-specific deferida para Story 3.3'
    source: '@sm draft v0.1'
    validated_by: '@po gate v0.2 (GO 9.5/10)'
    qa_verdict: ENDORSED
    qa_note: 'Não re-litigado (convenção 2.3+). Interpretação semântica de AC2 ("consistentemente" = vocabulário cross-theme uniforme, não mecanismo de seleção por surface) é arquiteturalmente sólida. Schema atual não tem profiles.theme; introduzir DDL nesta story violaria Constitution Art. IV sem doc-fonte e antecipa Story 3.3 sem a UI de seleção. AC2 satisfeito pela combinação: (i) wrapper em PublicPage aplica page.theme; (ii) primitives shadcn cross-surface via @theme inline; (iii) /dev/themes showcase prova visualmente os 3 temas em qualquer surface.'
  - decision: 'DEV-2: Brand color #7C3AED adotado do PRD seed sem convocar @ux-design-expert'
    source: '@sm draft v0.1'
    validated_by: '@po gate v0.2'
    qa_verdict: ENDORSED
    qa_note: 'Não re-litigado. AC3 admite literalmente "#7C3AED ou definido por @ux-design-expert" — escolha do seed é válida e Constitutional (PRD L127 doc-fonte explícito). Tons derivados (violet-50/100/200/300/600/800/950) são Tailwind 4 default — zero hex inventado. Abrir story dedicada se identidade visual completa (tipografia, logo, voice) for priorizada no futuro; documentado em docs/architecture.md "Open Questions".'
  - decision: 'DEV-3: Gate manual pnpm check:contrast nesta story; CI gate consolidado em Story 3.5'
    source: '@sm draft v0.1'
    validated_by: '@po gate v0.2'
    qa_verdict: ENDORSED
    qa_note: 'Não re-litigado. AC4 admite literalmente "CI ou manual". Script funcional + idempotente — promoção para CI é refactor simples (chamar em workflow .yml). Consolidar com Lighthouse CI em Story 3.5 ([STORY-1.9-F1] também candidato) faz sentido arquitetural — evita workflow CI dedicado para um único gate.'
  - decision: 'DEV-4: Snapshot HTML-only (sem CSS computed)'
    source: '@sm draft v0.1'
    validated_by: '@po gate v0.2'
    qa_verdict: ENDORSED
    qa_note: 'Não re-litigado. jsdom 29 + Tailwind 4 @theme inline não resolve CSS vars de stylesheets externas confiavelmente (precedente Story 3.1 DEV-1 dev test strategy). Snapshot HTML-only + assertion adicional de atributo data-theme + classe .dark é estratégia defensiva sólida — pega regressão silenciosa de snapshot update sem wrapper. Validação visual real coberta por (i) pnpm check:contrast programático e (ii) /dev/themes showcase manual.'
  - decision: 'DEV-5: Par background↔border substituído por background↔ring no script; --destructive dark #ef4444 → #b91c1c'
    source: '@dev YOLO execution v0.3 (autonomous, complementa DEV-1..DEV-4)'
    validated_by: '@dev decision-log no Completion Notes da story'
    qa_verdict: ENDORSED
    qa_note: 'Re-validado pelo @qa. (i) background↔ring: WCAG 1.4.11 Non-text Contrast aplica-se a "componentes UI grandes" funcionais (focus ring, inputs, controles) — exigido por WCAG 2.4.7 Focus Visible. Bordas decorativas de cards são identificadas por conteúdo + hover + position, não pela borda — não se qualificam como "componente UI grande" do PRD L114. Refinamento de método válido; paleta em globals.css preservada (shadcn convention slate-200/zinc-800/violet-300 borders mantidas). (ii) --destructive dark #b91c1c (red-700 Tailwind default): substituição justificada — #ef4444 (red-500) contra #fafafa foreground falha AA em dark (3.61 < 4.5). red-700 atinge 6.20:1 ≥ 4.5; consistente com brand preset (que já usa #b91c1c). Constitutional Art. IV preservado.'

